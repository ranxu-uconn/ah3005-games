<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission 8: The mock survey | AH/STAT 3005</title>
<style>

:root{
  --paper:#F2F6F7; --card:#FFFFFF; --ink:#17252D; --muted:#53636B; --line:#CBD6DB; --line-strong:#728891;
  --teal:#15656C; --teal-deep:#0C474C; --teal-wash:#E1EEEF; --on-teal:#FFFFFF;
  --good:#256A40; --good-wash:#E3F1E7; --bad:#9E2F28; --bad-wash:#F7E4E2;
  --amber:#7F500B; --amber-wash:#F7EDDA;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F181C; --card:#162228; --ink:#E2EBEE; --muted:#9DAEB5; --line:#2C3C43; --line-strong:#6B8087;
    --teal:#6DBAC1; --teal-deep:#96D2D7; --teal-wash:#173338; --on-teal:#08181B;
    --good:#86CD9E; --good-wash:#1A3224; --bad:#F29A92; --bad-wash:#3A211F;
    --amber:#E6B96C; --amber-wash:#382C17;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--sans)}
.bar{position:sticky;top:0;z-index:5;background:var(--teal-deep);color:#fff;border-bottom:3px solid var(--teal)}
@media (prefers-color-scheme: dark){.bar{background:#0B2427;color:var(--ink)}}
.bar-in{max-width:780px;margin:0 auto;padding:.55rem 1.1rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar-title{font-family:var(--serif);font-size:1.02rem;font-weight:600}
.bar-meta{display:flex;gap:1.1rem;align-items:center;font-size:.86rem}
.meter{display:flex;align-items:center;gap:.45rem}
.meter-track{width:92px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.meter-fill{height:100%;background:#9FE0C0;transition:width .35s ease}
main{max-width:780px;margin:0 auto;padding:1.6rem 1.1rem 4rem}
h1{font-family:var(--serif);font-size:2rem;line-height:1.2;margin:.2rem 0 .9rem;font-weight:600}
h2{font-family:var(--serif);font-size:1.3rem;line-height:1.3;margin:0 0 .8rem;font-weight:600}
p{margin:0 0 .9rem;max-width:68ch}
.where{color:var(--ink);font-size:1rem;margin:0}
.lede{font-size:1.1rem}
.memo{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:4px 10px 10px 4px;padding:1rem 1.2rem .3rem;margin:1.1rem 0 1.3rem}
.memo-from{font-weight:600;margin-bottom:.45rem;font-size:.95rem;color:var(--teal-deep)}
.memo p{max-width:none}
.output{margin:1rem 0 1.2rem;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem .5rem}
.output figcaption{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:.93rem;margin-bottom:.4rem}
.out-note{display:block;font-weight:400;color:var(--ink);font-size:.92rem}
.scroll{overflow-x:auto}
/* a table wider than the screen gets a right-edge shadow and becomes keyboard-scrollable */
.scroll.more{box-shadow:inset -15px 0 12px -12px rgba(0,0,0,.4)}
.scroll.more:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.scrollnote{font-size:.78rem;color:var(--muted);margin:.15rem 0 0}
table{border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:.86rem;min-width:100%}
@media (max-width:520px){.output table{font-size:.76rem}.output th,.output td{padding:.4rem .3rem}}
th,td{padding:.35rem .55rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
thead th{border-bottom:2px solid var(--ink);font-weight:700;vertical-align:bottom;white-space:normal;min-width:4.2rem}
tbody th{text-align:left;font-weight:600}
thead th:first-child{text-align:left}
.step{border-top:1px solid var(--line);padding-top:1.2rem;margin-top:.6rem}
.step-count{color:var(--muted);font-size:.9rem;margin-bottom:.3rem}
.prompt{font-size:1.18rem}
.opts{display:grid;gap:.55rem;margin:.9rem 0}
.opt{display:flex;gap:.7rem;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line-strong);border-radius:8px;padding:.75rem .9rem;cursor:pointer}
.opt:hover:not([aria-disabled="true"]){border-color:var(--teal)}
.opt-mark{flex:0 0 1.35rem;height:1.35rem;border-radius:50%;border:1.5px solid var(--muted);margin-top:.12rem;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.opt.wrong{background:var(--bad-wash);border-color:var(--bad);cursor:default}
.opt.wrong .opt-mark{border-color:var(--bad);color:var(--bad)}
.opt.wrong .opt-mark::after{content:"\2715"}
.opt.right{background:var(--good-wash);border-color:var(--good)}
.opt.right .opt-mark{border-color:var(--good);background:var(--good);color:var(--card)}
.opt.right .opt-mark::after{content:"\2713"}
.opt.locked:not(.right):not(.wrong){opacity:.55;cursor:default}
.fb{margin:.3rem 0 .8rem}
.fb-box{border-radius:8px;padding:.8rem 1rem .1rem;border:1px solid}
.fb-box.good{background:var(--good-wash);border-color:var(--good)}
.fb-box.bad{background:var(--bad-wash);border-color:var(--bad)}
.fb-head{font-weight:700;margin-bottom:.3rem}
.hint{background:var(--amber-wash);border:1px solid var(--amber);border-radius:8px;padding:.75rem 1rem .1rem;margin:.4rem 0 .8rem}
.hint .fb-head{color:var(--amber)}
button{font:inherit}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:8px;padding:.7rem 1.25rem;font-weight:600;cursor:pointer}
.primary:hover{background:var(--teal-deep)}
@media (prefers-color-scheme: dark){.primary:hover{background:var(--teal-deep)}}
.quiet{background:transparent;color:var(--teal-deep);border:1.5px solid var(--teal);border-radius:8px;padding:.6rem 1.05rem;font-weight:600;cursor:pointer}
.linkish{background:none;border:0;color:var(--teal-deep);text-decoration:underline;cursor:pointer;padding:.3rem 0;font-size:.95rem}
.actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}
:focus-visible{outline:3px solid #E0A526;outline-offset:2px}
.outro{border-top:1px solid var(--line);margin-top:1rem;padding-top:1.2rem}
.takeaway{background:var(--teal-wash);border-radius:8px;padding:.8rem 1rem}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 .8rem;padding:.6rem .9rem .7rem;background:var(--card)}
legend{font-weight:600;padding:0 .3rem}
.radios{display:flex;gap:1.2rem;flex-wrap:wrap}
.radios label{display:flex;gap:.4rem;align-items:center;cursor:pointer}
/* Two choices side by side: a bare radio sits 9px from its own text but only
   19px from the NEXT option, so which text belongs to which button is ambiguous.
   Each option gets its own box instead. */
.seg{display:flex;gap:.6rem;flex-wrap:wrap;margin:.1rem 0 .6rem;position:relative}
.seg input{position:absolute;width:1px;height:1px;opacity:0;margin:0}
.seg label{flex:1 1 9rem;display:flex;align-items:flex-start;gap:.5rem;
  border:1.5px solid var(--line-strong);border-radius:9px;
  padding:.6rem .7rem;cursor:pointer;background:var(--card);color:var(--ink);line-height:1.3}
.seg label::before{content:"";flex:0 0 auto;width:14px;height:14px;border-radius:50%;
  border:2px solid var(--line-strong);margin-top:.12rem}
.seg input:checked+label{border-color:var(--teal);border-width:2px;padding:calc(.6rem - .5px) calc(.7rem - .5px);
  background:var(--teal-wash);font-weight:600}
.seg input:checked+label::before{border-color:var(--teal);
  background:radial-gradient(circle,var(--teal) 0 45%,transparent 47%)}
.seg input:focus-visible+label{outline:2px solid var(--teal);outline-offset:2px}
.stats{display:flex;gap:2rem;flex-wrap:wrap;margin:1rem 0 1.4rem}
.stat b{display:block;font-family:var(--serif);font-size:2rem;line-height:1.1;font-weight:600}
.stat span{color:var(--muted);font-size:.9rem}
.review{margin:0 0 1.2rem;padding:0;list-style:none}
.review li{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.review .st{white-space:nowrap;font-weight:600}
.st.ok{color:var(--good)} .st.retry{color:var(--amber)}
main>h2{margin-top:1.8rem}
.submit-box{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:4px 10px 10px 4px;padding:1rem 1.2rem}
.kpis{display:flex;gap:.6rem;flex-wrap:wrap;margin:0 0 .9rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.45rem .85rem;min-width:7rem}
.kpi b{display:block;font-family:var(--serif);font-size:1.3rem;line-height:1.25}
.kpi span{font-size:.8rem;color:var(--muted)}
.vizfig{margin:.5rem 0 1rem;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem .3rem}
.viz{display:block;width:100%;height:auto}
.vizcap{font-size:.95rem;color:var(--ink);margin:.25rem 0 .1rem}
.viz text{font:12px var(--sans);fill:var(--muted)}
.viz .v-strong{fill:var(--ink);font-weight:600}
.viz .v-reflab{fill:var(--amber);font-weight:600}
.viz .v-altlab{fill:var(--teal);font-weight:600}
.viz .v-t1lab{fill:var(--bad);font-weight:600}
.v-axis,.v-grid{stroke:var(--line);stroke-width:1}
.v-dot{fill:var(--teal);opacity:.85}
.v-ref{stroke:var(--amber);stroke-width:2;stroke-dasharray:5 4}
.v-down{stroke:var(--teal);stroke-width:1.6;opacity:.65}
.v-up{stroke:var(--bad);stroke-width:1.8;opacity:.8}
.v-flat{stroke:var(--muted);stroke-width:1.4;opacity:.6}
.v-curve{fill:none;stroke:var(--ink);stroke-width:2}
.v-shade{fill:var(--teal);opacity:.4}
.v-null{fill:none;stroke:var(--muted);stroke-width:2}
.v-alt{fill:none;stroke:var(--teal);stroke-width:2.5}
.v-pow{fill:var(--teal);opacity:.28}
.v-t1{fill:var(--bad);opacity:.45}
.v-bar{stroke:var(--teal);stroke-width:7;stroke-linecap:round}
.v-est{fill:var(--card);stroke:var(--teal);stroke-width:3}
.v-mean{stroke:var(--ink);stroke-width:3}
.status{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--good);border-radius:4px 10px 10px 4px;padding:.75rem 1rem .1rem;margin-bottom:.9rem}
.status.mixed{border-left-color:var(--amber)}
.status-icon{font-size:1.35rem;line-height:1.3;font-weight:700;color:var(--good)}
.status.mixed .status-icon{color:var(--amber)}
.status-title{font-weight:700;margin-bottom:.15rem}
.react{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin:.3rem 0 .8rem}
.react.good{border-left:5px solid var(--good)}.react.bad{border-left:5px solid var(--amber)}.react.pending{border-left:5px solid var(--line)}
.react-head{display:flex;gap:.7rem;align-items:center}
.react-name{font-weight:700;margin:0;font-size:.88rem;color:var(--muted)}
.react-line{margin:0;font-size:1.06rem}
.react-body{margin-top:.55rem}
.react-note{border-top:1px solid var(--line);margin-top:.6rem;padding-top:.5rem}
.react-action{margin:0 0 .2rem;color:var(--muted);font-style:italic}
.typing{margin:0}.typing span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--muted);animation:rvblink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes rvblink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.opt.chosen{border-color:var(--amber);background:var(--amber-wash)}
.delta{margin-left:.35rem;font-weight:700;animation:rvpop 1.3s ease forwards}
@keyframes rvpop{0%{opacity:0;transform:translateY(4px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.typing span,.delta{animation:none}}
.draft{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1.1rem;margin:.8rem 0;font-family:var(--serif);font-size:1.05rem;line-height:2}
.draft-title{font-family:var(--sans);font-size:.85rem;font-weight:700;color:var(--muted);margin:0 0 .2rem;line-height:1.4}
.draft p{margin:0}
.sent{font:inherit;background:none;border:0;border-bottom:2px dotted var(--muted);color:var(--ink);cursor:pointer;padding:0 .15rem;text-align:left;display:inline;line-height:1.7}
.sent:hover:not([aria-disabled="true"]){background:var(--amber-wash)}
.sent.chosen,.ecard.chosen,.pick.chosen,.pickpanel.chosen{background:var(--amber-wash);border-color:var(--amber)}
.sent.wrong{background:var(--bad-wash);text-decoration:line-through}.sent.right{background:var(--good-wash);border-bottom:2px solid var(--good)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.6rem;margin:.8rem 0}
.ecard{font:inherit;text-align:left;background:var(--card);border:1.5px solid var(--line-strong);border-radius:10px;padding:.75rem .85rem;min-height:5.5rem;cursor:pointer;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.ecard:hover:not([aria-disabled="true"]){border-color:var(--teal);transform:translateY(-1px)}
.etag{display:block;font-size:.72rem;font-weight:700;letter-spacing:.02em;color:var(--teal-deep);margin-bottom:.3rem}
.ecard.wrong{background:var(--bad-wash);border-color:var(--bad)}.ecard.right{background:var(--good-wash);border-color:var(--good)}
.pick{font:inherit;background:none;border:1.5px dashed var(--teal);border-radius:5px;padding:.05rem .35rem;cursor:pointer;color:var(--ink)}
.pick:hover:not([aria-disabled="true"]){background:var(--teal-wash)}
.pick.wrong,.pickpanel.wrong{background:var(--bad-wash);border-color:var(--bad)}.pick.right,.pickpanel.right{background:var(--good-wash);border-color:var(--good);border-style:solid}
.pickpanel{display:block;width:100%;text-align:left;background:none;border:2px dashed var(--teal);border-radius:10px;padding:.35rem .5rem;margin:.2rem 0 .5rem;cursor:pointer;font:inherit;color:var(--ink)}
.pickpanel .vizfig{margin:.2rem 0}
.tiles{display:flex;flex-wrap:wrap;gap:.45rem}
.tile{font:inherit;font-size:.95rem;background:var(--card);border:1.5px solid var(--line-strong);border-radius:999px;padding:.35rem .85rem;cursor:pointer;color:var(--ink)}
.tile[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.headline{font-family:var(--serif);font-size:1.15rem;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:6px;padding:.7rem 1rem;margin:.7rem 0}
.claim{font-size:1.05rem}
.recap{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:10px;padding:.7rem .95rem .3rem;margin:.4rem 0 .8rem;color:var(--ink);font-size:1rem;line-height:1.5}.recap-h{font-weight:700;margin:0 0 .35rem}.recap p,.recap li{margin:.2rem 0 .45rem}.recap ul{margin:.2rem 0 .4rem;padding-left:1.2rem}
.thread{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem;margin:.7rem 0}
.thread.email{border-top:5px solid var(--teal);border-radius:6px}
.mailhead{display:flex;flex-direction:column;gap:.1rem;font-size:.88rem;border-bottom:1px solid var(--line);padding-bottom:.45rem;margin-bottom:.55rem}
.msgs{display:flex;flex-direction:column;gap:.45rem}
.msg{max-width:88%;padding:.5rem .8rem;border-radius:14px;background:var(--teal-wash);align-self:flex-start}
.msg.you{align-self:flex-end;background:var(--amber-wash)}
.email .msg{max-width:100%;border-radius:6px}
.msg-who{display:block;font-size:.72rem;font-weight:700;color:var(--muted)}
.asks{display:flex;flex-wrap:wrap;gap:.4rem;margin:.7rem 0 .2rem}
.ask{font:inherit;font-size:.92rem;border:1.5px solid var(--teal);background:var(--card);color:var(--teal-deep);border-radius:999px;padding:.3rem .85rem;cursor:pointer}
.ask:disabled{opacity:.45;cursor:default}
.compose{border-top:1px solid var(--line);margin-top:.7rem;padding-top:.5rem}
.slotrow{margin:.45rem 0}
/* per-row marking after a multi-part answer is sent */
.rowstat{font-weight:700;margin-left:.4rem}
.row-ok .rowstat{color:var(--good)}
.row-bad .rowstat{color:var(--bad)}
.row-ok{border-left:4px solid var(--good);padding-left:.55rem}
.row-bad{border-left:4px solid var(--bad);padding-left:.55rem}
.row-ok .tile[aria-pressed="true"]:disabled{opacity:1;cursor:default}
.tile[hidden]{display:none}
.build tr.row-ok,.build tr.row-bad{border-left:0;padding-left:0}
.build tr.row-ok th{box-shadow:inset 4px 0 0 var(--good)}
.build tr.row-bad th{box-shadow:inset 4px 0 0 var(--bad)}
.build select:disabled{opacity:1;color:var(--ink)}
.build th .where{display:block}
.build th .rowstat{display:block;margin:0;font-size:.85rem}
.build th .rowstat:empty{display:none}
#hintText:empty{display:none}
.slotlab{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:.2rem}
.draftmsg{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:.5rem .8rem;margin:.6rem 0;min-height:2.4rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){body{font-size:16px}h1{font-size:1.65rem}.bar-meta{gap:.7rem}.meter-track{width:60px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

.viz .v-null2{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-dasharray:7 5}.viz .v-alt2{fill:none;stroke:var(--teal);stroke-width:3}

.map-wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.4rem;margin:.6rem 0}
#mapsvg{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer;border-radius:6px}
#mapsvg:focus-visible{outline:3px solid #E0A526}
.m-floor{fill:#E9EEF0}.m-corr{fill:#DCE4E7}.m-wall{fill:#34474F}
.r1{fill:#F3E6DA}.r2{fill:#E2EEF6}.r3{fill:#F6E3E6}.r4{fill:#E8E4F3}.r5{fill:#E3F1E6}.r6{fill:#F6EFD9}.r7{fill:#E1EEEF}
.m-label{font:600 15px var(--sans);fill:#34474F}
.m-name{font:600 11px var(--sans);fill:#34474F}
.m-init{font:700 12px var(--sans);fill:#fff}
.m-deco{fill:#34474F;opacity:.12}
.mk-need{fill:#E0A526}.mk-done{fill:#2E7D4F}.mk-wait{fill:#9AA8AE}
.mk-t{font:800 15px var(--sans);fill:#fff}
@media (prefers-color-scheme: dark){.m-floor{fill:#223239}.m-corr{fill:#1B292F}.m-wall{fill:#0A1215}.r1{fill:#3A2E25}.r2{fill:#23323D}.r3{fill:#3B2A2E}.r4{fill:#2D2A3B}.r5{fill:#23352A}.r6{fill:#3A3422}.r7{fill:#1F3538}.m-label,.m-name{fill:#D5E0E4}}
.toast{min-height:2.9rem;background:var(--amber-wash);border:1px solid var(--amber);border-radius:8px;padding:.55rem .9rem;margin:.4rem 0;font-size:.95rem}
.toast:empty{background:transparent;border-color:transparent}
.quest{font-size:.95rem;margin:.2rem 0 .3rem}
.controls{display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap;margin-top:.5rem}
.dpad{display:grid;grid-template-columns:repeat(3,3rem);grid-template-rows:repeat(2,3rem);gap:.3rem}
.dpad button{font-size:1.2rem;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
.dir{flex:1;min-width:15rem}
.dir h2{font-size:1.05rem;margin:.1rem 0 .4rem}
.dir ul{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.dir button{width:100%;text-align:left;font:inherit;font-size:.9rem;background:var(--card);color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:.4rem .6rem;cursor:pointer;display:flex;justify-content:space-between;gap:.5rem}
.dir .tag{font-size:.78rem;font-weight:700;white-space:nowrap}
.tag.need{color:var(--amber)}.tag.done{color:var(--good)}.tag.wait{color:var(--muted)}
.talk-head{display:flex;gap:1rem;align-items:center;margin:.3rem 0 .6rem}
.talk-head h1{margin:0 0 .15rem}
.who{margin:0;color:var(--muted)}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.85rem 1.1rem .1rem;margin:.4rem 0 1rem}
.bubble::before{content:"";position:absolute;top:-9px;left:28px;width:16px;height:16px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.slider{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.6rem .9rem;margin:.5rem 0}
.slider input{width:100%}
.swatches{display:flex;gap:.8rem;margin:.4rem 0 1rem}
.swatches label{display:flex;flex-direction:column;align-items:center;gap:.3rem;cursor:pointer;font-size:.85rem}
.swatch{width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid transparent}
.swatches input{position:absolute;opacity:0}
.swatches input:checked+.swatch{border-color:var(--ink)}
.swatches input:focus-visible+.swatch{outline:3px solid #E0A526}
 .m-clue{fill:#FFFFFF;stroke:#34474F;stroke-width:2}.m-clue-l{stroke:#34474F;stroke-width:2}
.build{width:100%;border-collapse:collapse;margin:.4rem 0 .8rem;font-size:.92rem}
.build th,.build td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);white-space:normal}
.build code{font-weight:700}
.build select{font:inherit;padding:.3rem;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink)}
.typ{font-size:.75rem;font-weight:700;padding:.1rem .4rem;border-radius:4px;background:var(--teal-wash);color:var(--teal-deep);white-space:nowrap}
.notes{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .9rem;margin:0 0 1rem}
.notes summary{font-weight:700;cursor:pointer}
.note{border-top:1px solid var(--line);padding-top:.5rem;margin-top:.5rem}

.hand{font-family:"Patrick Hand","Segoe Print","Bradley Hand",cursive}
.art{position:relative;margin:.9rem 0}
.art p{margin:.3rem 0}
.art svg{display:block;width:100%;height:auto;max-width:34rem;margin:.3rem 0}
/* sticky note: paper stays yellow in dark mode, like a real one */
.art-sticky{background:#FFF1A6;color:#2A2410;max-width:21rem;padding:.9rem .95rem .6rem;transform:rotate(var(--tilt,-1.5deg));box-shadow:0 4px 10px rgba(0,0,0,.2);border-radius:2px}
.art-sticky p{font-size:1.18rem;line-height:1.32}
.art-sticky .sig{text-align:right;font-size:.95rem}
.art-sticky::before{content:"";position:absolute;top:-8px;left:50%;width:64px;height:17px;margin-left:-32px;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.08);transform:rotate(3deg)}
/* whiteboard */
.art-wb{background:#FDFEFE;color:#1D3F95;border:9px solid #B7BEC5;border-radius:6px;padding:.7rem .95rem;box-shadow:0 3px 8px rgba(0,0,0,.14)}
.art-wb .mk,.art-wb h3{font-family:"Patrick Hand","Marker Felt","Chalkboard SE",cursive}
.art-wb h3{font-size:1.45rem;font-weight:400;margin:0 0 .2rem;color:#1D3F95}
.art-wb .mk{font-size:1.2rem}
.mk-red{color:#B0261E}.mk-green{color:#1B6B39}
/* printed memo or email */
.art-memo{background:#FFFFFF;color:#222;border:1px solid #D5D5D5;box-shadow:3px 4px 0 #E4DFD3;padding:.8rem 1rem;max-width:36rem;overflow:hidden}
.memo-head{display:grid;grid-template-columns:auto 1fr;gap:.05rem .6rem;font-size:.85rem;border-bottom:1px solid #DDD;padding-bottom:.45rem;margin:0 0 .5rem}
.memo-head dt{font-weight:700;color:#555}.memo-head dd{margin:0}
.art-memo.coffee::after{content:"";position:absolute;right:-34px;bottom:-40px;width:92px;height:92px;border-radius:50%;border:7px solid rgba(120,72,30,.16);pointer-events:none}
/* poster or notice pinned to a board */
.art-flyer{background:#FFFDF5;color:#1F2A2E;border:1px solid #E2DCCB;padding:1.05rem 1rem .8rem;box-shadow:0 3px 8px rgba(0,0,0,.13);max-width:32rem}
.art-flyer::before{content:"";position:absolute;top:7px;left:50%;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:#C0392B;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.flyer-title{font-family:var(--serif);font-size:1.3rem;font-weight:700;color:#0C474C;margin:.2rem 0 .1rem}
.flyer-sub{font-size:.85rem;color:#4A5A60;margin:0 0 .4rem}
/* a peek at the data file: a screen, so it follows the theme */
.art-sheet{border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--card);max-width:36rem}
.sheet-bar{display:flex;justify-content:space-between;gap:.4rem;flex-wrap:wrap;background:#1B6B45;color:#FFFFFF;padding:.3rem .6rem;font-size:.82rem;font-family:var(--sans);margin:0}
.sheet-file{font-weight:700}
.art-sheet table{font-family:var(--sans);font-size:.84rem;border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums;margin:0}
.art-sheet table th,.art-sheet table td{border:1px solid var(--line);padding:.22rem .45rem;text-align:left;white-space:nowrap}
@media (max-width:520px){.art-sheet table{font-size:.74rem}.art-sheet table th,.art-sheet table td{padding:.2rem .3rem}.art-sheet .rn{width:1.2rem}}
.art-sheet thead th{background:var(--paper);min-width:0;border-bottom:1px solid var(--line-strong);vertical-align:bottom;white-space:normal}
.art-sheet .rn{background:var(--paper);color:var(--muted);font-weight:400;text-align:center;width:1.8rem}
.art-sheet tr.more td{color:var(--muted);font-style:italic}
.toast .art-sheet table{min-width:100%}
.sheet-key{font-size:.92rem;color:var(--ink);padding:.3rem .6rem;margin:0;border-top:1px solid var(--line)}
.clue-row{display:flex;gap:.35rem;flex-wrap:wrap;margin:.25rem 0 .2rem .6rem}
.dir .clue-btn{width:auto;font-size:.82rem;padding:.25rem .55rem}
.toast table{font-size:.82rem;min-width:0}
.notes td,.toast td,.notes th,.toast th{text-align:left;white-space:normal}.notes figcaption:empty,.toast figcaption:empty{display:none}
.side{display:grid;grid-template-columns:1fr;gap:.2rem}
@media (max-width:620px){.side{grid-template-columns:1fr}}

/* week 7+: SPSS crosstabs and footnotes */
.out-foot{font-family:Arial,Helvetica,sans-serif;font-size:.9rem;color:var(--ink);margin:.45rem 0 0;max-width:none}
.xt tbody tr.grp>*{border-top:2px solid var(--line-strong)}
.xt th[scope="rowgroup"]{text-align:left;vertical-align:top}
.xt tbody th.stat{font-weight:400;color:var(--muted);text-align:left;white-space:normal;min-width:5.5rem;max-width:8rem;line-height:1.25}
@media (max-width:520px){.xt th[scope="rowgroup"]{white-space:normal;min-width:3.2rem}}
.xt thead th[scope="colgroup"]{text-align:center;border-bottom:1px solid var(--line)}
.narr{font-style:italic;color:var(--muted);margin:.3rem 0 .8rem;font-size:.98rem}
</style>
</head>

function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,tmp=x+5.5;tmp-=(x+0.5)*Math.log(tmp);let ser=1.000000000190015;for(let j=0;j<6;j++){y+=1;ser+=c[j]/y;}return -tmp+Math.log(2.5066282746310005*ser/x);}
function betacf(a,b,x){const MAXIT=300,EPS=3e-12,FPMIN=1e-300;const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;}return h;}
function betai(a,b,x){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
function tcdf(t,df){const x=df/(df+t*t);const tail=0.5*betai(df/2,0.5,x);return t>=0?1-tail:tail;}
function tinv(p,df){let lo=-80,hi=80;for(let i=0;i<200;i++){const m=(lo+hi)/2;if(tcdf(m,df)<p)lo=m;else hi=m;}return (lo+hi)/2;}
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
function ncdf(z){return 0.5*(1+erf(z/Math.SQRT2));}
function zinv(p){let lo=-10,hi=10;for(let i=0;i<100;i++){const m=(lo+hi)/2;if(ncdf(m)<p)lo=m;else hi=m;}return (lo+hi)/2;}
function twoSidedP(t,df){return 2*(1-tcdf(Math.abs(t),df));}
function power2(d,n,alpha){return ncdf(d*Math.sqrt(n/2)-zinv(1-alpha/2));}
function welchDf(s1,n1,s2,n2){const a=s1*s1/n1,b=s2*s2/n2;return (a+b)*(a+b)/(a*a/(n1-1)+b*b/(n2-1));}

function makeRng(seed){let a=seed>>>0;const next=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  return {u:next,uni:(lo,hi)=>lo+(hi-lo)*next(),int:(lo,hi)=>lo+Math.floor(next()*(hi-lo+1)),
    normal:(m,s)=>{let u=0,v=0;while(u===0)u=next();while(v===0)v=next();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}};}

function fx(x,d=2){const r=Number(x).toFixed(d);return r==="-0."+"0".repeat(d)?(0).toFixed(d):r;}
function fP(p){return p<0.001?"&lt;.001":p.toFixed(3).replace(/^0\./,".");}
function fPtext(p){return p<0.001?"p &lt; .001":"p = "+fP(p);}
function tbl(title,note,heads,rows){
  const txt=x=>String(x).replace(/<[^>]+>/g,"").replace(/&lt;/g,"less than ").replace(/&gt;/g,"greater than ").replace(/&nbsp;/g," ").replace(/"/g,"").trim();
  const label=(c,i,rowHead)=>{
    if(typeof c!=="string"||c.indexOf('class="pick"')<0||c.indexOf("aria-label")>=0)return c;
    const head=txt(heads[i]),rh=txt(rowHead),val=txt(c);
    const name=[head,rh].filter(Boolean).join(", ")+(val?": "+val:"");
    return c.replace('<button class="pick"',`<button class="pick" aria-label="${name}"`);
  };
  return `<figure class="output"><figcaption>${title}${note?`<span class="out-note">${note}</span>`:""}</figcaption><div class="scroll"><table><thead><tr>${heads.map(h=>`<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th scope="row">${c}</th>`:`<td>${label(c,i,r[0])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></figure>`;
}

/* Six-column SPSS tables cannot fit a phone, so they scroll. Mark the ones that

function markScrollers(root){try{(root||document).querySelectorAll(".scroll").forEach(d=>{
  const over=d.scrollWidth-d.clientWidth>2;d.classList.toggle("more",over);
  if(over){d.setAttribute("tabindex","0");d.setAttribute("role","region");
    if(!d.getAttribute("aria-label")){const f=d.closest(".output"),c=f&&f.querySelector("figcaption");
      d.setAttribute("aria-label",(c?c.textContent.trim().slice(0,60):"Table")+" (scrolls sideways)");}}
  else{d.removeAttribute("tabindex");d.removeAttribute("role");d.removeAttribute("aria-label");}});}catch(e){}}
window.addEventListener("resize",()=>markScrollers());

function b32sum(p){let c=0;for(let i=0;i<p.length;i++)c=(c+(i+1)*(B32.indexOf(p[i])+7))%1024;return B32[c>>5]+B32[c&31];}
function encodeCareer(d){
  let v=0n;const put=(val,bits)=>{v=(v<<BigInt(bits))|(BigInt(val)&((1n<<BigInt(bits))-1n));};
  put(1,3);let wm=0;d.weeks.forEach(w=>{if(w>=1&&w<=15)wm|=1<<(w-1);});put(wm,15);
  put(Math.max(0,Math.min(100,Math.round(d.rep))),7);
  CAST_IDS.forEach(k=>put(Math.max(1,Math.min(3,d.trust[k]||1))-1,2));
  let fm=0n;FLAG_BITS.forEach((f,i)=>{if(d.flags[f])fm|=1n<<BigInt(i);});v=(v<<32n)|fm;
  put(Math.max(0,DANA_N.indexOf(d.danaN)),2);put(Math.max(0,DANA_A.indexOf(d.danaA)),2);
  let p="";for(let i=14;i>=0;i--)p+=B32[Number((v>>BigInt(5*i))&31n)];
  return `RIV-${p.slice(0,5)}-${p.slice(5,10)}-${p.slice(10)}${b32sum(p)}`;
}
function decodeCareer(code){
  const s=String(code||"").trim().toUpperCase().replace(/^RIV/,"").replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");
  if(s.length!==17||[...s].some(ch=>B32.indexOf(ch)<0))return null;
  const p=s.slice(0,15);if(b32sum(p)!==s.slice(15))return null;
  let v=0n;for(const ch of p)v=(v<<5n)|BigInt(B32.indexOf(ch));
  const take=bits=>{const x=Number(v&((1n<<BigInt(bits))-1n));v>>=BigInt(bits);return x;};
  const d=seasonDefault();d.danaA=DANA_A[take(2)]??0.05;d.danaN=DANA_N[take(2)]??100;
  const fm=v&0xFFFFFFFFn;v>>=32n;d.flags={};FLAG_BITS.forEach((f,i)=>{d.flags[f]=Number((fm>>BigInt(i))&1n);});
  [...CAST_IDS].reverse().forEach(k=>{d.trust[k]=take(2)+1;});d.rep=take(7);
  const wm=take(15);d.weeks=[];for(let w=1;w<=15;w++)if(wm&(1<<(w-1)))d.weeks.push(w);
  if(take(3)!==1)return null;return d;
}

/* ---------- ANOVA calculations ---------- */
function oneway(groups){const all=groups.flat(),N=all.length,k=groups.length,g=mean(all);
  const SSB=groups.reduce((s,a)=>s+a.length*(mean(a)-g)**2,0),SSW=groups.reduce((s,a)=>{const m=mean(a);return s+a.reduce((t,v)=>t+(v-m)**2,0);},0);
  const dfB=k-1,dfW=N-k,MSB=SSB/dfB,MSW=SSW/dfW,F=MSB/MSW;return {N,k,SSB,SSW,dfB,dfW,MSB,MSW,F,p:fSurv(F,dfB,dfW)};}
function scheffe(groups,names,a){const out=[];for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++){
  const d=mean(groups[i])-mean(groups[j]),Fp=(d*d/(a.MSW*(1/groups[i].length+1/groups[j].length)))/(a.k-1);
  out.push({a:names[i],b:names[j],d,p:fSurv(Fp,a.k-1,a.dfW)});}return out;}
function aovRows(a,label){return [["Between Groups",fx(a.SSB,3),a.dfB,fx(a.MSB,3),fx(a.F,3),fP(a.p)],["Within Groups",fx(a.SSW,3),a.dfW,fx(a.MSW,3),"",""],["Total",fx(a.SSB+a.SSW,3),a.N-1,"","",""]];}

/* ---------- regression / ANCOVA / mixed ANOVA / MANOVA helpers ---------- */
function ssxy(x,y){const mx=mean(x),my=mean(y);let sxx=0,syy=0,sxy=0;
  for(let i=0;i<x.length;i++){sxx+=(x[i]-mx)**2;syy+=(y[i]-my)**2;sxy+=(x[i]-mx)*(y[i]-my);}
  return {sxx,syy,sxy,mx,my,b:sxy/sxx,r:sxy/Math.sqrt(sxx*syy)};}
function ancova(G){ // G = [{name,x,y}]
  const k=G.length,N=G.reduce((s,g)=>s+g.y.length,0);
  const allx=G.flatMap(g=>g.x),ally=G.flatMap(g=>g.y);
  const T=ssxy(allx,ally);
  let Wxx=0,Wyy=0,Wxy=0;G.forEach(g=>{const s=ssxy(g.x,g.y);Wxx+=s.sxx;Wyy+=s.syy;Wxy+=s.sxy;});
  const b=Wxy/Wxx;                                   // pooled within-group slope
  const SSEw=Wyy-Wxy*Wxy/Wxx, dfE=N-k-1;             // error adjusted for covariate
  const SSEt=T.syy-T.sxy*T.sxy/T.sxx;                // error ignoring group
  const SSg=SSEt-SSEw, dfG=k-1;                      // group effect, adjusted
  const SScv=Wxy*Wxy/Wxx, MSE=SSEw/dfE;
  const Fg=(SSg/dfG)/MSE, Fc=SScv/MSE;
  const adj=G.map(g=>mean(g.y)-b*(mean(g.x)-T.mx));
  const raw=G.map(g=>mean(g.y));
  return {k,N,b,SSg,dfG,SScv,SSEw,dfE,MSE,Fg,Fc,pG:fSurv(Fg,dfG,dfE),pC:fSurv(Fc,1,dfE),
          adj,raw,grandX:T.mx,names:G.map(g=>g.name)};}
function slopesTest(G){ // homogeneity of regression slopes: group x covariate interaction
  const k=G.length,N=G.reduce((s,g)=>s+g.y.length,0);
  let Wxx=0,Wyy=0,Wxy=0,SSEsep=0;
  G.forEach(g=>{const s=ssxy(g.x,g.y);Wxx+=s.sxx;Wyy+=s.syy;Wxy+=s.sxy;SSEsep+=s.syy-s.sxy*s.sxy/s.sxx;});
  const SSEcommon=Wyy-Wxy*Wxy/Wxx;
  const SSint=SSEcommon-SSEsep, dfI=k-1, dfE=N-2*k, MSE=SSEsep/dfE;
  const F=(SSint/dfI)/MSE;
  return {SSint,dfI,SSEsep,dfE,MSE,F,p:fSurv(F,dfI,dfE),slopes:G.map(g=>ssxy(g.x,g.y).b)};}
function mixedAnova(rows,t){ // rows = [{g:groupName, y:[t values]}]
  const groups=[...new Set(rows.map(r=>r.g))],k=groups.length;
  const all=rows.flatMap(r=>r.y),N=rows.length,G=mean(all);
  const SStot=all.reduce((s,v)=>s+(v-G)**2,0);
  const subjMean=rows.map(r=>mean(r.y));
  const SSbs=t*subjMean.reduce((s,v)=>s+(v-G)**2,0);
  const gMean=groups.map(gr=>mean(rows.filter(r=>r.g===gr).flatMap(r=>r.y)));
  const gN=groups.map(gr=>rows.filter(r=>r.g===gr).length);
  const SSa=groups.reduce((s,gr,i)=>s+t*gN[i]*(gMean[i]-G)**2,0), dfA=k-1;
  const SSsa=SSbs-SSa, dfSA=N-k;
  const tMean=[];for(let j=0;j<t;j++)tMean.push(mean(rows.map(r=>r.y[j])));
  const SSt=N*tMean.reduce((s,v)=>s+(v-G)**2,0), dfT=t-1;
  let SSat=0;groups.forEach((gr,i)=>{const sub=rows.filter(r=>r.g===gr);
    for(let j=0;j<t;j++){const cell=mean(sub.map(r=>r.y[j]));SSat+=gN[i]*(cell-gMean[i]-tMean[j]+G)**2;}});
  const dfAT=(k-1)*(t-1);
  const SSws=SStot-SSbs, SSts=SSws-SSt-SSat, dfTS=(t-1)*(N-k);
  const MSsa=SSsa/dfSA, MSts=SSts/dfTS;
  const Fa=(SSa/dfA)/MSsa, Ft=(SSt/dfT)/MSts, Fat=(SSat/dfAT)/MSts;
  return {groups,k,t,N,SSa,dfA,Fa,pA:fSurv(Fa,dfA,dfSA),SSsa,dfSA,MSsa,
          SSt,dfT,Ft,pT:fSurv(Ft,dfT,dfTS),SSat,dfAT,Fat,pAT:fSurv(Fat,dfAT,dfTS),SSts,dfTS,MSts,
          cell:groups.map(gr=>{const sub=rows.filter(r=>r.g===gr);const o=[];for(let j=0;j<t;j++)o.push(mean(sub.map(r=>r.y[j])));return o;})};}
function manova2(G){ // one-way MANOVA, two outcomes; exact F via Wilks for p=2
  const k=G.length,N=G.reduce((s,g)=>s+g.a.length,0);
  const A=G.flatMap(g=>g.a),B=G.flatMap(g=>g.b),ma=mean(A),mb=mean(B);
  const sc=(xs,ys,mx,my)=>{let s=0;for(let i=0;i<xs.length;i++)s+=(xs[i]-mx)*(ys[i]-my);return s;};
  const Taa=sc(A,A,ma,ma),Tbb=sc(B,B,mb,mb),Tab=sc(A,B,ma,mb);
  let Waa=0,Wbb=0,Wab=0;
  G.forEach(g=>{const ga=mean(g.a),gb=mean(g.b);Waa+=sc(g.a,g.a,ga,ga);Wbb+=sc(g.b,g.b,gb,gb);Wab+=sc(g.a,g.b,ga,gb);});
  const detW=Waa*Wbb-Wab*Wab, detT=Taa*Tbb-Tab*Tab, L=detW/detT;
  const rt=Math.sqrt(L), df1=2*(k-1), df2=2*(N-k-1);
  const F=((1-rt)/rt)*((N-k-1)/(k-1));
  return {L,F,df1,df2,p:fSurv(F,df1,df2),
          a:oneway(G.map(g=>g.a)),b:oneway(G.map(g=>g.b))};}

function pctile(sorted,p){const n=sorted.length,pos=p*(n+1);if(pos<=1)return sorted[0];if(pos>=n)return sorted[n-1];const k=Math.floor(pos),f=pos-k;return sorted[k-1]+f*(sorted[k]-sorted[k-1]);}

function dotPlot(v,o){const W=360,H=196,L=18,Rt=344,base=150,X=sc(0,o.xmax,L,Rt),bin=o.bin||6,stack={};

  const m=mean(v),md=median(v);
  const ticksX=ticks(0,o.xmax,6).map(t=>`<line class="v-axis" x1="${X(t)}" x2="${X(t)}" y1="${base}" y2="${base+5}"/><text x="${X(t)}" y="${base+18}" text-anchor="middle">${t}</text>`).join("");
  return vz(W,H,`Dot plot of ${v.length} door-to-needle times in minutes. Median ${fx(md,1)}, mean ${fx(m,1)}. Longest ${Math.max(...v)}.`,
    `<line class="v-axis" x1="${L}" x2="${Rt}" y1="${base}" y2="${base}"/>${ticksX}${dots}

     <text x="${(L+Rt)/2}" y="${H-6}" text-anchor="middle">Minutes from arrival to treatment</text>`,o.cap);}

function powerBar(pw){const W=360,H=58,L=10,Rt=350,X=v=>L+(Rt-L)*v;

function case2(R,level){ // Dr. Nair: describing skewed data, outliers, and what a confidence interval says
  let v,n,s,q1,q3,iqr,fence,top,m,md,sd,lo,hi;
  for(let k=0;k<800;k++){
    n=2*R.int(19,22)+1;v=[];
    for(let i=0;i<n-4;i++)v.push(Math.round(Math.exp(R.normal(Math.log(48),.22))));
    for(let i=0;i<3;i++)v.push(R.int(76,118));
    v.push(R.int(175,240));
    s=[...v].sort((a,b)=>a-b);q1=pctile(s,.25);q3=pctile(s,.75);iqr=q3-q1;fence=q3+1.5*iqr;top=s.slice(-5);
    m=mean(v);md=median(v);sd=sdv(v);const t=tinv(.975,n-1),se=sd/Math.sqrt(n);lo=m-t*se;hi=m+t*se;
    const above=top.filter(x=>x>fence),firstAbove=top.findIndex(x=>x>fence);
    if(above.length>=2&&firstAbove>=1&&top.every(x=>Math.abs(x-fence)>=2)&&new Set(top).size===5&&m-md>=4&&lo<60&&hi>60&&s[0]>=q1-1.5*iqr)break;}
  const fz=x=>Number.isInteger(Math.round(x*100)/10)?fx(x,1):fx(x,2);
  const first=top.find(x=>x>fence);
  const below=s.filter(x=>x<=fence),wHi=Math.max(...below),wLo=s[0],outs=s.filter(x=>x>fence);
  const sumTbl=tbl("Box plot summary","Door-to-needle time, minutes. Outliers are times outside the whiskers.",["Statistic","Minutes"],
    [["Q1 (25th percentile)",fx(q1,1)],["Median (50th percentile)",fx(md,1)],["Q3 (75th percentile)",fx(q3,1)],["Lower whisker ends at",wLo],["Upper whisker ends at",wHi],["Outliers",outs.join(", ")]]);

    g+=`<line x1="${X(wLo)}" x2="${X(q1)}" y1="${ym}" y2="${ym}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(q3)}" x2="${X(wHi)}" y1="${ym}" y2="${ym}" stroke="var(--ink)" stroke-width="1.5"/>`;
    g+=`<line x1="${X(wLo)}" x2="${X(wLo)}" y1="${ym-8}" y2="${ym+8}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(wHi)}" x2="${X(wHi)}" y1="${ym-8}" y2="${ym+8}" stroke="var(--ink)" stroke-width="1.5"/>`;
    g+=`<rect x="${X(q1)}" y="${y0}" width="${X(q3)-X(q1)}" height="${y1-y0}" fill="var(--teal-wash)" stroke="var(--teal)" stroke-width="2"/><line x1="${X(md)}" x2="${X(md)}" y1="${y0}" y2="${y1}" stroke="var(--teal)" stroke-width="3"/>`;
    g+=`<text x="${X(wLo)}" y="${ym+24}" text-anchor="middle">${wLo}</text><text x="${X(wHi)}" y="${ym-14}" text-anchor="middle" class="v-strong">${wHi}</text>`;
    outs.forEach((o,i)=>{g+=`<circle cx="${X(o)}" cy="${ym+(i%2?7:-7)}" r="5" fill="none" stroke="var(--bad)" stroke-width="2"/>`;});
    g+=`<text x="${X(Math.max(...outs))}" y="${ym-18}" text-anchor="end" class="v-t1lab">outliers</text>`;
    return vz(W,H,`Box plot of ${n} door-to-needle times. Q1 ${fx(q1,1)}, median ${fx(md,1)}, Q3 ${fx(q3,1)}. Whiskers end at ${wLo} and ${wHi} minutes. ${outs.length} outliers outside the whiskers, drawn as circles: ${outs.join(", ")} minutes.`,g,
      "Box: Q1 to Q3, with the median inside. Lines on each side: the whiskers, ending at the numbers shown. Circles: outliers, outside the whiskers.");})();
  const k=v.filter(x=>x>fence).length;
  const errSent=level?`In 95% of future quarters, our mean door-to-needle time will fall between ${fx(lo,1)} and ${fx(hi,1)} minutes.`
    :`There is a 95% chance our true mean door-to-needle time is between ${fx(lo,1)} and ${fx(hi,1)} minutes.`;
  const longest=Math.max(...v),second=s[n-2];
  return {id:"c2",npc:"nair",title:"Page four of the annual report",facts:{n,m,md,lo,hi},

       thread:["Your report leads with the median, not the mean. Why?"],
       slots:[
        {label:"The times",options:[{t:"The times are right-skewed: a few very long cases pull the mean up,",tag:"correct"},{t:"The times are roughly normal, so the mean and median agree,",tag:"skew_confusion",fb:"Look at the dot plot: most times bunch together, with a long tail to the right. Drag the slider and watch the mean move."},{t:"The times are skewed, and the long cases pull the median up,",tag:"skew_confusion",fb:"Drag the slider: the median hardly moves when the longest case changes. It's the mean the long cases pull up."}]},
        {label:"So",options:[{t:"so the median describes a typical patient better here.",tag:"correct"},{t:"so the median is always a better summary than the mean, whatever the shape.",tag:"skew_confusion",fb:"Not always. For symmetric data the mean works well and uses every value; the median wins here because these times are skewed."}]}],
       okFb:"For skewed data, the median describes the typical patient; the mean is pulled toward the tail."},
      {id:"c2s2",label:"Outliers",type:"reply",channel:"chat",narr:"Nair circles the dots beyond the upper whisker in red, then hesitates.",show:box+sumTbl,
       prompt:"Dr. Nair wants to know whether the surveyor is just picking on the longest cases. Build your reply.",
       hint:["Look at the box plot: find where the upper whisker ends, and the circles beyond it.",`Only times outside the whiskers are outliers; the upper whisker ends at ${wHi} minutes. They're real patients, so they stay in the data, which is why the report leads with the median.`],
       thread:[`She says ${k} of our times are "outliers." Is she just picking the longest ones?`],
       slots:[

          {t:"Yes: any time over the 60-minute national target counts as an outlier,",tag:"outlier_rule",fb:"The 60-minute target is a goal, not an outlier rule. On a box plot, outliers are the points outside the whiskers."},
          {t:"Yes: the five longest times always count as outliers, however close they sit to the rest,",tag:"outlier_rule",fb:`Only times outside the whiskers count. Here that's ${k}, not five: look for the circles beyond the upper whisker.`}]},
        {label:"So",options:[{t:"but they're real patients, so they stay in, and we lead with the median.",tag:"correct"},
          {t:"so we should delete them before the report goes out, to protect the mean.",tag:"outlier_rule",fb:"They do pull the mean, but they're real patients. Deleting real data to improve a number isn't honest; leading with the median handles them."}]}],
       okFb:"An outlier is a point outside the box plot's whiskers, not just a long time. Real patients stay in the data; the median isn't thrown by them."},
      {id:"c2s3",label:"The circled sentence",type:"spot",show:`<p class="where">The report's door-to-needle summary:</p>${tbl("Descriptives","Door-to-needle time, minutes",["Statistic","Value"],[["N",n],["Mean",fx(m,1)],["Median",fx(md,1)],["Std. Deviation",fx(sd,1)],["95% CI for Mean, Lower",fx(lo,1)],["95% CI for Mean, Upper",fx(hi,1)]])}`,
       narr:"Nair reads page four aloud, faster and faster, then stops at the third sentence.",
       prompt:"Dr. Nair: \"She circled the one sentence that's wrong! Which is it?\" Click the sentence that misstates what the 95% confidence interval means.",
       hint:["One sentence gives the confidence interval a meaning it doesn't have. Read each one that mentions 95%.","A 95% CI doesn't give the probability that the true mean is inside it, and it doesn't predict future means. The 95% describes how often the method captures the true mean over repeated samples."],
       draftTitle:"Riverbend Stroke Center annual report, page 4 (one sentence is wrong)",
       draft:[
        {t:`Median door-to-needle time for our last ${n} patients was ${fx(md,1)} minutes.`,tag:"ci_misread",fb:"That's an accurate summary of the data."},
        {t:`The mean was ${fx(m,1)} minutes (95% CI ${fx(lo,1)} to ${fx(hi,1)}), pulled up by ${k} unusually long cases.`,tag:"ci_misread",fb:"That reports the interval without claiming what it means. Fine."},
        {t:errSent,tag:"correct",fb:level?"That's one of the common misconceptions listed in the lecture slides: the interval doesn't predict where future means will fall. The 95% describes the method: across repeated samples, about 95% of intervals built this way contain the true mean.":"That's the classic misreading. The true mean is fixed; it's either in the interval or not. The 95% describes the method: across repeated samples, about 95% of intervals built this way contain the true mean."},

function case3(R,level){ // Marcus: which ANOVA? (repeated measures at entry level, mixed design when advanced)
  const weeks=["Week 0","Week 6","Week 12"],n=level?10:12,progs=["Standard","Intensive"];

    (level?progs:["All"]).forEach((g,gi)=>{for(let i=0;i<n;i++){const b=R.normal(330,60);rows.push({g,y:gains[gi].map(d=>Math.round(b+d+R.normal(0,16)))});}});
    mx=mixedAnova(rows,3);
    if(level?(mx.pT<.001&&mx.pAT<.02&&mx.pAT>.0005):(mx.pT<.001))break;}
  const within=tbl("Tests of Within-Subjects Effects","Dependent variable: 6-minute walk distance (m)",["Source","Sum of Squares","df","Mean Square","F","Sig."],
    level?[["Visit",fx(mx.SSt,1),mx.dfT,fx(mx.SSt/mx.dfT,1),pk(fx(mx.Ft,3),"fv"),pk(fP(mx.pT),"sigv")],
           ["Visit × Program",fx(mx.SSat,1),mx.dfAT,fx(mx.SSat/mx.dfAT,1),pk(fx(mx.Fat,3),"fvp"),pk(fP(mx.pAT),"sigvp")],
           ["Error(Visit)",fx(mx.SSts,1),mx.dfTS,fx(mx.MSts,1),"",""]]
         :[["Visit",fx(mx.SSt,1),pk(mx.dfT,"dfv"),fx(mx.SSt/mx.dfT,1),pk(fx(mx.Ft,3),"fv"),pk(fP(mx.pT),"sigv")],
           ["Error(Visit)",fx(mx.SSts,1),mx.dfTS,fx(mx.MSts,1),"",""]]);
  const between=level?tbl("Tests of Between-Subjects Effects","",["Source","Sum of Squares","df","Mean Square","F","Sig."],
    [["Program",fx(mx.SSa,1),mx.dfA,fx(mx.SSa/mx.dfA,1),pk(fx(mx.Fa,3),"fp"),pk(fP(mx.pA),"sigp")],["Error",fx(mx.SSsa,1),mx.dfSA,fx(mx.MSsa,1),"",""]]):"";
  const vars=[["patient_id","Patient ID","ID"],["visit","Visit (week 0, 6 or 12)","categorical",3],["walk_m","6-minute walk distance (m)","numeric"],["age","Age (years)","numeric"],["sex","Sex","categorical",2]];
  if(level)vars.splice(1,0,["program","Rehab program (standard or intensive)","categorical",2]);
  const progMeans=mx.cell.map(r=>mean(r)),pSig=mx.pA<.05;
  const picks=level?{sigp:{tag:"correct",fb:`That's the main effect of program: ${pT(mx.pA)}. Averaged across all three visits, intensive patients walked ${fx(progMeans[1],0)} m and standard patients ${fx(progMeans[0],0)} m. ${pSig?"That overall difference is significant.":"That overall difference isn't significant: the data don't show a difference in average walking distance between the programs."} The Visit × Program interaction is significant too (${pT(mx.pAT)}), so the gap between programs isn't the same at every visit; report the two together.`},
      fp:{tag:"output_misread",fb:"That's the F for program. The Sig. beside it is what you compare with 0.05."},
      sigvp:{tag:"interaction_misread",fb:"That's the Visit × Program interaction: whether the programs changed walking by different amounts over the 12 weeks. Ms. Farrow asked about overall walking distance, averaged across the visits."},
      fvp:{tag:"interaction_misread",fb:"That's the F for the Visit × Program interaction, about whether the change over time differed. She asked about the programs overall."},

/* ---------- the analysis builder (ANOVA family), as in Week 6 ---------- */
function analysisName(b,vars,spec){const f=b.factors,cv=b.covs||[];
  if(!f.length)return cv.length?"No analysis (no factor chosen)":"No analysis (no factor chosen)";
  if(cv.length)return f.length===1?"ANCOVA":"Two-way ANCOVA";
  if(f.length===1){const lv=(vars.find(v=>v[0]===f[0])||[])[3]||3;return b.repeated?"One-way repeated measures ANOVA":lv===2?"Independent-samples t test":"One-way ANOVA";}
  return b.repeated?"Mixed design ANOVA":"Two-way ANOVA";}
/* ---------- builder feedback: one verdict and one reason per row ---------- */
function shortName(p){const n=p.name.split(",")[0];return n.startsWith("Dr.")?"Dr. "+n.split(" ").pop():n.split(" ")[0];}
function buildReason(type,want,got,F,nm){
  if(want===""){
    if(got==="outcome")return `isn't the measurement ${nm} is asking about.`;
    if(got==="factor"){if(type==="ID")return `is just an ID label, so it can't be a ${F}.`;if(type==="numeric")return `is a number, and a ${F} has to be a grouping.`;return `isn't part of ${nm}'s question.`;}
    if(type==="ID")return "is just an ID label, so there's nothing to hold constant.";
    if(type==="categorical")return "is a grouping, and a covariate has to be a number measured beforehand.";
    return "isn't the measurement that differed between the groups at the start.";}
  if(want==="outcome"){if(got==="")return `is the measurement ${nm} wants to compare, so it's the outcome.`;if(got==="factor")return `is the number being compared, so it's the outcome, not a ${F}.`;return "is the later measurement being compared, so it's the outcome.";}
  if(want==="factor"){if(got==="")return `is part of ${nm}'s question, so it belongs in the analysis as a ${F}.`;if(got==="outcome")return "is a grouping, not the number being compared.";return `is a grouping, so it's a ${F}, not a covariate.`;}
  if(got==="")return "was measured before treatment and differs between the groups, so it needs holding constant as a covariate.";
  if(got==="factor")return "is a number, so it goes in as a covariate, not a factor.";
  return "was measured at the start; the outcome is the later measurement.";}
function designReason(want,got,tmode){
  if(got==null)return "<strong>Design question:</strong> it needs an answer too.";
  const D="<strong>Design question:</strong> ";
  if(tmode){
    if(want==="same")return D+(got==="groups"?"each patient appears at both visits, so these aren't two separate groups of people.":"there's no fixed target value here; the comparison is between two visits by the same patients.");
    if(want==="groups")return D+(got==="same"?"each patient was in only one group, so nobody was measured twice.":"there are two groups to compare, not one group against a fixed value.");
    return D+"there's one group of patients, compared with a fixed target value.";}
  return D+(want==="yes"?"the same people were measured more than once.":"each person was in one group only, so nobody was measured more than once.");}
function evalBuild(spec,b){
  const type=v=>(spec.vars.find(x=>x[0]===v)||[])[2];
  const cv=b.covs||[];
  if(b.outcomes.length!==1||b.outcomes[0]!==spec.outcome)return "outcome_misread";
  if(spec.mode==="ancova"){
    if(b.factors.some(f=>type(f)==="ID"))return "id_as_factor";
    if(b.factors.some(f=>type(f)==="numeric"))return "numeric_as_factor";
    if(!b.factors.length)return "no_factor";
    if(cv.some(c=>type(c)==="ID"))return "id_as_covariate";
    if(cv.some(c=>type(c)==="categorical"))return "covariate_categorical";
    if(!cv.length)return "no_covariate";
    if(cv.length!==spec.covs.length||!spec.covs.every(c=>cv.includes(c)))return "wrong_covariate";
    if(b.factors.length!==spec.factors.length||!spec.factors.every(f=>b.factors.includes(f)))return "extra_factor";
    return "correct";}
  if(cv.length)return "covariate_categorical";
  if(b.factors.some(f=>type(f)==="ID"))return "id_as_factor";
  if(b.factors.some(f=>type(f)==="numeric"))return "numeric_as_factor";
  if(!b.factors.length)return "no_factor";
  if(b.repeated===null)return "no_design";
  if(b.repeated!==spec.repeated)return spec.repeated?"ignore_dependence":"false_repeated";
  const want=spec.factors,have=b.factors;
  if(have.length<want.length&&have.every(f=>want.includes(f)))return "lose_factor_structure";
  if(have.length!==want.length||!want.every(f=>have.includes(f)))return "extra_factor";
  return "correct";}

  ROOMS.forEach(r=>{s+=`<rect x="${r.x0*TS}" y="${r.y0*TS}" width="${(r.x1-r.x0+1)*TS}" height="${(r.y1-r.y0+1)*TS}" class="${r.c}"/>`;});
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(GRID[y][x]==="#")s+=`<rect x="${x*TS}" y="${y*TS}" width="${TS}" height="${TS}" class="m-wall"/>`;
  ROOMS.forEach(r=>{const top=r.y0===0;s+=`<text class="m-label" x="${(r.x0+1)*TS+8}" y="${top?(r.y0+1)*TS+22:(r.y0+1)*TS+22}">${r.name}</text>`;
});
  s+=`<text class="m-label" x="${4*TS}" y="${7*TS+26}" opacity=".45">Main corridor</text><rect class="m-deco" x="${12*TS}" y="${6*TS+4}" width="${3*TS}" height="10" rx="4"/><text class="m-name" x="${13*TS+20}" y="${8*TS+28}" text-anchor="middle" opacity=".7">Guest desk</text>`;
  CLUES.forEach(c=>{const cx=c.x*TS+TS/2,cy=c.y*TS+TS/2,read=S.clues.includes(c.id);
    s+=`<g><rect class="m-clue" x="${cx-11}" y="${cy-14}" width="22" height="28" rx="3"/><line class="m-clue-l" x1="${cx-6}" x2="${cx+6}" y1="${cy-5}" y2="${cy-5}"/><line class="m-clue-l" x1="${cx-6}" x2="${cx+6}" y1="${cy+1}" y2="${cy+1}"/><line class="m-clue-l" x1="${cx-6}" x2="${cx+3}" y1="${cy+7}" y2="${cy+7}"/>`+(read?"":`<g transform="translate(${cx+12},${cy-16})"><circle r="8" class="mk-need"/><text class="mk-t" y="5" text-anchor="middle" style="font-size:12px">?</text></g>`)+`</g>`;});
  NPCS.forEach(p=>{const cx=p.x*TS+TS/2,cy=p.y*TS+TS/2,st=npcStatus(p);
    s+=`<g class="npc" data-id="${p.id}"><circle cx="${cx}" cy="${cy}" r="16" fill="${p.color}" stroke="#fff" stroke-width="2"/><text class="m-init" x="${cx}" y="${cy+4}" text-anchor="middle">${p.initials}</text><text class="m-name" x="${cx}" y="${cy+32}" text-anchor="middle">${p.name.split(",")[0]}</text>`;
    if(st!=="wait")s+=`<g transform="translate(${cx+14},${cy-22})"><circle r="10" class="${st==="need"?"mk-need":"mk-done"}"/><text class="mk-t" y="5" text-anchor="middle">${st==="need"?"!":"✓"}</text></g>`;
    s+=`</g>`;});
  s+=`<g id="player" style="transition:transform .11s linear" transform="translate(${S.pos[0]*TS+TS/2},${S.pos[1]*TS+TS/2})"><circle r="16" fill="${S.avatar}" stroke="#fff" stroke-width="3"/><text class="m-init" y="4" text-anchor="middle">You</text></g>`;
  return s;
}
function renderMap(){
  mapActive=true;setBar(signText());
  const quest=S.done.length<4?`Get sign-offs from 4 teams (${S.done.length} of 4 so far), then report to Dr. Brooks.`:"All 4 sign-offs collected. Take the report to Dr. Brooks in the Quality Office.";
  app.innerHTML=`<h1 class="sr" tabindex="-1">Hospital map</h1><p class="quest"><strong>Task:</strong> ${quest}</p>
    <div id="toast" class="toast" aria-live="polite"></div>
    <div class="map-wrap"><svg id="mapsvg" viewBox="0 0 ${COLS*TS} ${ROWS*TS}" tabindex="0" role="application" aria-label="Hospital map. Use arrow keys to walk. The staff list below the map is an alternative.">${mapSvg()}</svg></div>
    <div class="controls">
      <div class="dpad" aria-label="Movement buttons"><button class="up" data-d="0,-1" aria-label="Up">▲</button><button class="left" data-d="-1,0" aria-label="Left">◀</button><button class="down" data-d="0,1" aria-label="Down">▼</button><button class="right" data-d="1,0" aria-label="Right">▶</button></div>
      <div class="dir" id="dir">${dirHtml()}</div>
    </div>`;
  const svg=document.getElementById("mapsvg");
  svg.addEventListener("click",ev=>{const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());const tx=Math.floor(q.x/TS),ty=Math.floor(q.y/TS);
    const npc=NPCS.find(p=>p.x===tx&&p.y===ty)||CLUES.find(c=>c.x===tx&&c.y===ty);if(npc)goTo(npc);else walkTo(tx,ty,null);});
  app.querySelectorAll(".dpad button").forEach(b=>b.onclick=()=>{const [dx,dy]=b.dataset.d.split(",").map(Number);step(dx,dy);});

function dirHtml(){return `<h2>People and places</h2><ul>${NPCS.map(p=>{const st=npcStatus(p);const cl=p.kind==="core"?`<div class="clue-row">${roomClues(p.idx).map(c=>`<button class="clue-btn" data-clue="${c.id}">${S.clues.includes(c.id)?"✓":"?"} ${c.name}</button>`).join("")}</div>`:"";return `<li><button data-go="${p.id}"><span>${p.name.split(",")[0]}, ${p.room}</span><span class="tag ${st}">${statusText(p)}</span></button>${cl}</li>`;}).join("")}</ul>`;}
function bindDir(){app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>goTo(NPCS.find(p=>p.id===b.dataset.go)));app.querySelectorAll("[data-clue]").forEach(b=>b.onclick=()=>goTo(CLUES.find(c=>c.id===b.dataset.clue)));}
function refreshMap(){const svg=document.getElementById("mapsvg");if(!svg)return;const pos=S.pos;svg.innerHTML=mapSvg();document.getElementById("dir").innerHTML=dirHtml();bindDir();}
function inspect(c){
  if(S.lock[c.idx]==null)S.lock[c.idx]=S.level;
  const room=NPCS.find(p=>p.idx===c.idx).room,isNew=!S.clues.includes(c.id);if(isNew)S.clues.push(c.id);
  toast(`<p class="fb-head">${c.name}, ${room}</p>${c.html(S.lock[c.idx])}<p class="where">${isNew?"Added to your notes.":"Already in your notes."}</p>`);
  save();refreshMap();
}
function focusMap(){const s=document.getElementById("mapsvg");if(s)s.focus({preventScroll:true});}
function movePlayer(){const p=document.getElementById("player");if(p)p.setAttribute("transform",`translate(${S.pos[0]*TS+TS/2},${S.pos[1]*TS+TS/2})`);}
function free(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS&&GRID[y][x]==="."&&!NPCS.some(p=>p.x===x&&p.y===y)&&!CLUES.some(c=>c.x===x&&c.y===y);}
function step(dx,dy){
  if(!mapActive)return;walking=null;const nx=S.pos[0]+dx,ny=S.pos[1]+dy;const npc=NPCS.find(p=>p.x===nx&&p.y===ny);
  if(npc)return interact(npc);const cl=CLUES.find(c=>c.x===nx&&c.y===ny);if(cl)return inspect(cl);if(free(nx,ny)){S.pos=[nx,ny];movePlayer();}
}
function bfs(targets){
  const key=(x,y)=>x+","+y,prev={},q=[S.pos];prev[key(...S.pos)]=null;
  while(q.length){const [x,y]=q.shift();if(targets.some(t=>t[0]===x&&t[1]===y)){const path=[];let k=key(x,y);while(prev[k]){path.unshift(k.split(",").map(Number));k=prev[k];}return path;}
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy,k=key(nx,ny);if(!(k in prev)&&free(nx,ny)){prev[k]=key(x,y);q.push([nx,ny]);}});}
  return null;
}
function walkTo(tx,ty,npc){
  const targets=npc?[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[npc.x+dx,npc.y+dy]).filter(t=>free(t[0],t[1])):[[tx,ty]];
  const path=bfs(targets);if(!path)return;const token={};walking=token;const act=o=>o.html?inspect(o):interact(o);
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tick=()=>{if(walking!==token||!mapActive)return;if(!path.length){walking=null;if(npc)act(npc);return;}S.pos=path.shift();movePlayer();setTimeout(tick,reduce?15:95);};tick();
}
function goTo(npc){walkTo(null,null,npc);}
document.addEventListener("keydown",ev=>{
  if(!mapActive||ev.target.closest("button,input,textarea,select,a"))return;
  const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]}[ev.key];
  if(!d)return;ev.preventDefault();const now=Date.now();if(now-lastStep<85)return;lastStep=now;step(...d);
});

function interact(p){
  const first=p.name.split(" ")[0]==="Dr."?p.name.split(",")[0]:p.name.split(" ")[0];
  if(p.kind==="cameo")return toast(`<strong>${first}:</strong> "${(WEEK.cameo[p.id]||(()=>"Busy week. Come find me later."))(SEASON)}"`);
  if(p.kind==="stats"){if(!S.pendingFU&&S.hiddenUnlocked&&!S.hiddenDone&&WEEK.hidden)return startUnit(WEEK.hidden(),"hidden",null,p);if(S.pendingFU)return startUnit(FOLLOWUPS[S.pendingFU](),"fu",null,p);return toast(`<strong>Jordan:</strong> "Nothing for now. If you get stuck in a consult, call me for a hint."`);}
  if(p.kind==="admin"){if(S.done.length<4)return toast(`<strong>Dr. Brooks:</strong> "I need all four sign-offs for the report. You have ${S.done.length} of 4."`);return finalReport();}
  if(S.pendingFU)return toast(`<strong>${first}:</strong> "Jordan from Statistics was looking for you. Go see them first."`);
  if(p.kind==="expert"){if(S.expDone.length)return toast(`<strong>${first}:</strong> "${WEEK.expertThanks}"`);return startUnit(expertCase(),"expert",null,p);}
  if(S.done.includes(p.idx))return toast(`<strong>${first}:</strong> "Thanks again! You already have my sign-off."`);
  const missing=roomClues(p.idx).filter(c=>!S.clues.includes(c.id));
  if(missing.length)return toast(`<strong>${first}:</strong> "Hi! Before we sit down, take a look at the ${missing.map(c=>c.name.toLowerCase()).join(" and the ")} first."`);
  const lvl=S.lock[p.idx]??S.level;startUnit(CORE[p.idx](coreRng(p.idx),lvl),"core",lvl,p);
}

function startUnit(unit,kind,lvl,npc){
  mapActive=false;walking=null;setBar(signText());
  app.innerHTML=`<div class="talk-head">${portrait(npc)}<div><p class="where">${npc.room}</p><h1 tabindex="-1">${unit.title}</h1><p class="who">${npc.name}, ${npc.role}</p></div></div>
    ${unit.scene?`<p class="narr">${unit.scene}</p>`:""}<div class="bubble">${npcLine(npc)}${unit.message}</div>${kind==="core"?`<details class="notes" open><summary>Your notes from this room</summary>${roomClues(npc.idx).map(c=>`<div class="note">${c.html(lvl)}</div>`).join("")}</details>`:""}${unit.cards?kpis(unit.cards):""}<div id="vizSlot">${unit.viz&&!(unit.steps[0].spec||unit.steps[0].reveal)?unit.viz:""}</div><div id="steps"></div>`;
  window.scrollTo(0,0);app.querySelector("h1").focus({preventScroll:true});

function showStep(unit,i,kind,lvl){
  const box=document.getElementById("steps");if(i>=unit.steps.length)return showOutro(unit,kind,lvl);
  const st=unit.steps[i],rec=S.results[st.id]||(S.results[st.id]={first:null,hintBefore:false}),n=unit.steps.length;

    ${st.type==="build"?`<table class="build"><thead><tr><th scope="col">Variable</th><th scope="col">Type</th><th scope="col">Role</th></tr></thead><tbody>${st.spec.vars.map((v,k)=>`<tr data-brow="${v[0]}"><th scope="row"><label for="role-${v[0]}"><code>${v[0]}</code><span class="rowstat"></span><span class="where">${v[1]}</span></label></th><td><span class="typ">${v[2]}</span></td><td><select id="role-${v[0]}" data-var="${v[0]}" aria-label="Role for ${v[0]}"><option value="">Not used</option><option value="outcome">Outcome</option><option value="factor">Factor</option>${st.spec.mode==="ancova"?'<option value="covariate">Covariate</option>':""}</select></td></tr>`).join("")}</tbody></table>
    ${st.spec.mode==="ancova"?"":`<fieldset id="designQ"><legend>Was anyone measured more than once (in more than one group)?<span class="rowstat"></span></legend><div class="radios"><label><input type="radio" name="rep" value="yes"> Yes</label><label><input type="radio" name="rep" value="no"> No</label></div></fieldset>`}
    <button class="quiet" id="runB">Run analysis</button>`:""}
    <div class="opts" role="group" aria-label="Your reply">${(st.options||[]).map((o,k)=>[Math.random(),o,k]).sort((x,y)=>x[0]-y[0]).map(([_,o,k])=>`<button class="opt" data-k="${k}"><span class="opt-mark" aria-hidden="true"></span><span class="opt-text">${o.t}</span><span class="sr st-sr"></span></button>`).join("")}</div>
    <div id="hintArea"><div id="hintText" class="hint" aria-live="polite"></div><button class="linkish" id="hintBtn">${unit.npc==="jordan"?"Ask":"Call"} Jordan for a hint (costs ${hintCost()} reputation)</button></div><div class="fb" id="fb" aria-live="polite"></div><div id="next"></div></div>`;
  if(st.init)st.init();
  markScrollers();
  const pr=box.querySelector(".prompt");if(i>0){pr.scrollIntoView({behavior:"smooth",block:"start"});pr.focus({preventScroll:true});}
  const fb=document.getElementById("fb");
  /* hints can be one line or [where to look, the key idea]; the second only if asked again */
  const hints=Array.isArray(st.hint)?st.hint:[st.hint];let hintN=0;
  document.getElementById("hintBtn").onclick=()=>{if(hintN>=hints.length)return;hintUsed=true;S.hints++;cred(-hintCost());
    const ht=document.getElementById("hintText");
    ht.insertAdjacentHTML("beforeend",`${hintN?"":`<p class="fb-head">Jordan, on the phone</p>`}<p>${hints[hintN]}</p>`);hintN++;
    const hb=document.getElementById("hintBtn");if(!hb)return;
    if(hintN>=hints.length)hb.remove();else hb.textContent=`Still stuck? Ask Jordan for more (costs ${hintCost()} reputation)`;};
  if(st.type==="build"){let busyB=false;
    /* mark every row right or wrong, lock the right ones, and give a reason for each wrong one */
    const bWant=v=>st.spec.outcome===v?"outcome":(st.spec.factors||[]).includes(v)?"factor":(st.spec.covs||[]).includes(v)?"covariate":"";
    const gradeBuild=tag=>{const tmode=st.spec.mode==="t",F=tmode?"grouping variable":"factor",nm=shortName(unitNpc(unit)),bad=[];let okN=0,n=0;
      box.querySelectorAll("tr[data-brow]").forEach(tr=>{const v=tr.dataset.brow,sl=tr.querySelector("select"),got=sl.value,want=bWant(v),type=(st.spec.vars.find(x=>x[0]===v)||[])[2],stat=tr.querySelector(".rowstat");n++;

        else{tr.classList.add("row-bad");stat.textContent=" ✗ Look again";bad.push(`<code>${v}</code> ${buildReason(type,want,got,F,nm)}`);}});
      const dq=box.querySelector("#designQ");

        if(got===want){okN++;dq.classList.add("row-ok");dq.classList.remove("row-bad");stat.textContent=" ✓ Right";dq.querySelectorAll("input").forEach(x=>x.disabled=true);}
        else{dq.classList.add("row-bad");stat.textContent=" ✗ Look again";bad.push(designReason(want,got,tmode));}}

    const unflag=el=>{const row=el.closest("tr[data-brow],#designQ");if(row&&row.classList.contains("row-bad")){row.classList.remove("row-bad");row.querySelector(".rowstat").textContent="";}};

    document.getElementById("next").innerHTML=`<button class="primary" id="nextBtn">${i===n-1?"Wrap up":"Next"}</button>`;document.getElementById("nextBtn").onclick=()=>showStep(unit,i+1,kind,lvl);};
  const badFinish=(el,action,body)=>{wrongs++;busy=true;if(el)el.classList.add("chosen");

  /* Grade a multi-part answer row by row: lock and collapse the rows that are right,

  const gradeRows=(root,sel)=>{const wrong=[];
    st.slots.forEach((sl,si)=>{const o=sl.options[sel[si]],row=root.querySelector(`[data-row="${si}"]`),stat=row&&row.querySelector(".rowstat");
