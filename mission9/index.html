<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission 9: One line, many readings | AH/STAT 3005</title>
<style>

:root{
  --paper:#F2F6F7; --card:#FFFFFF; --ink:#17252D; --muted:#53636B; --line:#CBD6DB; --line-strong:#728891;
  --teal:#15656C; --teal-deep:#0C474C; --teal-wash:#E1EEEF; --on-teal:#FFFFFF;
  --good:#256A40; --good-wash:#E3F1E7; --bad:#9E2F28; --bad-wash:#F7E4E2;
  --amber:#7F500B; --amber-wash:#F7EDDA;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F181C; --card:#162228; --ink:#E2EBEE; --muted:#9DAEB5; --line:#2C3C43; --line-strong:#6B8087;
    --teal:#6DBAC1; --teal-deep:#96D2D7; --teal-wash:#173338; --on-teal:#08181B;
    --good:#86CD9E; --good-wash:#1A3224; --bad:#F29A92; --bad-wash:#3A211F;
    --amber:#E6B96C; --amber-wash:#382C17;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--sans)}
.bar{position:sticky;top:0;z-index:5;background:var(--teal-deep);color:#fff;border-bottom:3px solid var(--teal)}
@media (prefers-color-scheme: dark){.bar{background:#0B2427;color:var(--ink)}}
.bar-in{max-width:780px;margin:0 auto;padding:.55rem 1.1rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar-title{font-family:var(--serif);font-size:1.02rem;font-weight:600}
.bar-meta{display:flex;gap:1.1rem;align-items:center;font-size:.86rem}
.meter{display:flex;align-items:center;gap:.45rem}
.meter-track{width:92px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.meter-fill{height:100%;background:#9FE0C0;transition:width .35s ease}
main{max-width:780px;margin:0 auto;padding:1.6rem 1.1rem 4rem}
h1{font-family:var(--serif);font-size:2rem;line-height:1.2;margin:.2rem 0 .9rem;font-weight:600}
h2{font-family:var(--serif);font-size:1.3rem;line-height:1.3;margin:0 0 .8rem;font-weight:600}
p{margin:0 0 .9rem;max-width:68ch}
.where{color:var(--ink);font-size:1rem;margin:0}
.lede{font-size:1.1rem}
.memo{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:4px 10px 10px 4px;padding:1rem 1.2rem .3rem;margin:1.1rem 0 1.3rem}
.memo-from{font-weight:600;margin-bottom:.45rem;font-size:.95rem;color:var(--teal-deep)}
.memo p{max-width:none}
.output{margin:1rem 0 1.2rem;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.7rem .8rem .5rem}
.output figcaption{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:.93rem;margin-bottom:.4rem}
.out-note{display:block;font-weight:400;color:var(--ink);font-size:.92rem}
.scroll{overflow-x:auto}
/* a table wider than the screen gets a right-edge shadow and becomes keyboard-scrollable */
.scroll.more{box-shadow:inset -15px 0 12px -12px rgba(0,0,0,.4)}
.scroll.more:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.scrollnote{font-size:.78rem;color:var(--muted);margin:.15rem 0 0}
table{border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:.86rem;min-width:100%}
@media (max-width:520px){.output table{font-size:.76rem}.output th,.output td{padding:.4rem .3rem}}
th,td{padding:.35rem .55rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
thead th{border-bottom:2px solid var(--ink);font-weight:700;vertical-align:bottom;white-space:normal;min-width:4.2rem}
tbody th{text-align:left;font-weight:600}
thead th:first-child{text-align:left}
.step{border-top:1px solid var(--line);padding-top:1.2rem;margin-top:.6rem}
.step-count{color:var(--muted);font-size:.9rem;margin-bottom:.3rem}
.prompt{font-size:1.18rem}
.opts{display:grid;gap:.55rem;margin:.9rem 0}
.opt{display:flex;gap:.7rem;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line-strong);border-radius:8px;padding:.75rem .9rem;cursor:pointer}
.opt:hover:not([aria-disabled="true"]){border-color:var(--teal)}
.opt-mark{flex:0 0 1.35rem;height:1.35rem;border-radius:50%;border:1.5px solid var(--muted);margin-top:.12rem;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.opt.wrong{background:var(--bad-wash);border-color:var(--bad);cursor:default}
.opt.wrong .opt-mark{border-color:var(--bad);color:var(--bad)}
.opt.wrong .opt-mark::after{content:"\2715"}
.opt.right{background:var(--good-wash);border-color:var(--good)}
.opt.right .opt-mark{border-color:var(--good);background:var(--good);color:var(--card)}
.opt.right .opt-mark::after{content:"\2713"}
.opt.locked:not(.right):not(.wrong){opacity:.55;cursor:default}
.fb{margin:.3rem 0 .8rem}
.fb-box{border-radius:8px;padding:.8rem 1rem .1rem;border:1px solid}
.fb-box.good{background:var(--good-wash);border-color:var(--good)}
.fb-box.bad{background:var(--bad-wash);border-color:var(--bad)}
.fb-head{font-weight:700;margin-bottom:.3rem}
.hint{background:var(--amber-wash);border:1px solid var(--amber);border-radius:8px;padding:.75rem 1rem .1rem;margin:.4rem 0 .8rem}
.hint .fb-head{color:var(--amber)}
button{font:inherit}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:8px;padding:.7rem 1.25rem;font-weight:600;cursor:pointer}
.primary:hover{background:var(--teal-deep)}
@media (prefers-color-scheme: dark){.primary:hover{background:var(--teal-deep)}}
.quiet{background:transparent;color:var(--teal-deep);border:1.5px solid var(--teal);border-radius:8px;padding:.6rem 1.05rem;font-weight:600;cursor:pointer}
.linkish{background:none;border:0;color:var(--teal-deep);text-decoration:underline;cursor:pointer;padding:.3rem 0;font-size:.95rem}
.actions{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}
:focus-visible{outline:3px solid #E0A526;outline-offset:2px}
.outro{border-top:1px solid var(--line);margin-top:1rem;padding-top:1.2rem}
.takeaway{background:var(--teal-wash);border-radius:8px;padding:.8rem 1rem}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 .8rem;padding:.6rem .9rem .7rem;background:var(--card)}
legend{font-weight:600;padding:0 .3rem}
.radios{display:flex;gap:1.2rem;flex-wrap:wrap}
.radios label{display:flex;gap:.4rem;align-items:center;cursor:pointer}
/* Two choices side by side: a bare radio sits 9px from its own text but only
   19px from the NEXT option, so which text belongs to which button is ambiguous.
   Each option gets its own box instead. */
.seg{display:flex;gap:.6rem;flex-wrap:wrap;margin:.1rem 0 .6rem;position:relative}
.seg input{position:absolute;width:1px;height:1px;opacity:0;margin:0}
.seg label{flex:1 1 9rem;display:flex;align-items:flex-start;gap:.5rem;
  border:1.5px solid var(--line-strong);border-radius:9px;
  padding:.6rem .7rem;cursor:pointer;background:var(--card);color:var(--ink);line-height:1.3}
.seg label::before{content:"";flex:0 0 auto;width:14px;height:14px;border-radius:50%;
  border:2px solid var(--line-strong);margin-top:.12rem}
.seg input:checked+label{border-color:var(--teal);border-width:2px;padding:calc(.6rem - .5px) calc(.7rem - .5px);
  background:var(--teal-wash);font-weight:600}
.seg input:checked+label::before{border-color:var(--teal);
  background:radial-gradient(circle,var(--teal) 0 45%,transparent 47%)}
.seg input:focus-visible+label{outline:2px solid var(--teal);outline-offset:2px}
.stats{display:flex;gap:2rem;flex-wrap:wrap;margin:1rem 0 1.4rem}
.stat b{display:block;font-family:var(--serif);font-size:2rem;line-height:1.1;font-weight:600}
.stat span{color:var(--muted);font-size:.9rem}
.review{margin:0 0 1.2rem;padding:0;list-style:none}
.review li{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.review .st{white-space:nowrap;font-weight:600}
.st.ok{color:var(--good)} .st.retry{color:var(--amber)}
main>h2{margin-top:1.8rem}
.submit-box{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:4px 10px 10px 4px;padding:1rem 1.2rem}
.kpis{display:flex;gap:.6rem;flex-wrap:wrap;margin:0 0 .9rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.45rem .85rem;min-width:7rem}
.kpi b{display:block;font-family:var(--serif);font-size:1.3rem;line-height:1.25}
.kpi span{font-size:.8rem;color:var(--muted)}
.vizfig{margin:.5rem 0 1rem;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem .3rem}
.viz{display:block;width:100%;height:auto}
.vizcap{font-size:.95rem;color:var(--ink);margin:.25rem 0 .1rem}
.viz text{font:12px var(--sans);fill:var(--muted)}
.viz .v-strong{fill:var(--ink);font-weight:600}
.viz .v-reflab{fill:var(--amber);font-weight:600}
.viz .v-altlab{fill:var(--teal);font-weight:600}
.viz .v-t1lab{fill:var(--bad);font-weight:600}
.v-axis,.v-grid{stroke:var(--line);stroke-width:1}
.v-dot{fill:var(--teal);opacity:.85}
.v-ref{stroke:var(--amber);stroke-width:2;stroke-dasharray:5 4}
.v-down{stroke:var(--teal);stroke-width:1.6;opacity:.65}
.v-up{stroke:var(--bad);stroke-width:1.8;opacity:.8}
.v-flat{stroke:var(--muted);stroke-width:1.4;opacity:.6}
.v-curve{fill:none;stroke:var(--ink);stroke-width:2}
.v-shade{fill:var(--teal);opacity:.4}
.v-null{fill:none;stroke:var(--muted);stroke-width:2}
.v-alt{fill:none;stroke:var(--teal);stroke-width:2.5}
.v-pow{fill:var(--teal);opacity:.28}
.v-t1{fill:var(--bad);opacity:.45}
.v-bar{stroke:var(--teal);stroke-width:7;stroke-linecap:round}
.v-est{fill:var(--card);stroke:var(--teal);stroke-width:3}
.v-mean{stroke:var(--ink);stroke-width:3}
.status{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--good);border-radius:4px 10px 10px 4px;padding:.75rem 1rem .1rem;margin-bottom:.9rem}
.status.mixed{border-left-color:var(--amber)}
.status-icon{font-size:1.35rem;line-height:1.3;font-weight:700;color:var(--good)}
.status.mixed .status-icon{color:var(--amber)}
.status-title{font-weight:700;margin-bottom:.15rem}
.react{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin:.3rem 0 .8rem}
.react.good{border-left:5px solid var(--good)}.react.bad{border-left:5px solid var(--amber)}.react.pending{border-left:5px solid var(--line)}
.react-head{display:flex;gap:.7rem;align-items:center}
.react-name{font-weight:700;margin:0;font-size:.88rem;color:var(--muted)}
.react-line{margin:0;font-size:1.06rem}
.react-body{margin-top:.55rem}
.react-note{border-top:1px solid var(--line);margin-top:.6rem;padding-top:.5rem}
.react-action{margin:0 0 .2rem;color:var(--muted);font-style:italic}
.typing{margin:0}.typing span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--muted);animation:rvblink 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes rvblink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.opt.chosen{border-color:var(--amber);background:var(--amber-wash)}
.delta{margin-left:.35rem;font-weight:700;animation:rvpop 1.3s ease forwards}
@keyframes rvpop{0%{opacity:0;transform:translateY(4px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.typing span,.delta{animation:none}}
.draft{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.9rem 1.1rem;margin:.8rem 0;font-family:var(--serif);font-size:1.05rem;line-height:2}
.draft-title{font-family:var(--sans);font-size:.85rem;font-weight:700;color:var(--muted);margin:0 0 .2rem;line-height:1.4}
.draft p{margin:0}
.sent{font:inherit;background:none;border:0;border-bottom:2px dotted var(--muted);color:var(--ink);cursor:pointer;padding:0 .15rem;text-align:left;display:inline;line-height:1.7}
.sent:hover:not([aria-disabled="true"]){background:var(--amber-wash)}
.sent.chosen,.ecard.chosen,.pick.chosen,.pickpanel.chosen{background:var(--amber-wash);border-color:var(--amber)}
.sent.wrong{background:var(--bad-wash);text-decoration:line-through}.sent.right{background:var(--good-wash);border-bottom:2px solid var(--good)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.6rem;margin:.8rem 0}
.ecard{font:inherit;text-align:left;background:var(--card);border:1.5px solid var(--line-strong);border-radius:10px;padding:.75rem .85rem;min-height:5.5rem;cursor:pointer;box-shadow:0 3px 0 var(--line);color:var(--ink)}
.ecard:hover:not([aria-disabled="true"]){border-color:var(--teal);transform:translateY(-1px)}
.etag{display:block;font-size:.72rem;font-weight:700;letter-spacing:.02em;color:var(--teal-deep);margin-bottom:.3rem}
.ecard.wrong{background:var(--bad-wash);border-color:var(--bad)}.ecard.right{background:var(--good-wash);border-color:var(--good)}
.pick{font:inherit;background:none;border:1.5px dashed var(--teal);border-radius:5px;padding:.05rem .35rem;cursor:pointer;color:var(--ink)}
.pick:hover:not([aria-disabled="true"]){background:var(--teal-wash)}
.pick.wrong,.pickpanel.wrong{background:var(--bad-wash);border-color:var(--bad)}.pick.right,.pickpanel.right{background:var(--good-wash);border-color:var(--good);border-style:solid}
.pickpanel{display:block;width:100%;text-align:left;background:none;border:2px dashed var(--teal);border-radius:10px;padding:.35rem .5rem;margin:.2rem 0 .5rem;cursor:pointer;font:inherit;color:var(--ink)}
.pickpanel .vizfig{margin:.2rem 0}
.tiles{display:flex;flex-wrap:wrap;gap:.45rem}
.tile{font:inherit;font-size:.95rem;background:var(--card);border:1.5px solid var(--line-strong);border-radius:999px;padding:.35rem .85rem;cursor:pointer;color:var(--ink)}
.tile[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.headline{font-family:var(--serif);font-size:1.15rem;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:6px;padding:.7rem 1rem;margin:.7rem 0}
.claim{font-size:1.05rem}
.recap{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:10px;padding:.7rem .95rem .3rem;margin:.4rem 0 .8rem;color:var(--ink);font-size:1rem;line-height:1.5}.recap-h{font-weight:700;margin:0 0 .35rem}.recap p,.recap li{margin:.2rem 0 .45rem}.recap ul{margin:.2rem 0 .4rem;padding-left:1.2rem}
.thread{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem;margin:.7rem 0}
.thread.email{border-top:5px solid var(--teal);border-radius:6px}
.mailhead{display:flex;flex-direction:column;gap:.1rem;font-size:.88rem;border-bottom:1px solid var(--line);padding-bottom:.45rem;margin-bottom:.55rem}
.msgs{display:flex;flex-direction:column;gap:.45rem}
.msg{max-width:88%;padding:.5rem .8rem;border-radius:14px;background:var(--teal-wash);align-self:flex-start}
.msg.you{align-self:flex-end;background:var(--amber-wash)}
.email .msg{max-width:100%;border-radius:6px}
.msg-who{display:block;font-size:.72rem;font-weight:700;color:var(--muted)}
.asks{display:flex;flex-wrap:wrap;gap:.4rem;margin:.7rem 0 .2rem}
.ask{font:inherit;font-size:.92rem;border:1.5px solid var(--teal);background:var(--card);color:var(--teal-deep);border-radius:999px;padding:.3rem .85rem;cursor:pointer}
.ask:disabled{opacity:.45;cursor:default}
.compose{border-top:1px solid var(--line);margin-top:.7rem;padding-top:.5rem}
.slotrow{margin:.45rem 0}
/* per-row marking after a multi-part answer is sent */
.rowstat{font-weight:700;margin-left:.4rem}
.row-ok .rowstat{color:var(--good)}
.row-bad .rowstat{color:var(--bad)}
.row-ok{border-left:4px solid var(--good);padding-left:.55rem}
.row-bad{border-left:4px solid var(--bad);padding-left:.55rem}
.row-ok .tile[aria-pressed="true"]:disabled{opacity:1;cursor:default}
.tile[hidden]{display:none}
.build tr.row-ok,.build tr.row-bad{border-left:0;padding-left:0}
.build tr.row-ok th{box-shadow:inset 4px 0 0 var(--good)}
.build tr.row-bad th{box-shadow:inset 4px 0 0 var(--bad)}
.build select:disabled{opacity:1;color:var(--ink)}
.build th .where{display:block}
.build th .rowstat{display:block;margin:0;font-size:.85rem}
.build th .rowstat:empty{display:none}
#hintText:empty{display:none}
.slotlab{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:.2rem}
.draftmsg{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:.5rem .8rem;margin:.6rem 0;min-height:2.4rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){body{font-size:16px}h1{font-size:1.65rem}.bar-meta{gap:.7rem}.meter-track{width:60px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

.viz .v-null2{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-dasharray:7 5}.viz .v-alt2{fill:none;stroke:var(--teal);stroke-width:3}

.map-wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.4rem;margin:.6rem 0}
#mapsvg{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer;border-radius:6px}
#mapsvg:focus-visible{outline:3px solid #E0A526}
.m-floor{fill:#E9EEF0}.m-corr{fill:#DCE4E7}.m-wall{fill:#34474F}
.r1{fill:#F3E6DA}.r2{fill:#E2EEF6}.r3{fill:#F6E3E6}.r4{fill:#E8E4F3}.r5{fill:#E3F1E6}.r6{fill:#F6EFD9}.r7{fill:#E1EEEF}
.m-label{font:600 15px var(--sans);fill:#34474F}
.m-name{font:600 11px var(--sans);fill:#34474F}
.m-init{font:700 12px var(--sans);fill:#fff}
.m-deco{fill:#34474F;opacity:.12}
.mk-need{fill:#E0A526}.mk-done{fill:#2E7D4F}.mk-wait{fill:#9AA8AE}
.mk-t{font:800 15px var(--sans);fill:#fff}
@media (prefers-color-scheme: dark){.m-floor{fill:#223239}.m-corr{fill:#1B292F}.m-wall{fill:#0A1215}.r1{fill:#3A2E25}.r2{fill:#23323D}.r3{fill:#3B2A2E}.r4{fill:#2D2A3B}.r5{fill:#23352A}.r6{fill:#3A3422}.r7{fill:#1F3538}.m-label,.m-name{fill:#D5E0E4}}
.toast{min-height:2.9rem;background:var(--amber-wash);border:1px solid var(--amber);border-radius:8px;padding:.55rem .9rem;margin:.4rem 0;font-size:.95rem}
.toast:empty{background:transparent;border-color:transparent}
.quest{font-size:.95rem;margin:.2rem 0 .3rem}
.controls{display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap;margin-top:.5rem}
.dpad{display:grid;grid-template-columns:repeat(3,3rem);grid-template-rows:repeat(2,3rem);gap:.3rem}
.dpad button{font-size:1.2rem;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
.dir{flex:1;min-width:15rem}
.dir h2{font-size:1.05rem;margin:.1rem 0 .4rem}
.dir ul{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.dir button{width:100%;text-align:left;font:inherit;font-size:.9rem;background:var(--card);color:var(--ink);border:1px solid var(--line-strong);border-radius:6px;padding:.4rem .6rem;cursor:pointer;display:flex;justify-content:space-between;gap:.5rem}
.dir .tag{font-size:.78rem;font-weight:700;white-space:nowrap}
.tag.need{color:var(--amber)}.tag.done{color:var(--good)}.tag.wait{color:var(--muted)}
.talk-head{display:flex;gap:1rem;align-items:center;margin:.3rem 0 .6rem}
.talk-head h1{margin:0 0 .15rem}
.who{margin:0;color:var(--muted)}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.85rem 1.1rem .1rem;margin:.4rem 0 1rem}
.bubble::before{content:"";position:absolute;top:-9px;left:28px;width:16px;height:16px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.slider{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.6rem .9rem;margin:.5rem 0}
.slider input{width:100%}
.swatches{display:flex;gap:.8rem;margin:.4rem 0 1rem}
.swatches label{display:flex;flex-direction:column;align-items:center;gap:.3rem;cursor:pointer;font-size:.85rem}
.swatch{width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid transparent}
.swatches input{position:absolute;opacity:0}
.swatches input:checked+.swatch{border-color:var(--ink)}
.swatches input:focus-visible+.swatch{outline:3px solid #E0A526}
 .m-clue{fill:#FFFFFF;stroke:#34474F;stroke-width:2}.m-clue-l{stroke:#34474F;stroke-width:2}
.build{width:100%;border-collapse:collapse;margin:.4rem 0 .8rem;font-size:.92rem}
.build th,.build td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);white-space:normal}
.build code{font-weight:700}
.build select{font:inherit;padding:.3rem;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink)}
.typ{font-size:.75rem;font-weight:700;padding:.1rem .4rem;border-radius:4px;background:var(--teal-wash);color:var(--teal-deep);white-space:nowrap}
.notes{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .9rem;margin:0 0 1rem}
.notes summary{font-weight:700;cursor:pointer}
.note{border-top:1px solid var(--line);padding-top:.5rem;margin-top:.5rem}

.hand{font-family:"Patrick Hand","Segoe Print","Bradley Hand",cursive}
.art{position:relative;margin:.9rem 0}
.art p{margin:.3rem 0}
.art svg{display:block;width:100%;height:auto;max-width:34rem;margin:.3rem 0}
/* sticky note: paper stays yellow in dark mode, like a real one */
.art-sticky{background:#FFF1A6;color:#2A2410;max-width:21rem;padding:.9rem .95rem .6rem;transform:rotate(var(--tilt,-1.5deg));box-shadow:0 4px 10px rgba(0,0,0,.2);border-radius:2px}
.art-sticky p{font-size:1.18rem;line-height:1.32}
.art-sticky .sig{text-align:right;font-size:.95rem}
.art-sticky::before{content:"";position:absolute;top:-8px;left:50%;width:64px;height:17px;margin-left:-32px;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.08);transform:rotate(3deg)}
/* whiteboard */
.art-wb{background:#FDFEFE;color:#1D3F95;border:9px solid #B7BEC5;border-radius:6px;padding:.7rem .95rem;box-shadow:0 3px 8px rgba(0,0,0,.14)}
.art-wb .mk,.art-wb h3{font-family:"Patrick Hand","Marker Felt","Chalkboard SE",cursive}
.art-wb h3{font-size:1.45rem;font-weight:400;margin:0 0 .2rem;color:#1D3F95}
.art-wb .mk{font-size:1.2rem}
.mk-red{color:#B0261E}.mk-green{color:#1B6B39}
/* printed memo or email */
.art-memo{background:#FFFFFF;color:#222;border:1px solid #D5D5D5;box-shadow:3px 4px 0 #E4DFD3;padding:.8rem 1rem;max-width:36rem;overflow:hidden}
.memo-head{display:grid;grid-template-columns:auto 1fr;gap:.05rem .6rem;font-size:.85rem;border-bottom:1px solid #DDD;padding-bottom:.45rem;margin:0 0 .5rem}
.memo-head dt{font-weight:700;color:#555}.memo-head dd{margin:0}
.art-memo.coffee::after{content:"";position:absolute;right:-34px;bottom:-40px;width:92px;height:92px;border-radius:50%;border:7px solid rgba(120,72,30,.16);pointer-events:none}
/* poster or notice pinned to a board */
.art-flyer{background:#FFFDF5;color:#1F2A2E;border:1px solid #E2DCCB;padding:1.05rem 1rem .8rem;box-shadow:0 3px 8px rgba(0,0,0,.13);max-width:32rem}
.art-flyer::before{content:"";position:absolute;top:7px;left:50%;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:#C0392B;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.flyer-title{font-family:var(--serif);font-size:1.3rem;font-weight:700;color:#0C474C;margin:.2rem 0 .1rem}
.flyer-sub{font-size:.85rem;color:#4A5A60;margin:0 0 .4rem}
/* a peek at the data file: a screen, so it follows the theme */
.art-sheet{border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--card);max-width:36rem}
.sheet-bar{display:flex;justify-content:space-between;gap:.4rem;flex-wrap:wrap;background:#1B6B45;color:#FFFFFF;padding:.3rem .6rem;font-size:.82rem;font-family:var(--sans);margin:0}
.sheet-file{font-weight:700}
.art-sheet table{font-family:var(--sans);font-size:.84rem;border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums;margin:0}
.art-sheet table th,.art-sheet table td{border:1px solid var(--line);padding:.22rem .45rem;text-align:left;white-space:nowrap}
@media (max-width:520px){.art-sheet table{font-size:.74rem}.art-sheet table th,.art-sheet table td{padding:.2rem .3rem}.art-sheet .rn{width:1.2rem}}
.art-sheet thead th{background:var(--paper);min-width:0;border-bottom:1px solid var(--line-strong);vertical-align:bottom;white-space:normal}
.art-sheet .rn{background:var(--paper);color:var(--muted);font-weight:400;text-align:center;width:1.8rem}
.art-sheet tr.more td{color:var(--muted);font-style:italic}
.toast .art-sheet table{min-width:100%}
.sheet-key{font-size:.92rem;color:var(--ink);padding:.3rem .6rem;margin:0;border-top:1px solid var(--line)}
.clue-row{display:flex;gap:.35rem;flex-wrap:wrap;margin:.25rem 0 .2rem .6rem}
.dir .clue-btn{width:auto;font-size:.82rem;padding:.25rem .55rem}
.toast table{font-size:.82rem;min-width:0}
.notes td,.toast td,.notes th,.toast th{text-align:left;white-space:normal}.notes figcaption:empty,.toast figcaption:empty{display:none}
.side{display:grid;grid-template-columns:1fr;gap:.2rem}
@media (max-width:620px){.side{grid-template-columns:1fr}}

/* weeks 1-3: SPSS crosstabs and footnotes, the dashboard screen, paired figures, stacked design choices */
.out-foot{font-family:Arial,Helvetica,sans-serif;font-size:.9rem;color:var(--ink);margin:.45rem 0 0;max-width:none}
.xt tbody tr.grp>*{border-top:2px solid var(--line-strong)}
.xt th[scope="rowgroup"]{text-align:left;vertical-align:top}
.xt tbody th.stat{font-weight:400;color:var(--muted);text-align:left;white-space:normal;min-width:5.5rem;max-width:8rem;line-height:1.25}
@media (max-width:520px){.xt th[scope="rowgroup"]{white-space:normal;min-width:3.2rem}}
.xt thead th[scope="colgroup"]{text-align:center;border-bottom:1px solid var(--line)}
.art-dash{background:#17212B;color:#E6EDF3;border-radius:10px;padding:.6rem .7rem .7rem;max-width:36rem;box-shadow:0 3px 8px rgba(0,0,0,.18);font-family:Arial,Helvetica,sans-serif}
.art-dash .dash-bar{font-size:.72rem;letter-spacing:.08em;color:#9FB0BF;margin:0 0 .45rem}
.art-dash .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.5rem}
.art-dash .dash-tile{background:#243240;border-radius:8px;padding:.5rem .6rem;border:2px solid transparent}
.art-dash .dash-tile.warn{border-color:#E8A33D}

const CONFIG={mission:9,version:"1.3",
  // Qualtrics survey link (same survey as the other missions)

function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,tmp=x+5.5;tmp-=(x+0.5)*Math.log(tmp);let ser=1.000000000190015;for(let j=0;j<6;j++){y+=1;ser+=c[j]/y;}return -tmp+Math.log(2.5066282746310005*ser/x);}
function betacf(a,b,x){const MAXIT=300,EPS=3e-12,FPMIN=1e-300;const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;}return h;}
function betai(a,b,x){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
function tcdf(t,df){const x=df/(df+t*t);const tail=0.5*betai(df/2,0.5,x);return t>=0?1-tail:tail;}
function tinv(p,df){let lo=-80,hi=80;for(let i=0;i<200;i++){const m=(lo+hi)/2;if(tcdf(m,df)<p)lo=m;else hi=m;}return (lo+hi)/2;}
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
function ncdf(z){return 0.5*(1+erf(z/Math.SQRT2));}
function zinv(p){let lo=-10,hi=10;for(let i=0;i<100;i++){const m=(lo+hi)/2;if(ncdf(m)<p)lo=m;else hi=m;}return (lo+hi)/2;}
function twoSidedP(t,df){return 2*(1-tcdf(Math.abs(t),df));}
function power2(d,n,alpha){return ncdf(d*Math.sqrt(n/2)-zinv(1-alpha/2));}
function welchDf(s1,n1,s2,n2){const a=s1*s1/n1,b=s2*s2/n2;return (a+b)*(a+b)/(a*a/(n1-1)+b*b/(n2-1));}

function makeRng(seed){let a=seed>>>0;const next=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  return {u:next,uni:(lo,hi)=>lo+(hi-lo)*next(),int:(lo,hi)=>lo+Math.floor(next()*(hi-lo+1)),
    normal:(m,s)=>{let u=0,v=0;while(u===0)u=next();while(v===0)v=next();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}};}

function fx(x,d=2){const r=Number(x).toFixed(d);return r==="-0."+"0".repeat(d)?(0).toFixed(d):r;}
function fP(p){return p<0.001?"&lt;.001":p.toFixed(3).replace(/^0\./,".");}
function fPtext(p){return p<0.001?"p &lt; .001":"p = "+fP(p);}
function tbl(title,note,heads,rows){
  const txt=x=>String(x).replace(/<[^>]+>/g,"").replace(/&lt;/g,"less than ").replace(/&gt;/g,"greater than ").replace(/&nbsp;/g," ").replace(/"/g,"").trim();
  const label=(c,i,rowHead)=>{
    if(typeof c!=="string"||c.indexOf('class="pick"')<0||c.indexOf("aria-label")>=0)return c;
    const head=txt(heads[i]),rh=txt(rowHead),val=txt(c);
    const name=[head,rh].filter(Boolean).join(", ")+(val?": "+val:"");
    return c.replace('<button class="pick"',`<button class="pick" aria-label="${name}"`);
  };
  return `<figure class="output"><figcaption>${title}${note?`<span class="out-note">${note}</span>`:""}</figcaption><div class="scroll"><table><thead><tr>${heads.map(h=>`<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th scope="row">${c}</th>`:`<td>${label(c,i,r[0])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></figure>`;
}

/* Six-column SPSS tables cannot fit a phone, so they scroll. Mark the ones that

function markScrollers(root){try{(root||document).querySelectorAll(".scroll").forEach(d=>{
  const over=d.scrollWidth-d.clientWidth>2;d.classList.toggle("more",over);
  if(over){d.setAttribute("tabindex","0");d.setAttribute("role","region");
    if(!d.getAttribute("aria-label")){const f=d.closest(".output"),c=f&&f.querySelector("figcaption");
      d.setAttribute("aria-label",(c?c.textContent.trim().slice(0,60):"Table")+" (scrolls sideways)");}}
  else{d.removeAttribute("tabindex");d.removeAttribute("role");d.removeAttribute("aria-label");}});}catch(e){}}
window.addEventListener("resize",()=>markScrollers());

function encodeCareer(d){
  let v=0n;const put=(val,bits)=>{v=(v<<BigInt(bits))|(BigInt(val)&((1n<<BigInt(bits))-1n));};
  put(1,3);let wm=0;d.weeks.forEach(w=>{if(w>=1&&w<=15)wm|=1<<(w-1);});put(wm,15);

  let p="";for(let i=14;i>=0;i--)p+=B32[Number((v>>BigInt(5*i))&31n)];
  return `RIV-${p.slice(0,5)}-${p.slice(5,10)}-${p.slice(10)}${b32sum(p)}`;
}
function decodeCareer(code){
  const s=String(code||"").trim().toUpperCase().replace(/^RIV/,"").replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");
  if(s.length!==17||[...s].some(ch=>B32.indexOf(ch)<0))return null;
  const p=s.slice(0,15);if(b32sum(p)!==s.slice(15))return null;
  let v=0n;for(const ch of p)v=(v<<5n)|BigInt(B32.indexOf(ch));
  const take=bits=>{const x=Number(v&((1n<<BigInt(bits))-1n));v>>=BigInt(bits);return x;};
  const d=seasonDefault();d.danaA=DANA_A[take(2)]??0.05;d.danaN=DANA_N[take(2)]??100;
  const fm=v&0xFFFFFFFFn;v>>=32n;d.flagsRaw=Number(fm);d.flags={};FLAG_BITS.forEach((f,i)=>{d.flags[f]=Number((fm>>BigInt(i))&1n);});
  [...CAST_IDS].reverse().forEach(k=>{d.trust[k]=take(2)+1;});d.rep=take(7);
  const wm=take(15);d.weeks=[];for(let w=1;w<=15;w++)if(wm&(1<<(w-1)))d.weeks.push(w);

}

function tomasData(level){const R=makeRng((SEED()^0x9A01)>>>0);let x,y,m;GEN_OK=0;
  for(let k=0;k<400;k++){const n=R.int(70,90);x=[];y=[];for(let i=0;i<n;i++){const d=Math.round(2+12*Math.pow(R.u(),1.3));x.push(d);y.push(round1(Math.max(1.5,9+2.4*d+R.normal(0,7.5))));}
    m=ols(y,[x]);if(m.b[1]>2&&m.b[1]<2.8&&m.R2>.35&&m.R2<.6&&m.pv[1]<.001){GEN_OK=1;break;}}if(!GEN_OK)GEN_MISS.push("w9 tomas");
  return {x,y,m,mh:ols(y,[x.map(v=>v*24)])};}
function nairData9(level){const R=makeRng((SEED()^0x9A02^(level?7:0))>>>0);let V,rr;GEN_OK=0;
  for(let k=0;k<500;k++){const n=level?R.int(400,440):R.int(130,150);const ct=[],nih=[],age=[],dtn=[];
    for(let i=0;i<n;i++){const c=Math.round(Math.min(40,Math.max(5,R.normal(18,6))));const s=Math.round(Math.min(30,Math.max(1,R.normal(9,5))));const a=Math.round(Math.min(98,Math.max(30,R.normal(71,12))));
      ct.push(c);nih.push(s);age.push(a);dtn.push(Math.round(Math.max(10,22+1.25*c-0.85*s+(level?0.075:0.02)*a+R.normal(0,6.5))));}
    V=[dtn,ct,nih,age];rr=V.map(a=>V.map(b=>corr(a,b)));const n2=n;
    const ok=rr[0][1]>.6&&rr[0][1]<.8&&rr[0][2]<-.35&&rr[0][2]>-.55&&Math.abs(rr[1][2])<.15&&Math.abs(rr[1][3])<.15&&Math.abs(rr[2][3])<.15&&
      (level?(rr[0][3]>.09&&rr[0][3]<.16&&corrP(rr[0][3],n2)<.05):Math.abs(rr[0][3])<.12);
    if(ok){GEN_OK=1;break;}}if(!GEN_OK)GEN_MISS.push("w9 nair");
  return {V,rr,n:V[0].length,names:["Door-to-needle (min)","Arrival to CT (min)","NIHSS severity","Age (years)"]};}
function marcusData9(level){const R=makeRng((SEED()^0x9A03)>>>0);let berg,ses,dis,m;GEN_OK=0;
  for(let k=0;k<400;k++){const n=R.int(60,75);berg=[];ses=[];dis=[];
    for(let i=0;i<n;i++){const b=R.int(20,50);berg.push(b);ses.push(Math.max(3,Math.round(31-0.42*b+R.normal(0,2.8))));dis.push(Math.min(56,b+Math.max(0,Math.round(R.normal(8,3)))));}
    m=ols(ses,[berg]);if(m.b[1]<-.35&&m.b[1]>-.5&&m.R2>.4&&m.R2<.7&&Math.min(...berg)<=21&&Math.max(...berg)>=49){GEN_OK=1;break;}}if(!GEN_OK)GEN_MISS.push("w9 marcus");
  const lo=Math.min(...berg),hi=Math.max(...berg),ext=level?55:8;return {berg,ses,dis,m,lo,hi,ext,pred:m.b[0]+m.b[1]*ext};}
function danaData9(level){const R=makeRng((SEED()^0x9A04^(level?5:0))>>>0);let c,y,m1,m2;GEN_OK=0;const q=level?.019:.026;
  for(let k=0;k<400;k++){const n=R.int(110,130);c=[];y=[];for(let i=0;i<n;i++){const v=R.int(8,58);c.push(v);y.push(Math.round(Math.max(15,52-0.85*v+q*v*v+R.normal(0,level?6:5.5))));}
    m1=ols(y,[c]);m2=ols(y,[c,c.map(v=>v*v)]);const z=m1.zres,lowE=c.map((v,i)=>v<16?z[i]:null).filter(v=>v!=null),mid=c.map((v,i)=>v>26&&v<40?z[i]:null).filter(v=>v!=null),hiE=c.map((v,i)=>v>50?z[i]:null).filter(v=>v!=null);
    if(m1.pv[1]<.001&&m2.pv[2]<(level?.01:.001)&&mean(lowE)>.25&&mean(hiE)>.25&&mean(mid)<-.15){GEN_OK=1;break;}}if(!GEN_OK)GEN_MISS.push("w9 dana");
  return {c,y,m1,m2};}
function hiddenData9(){const R=makeRng((SEED()^0x9A05)>>>0);let t,v,r;GEN_OK=0;
  for(let k=0;k<300;k++){const n=R.int(150,180);t=[];v=[];for(let i=0;i<n;i++){const x=round1(R.uni(-8,36));t.push(x);v.push(Math.round(205+0.22*(x-14)**2+R.normal(0,9)));}
    r=corr(t,v);if(Math.abs(r)<.08){GEN_OK=1;break;}}if(!GEN_OK)GEN_MISS.push("w9 hidden");
  const mq=ols(v,[t,t.map(x=>x*x)]);return {t,v,r,p:corrP(r,t.length),n:t.length,mq,q:mq.b};}

function case4(R,level){ // Dana: the residual plot shows a curve; a squared term fits
  const D=danaData9(level),m1=D.m1,m2=D.m2;
  const yhi=Math.ceil((Math.max(...D.y)+5)/20)*20;
  const sLine=scatter({x:D.c,y:D.y,xlo:0,xhi:60,ylo:0,yhi,xlab:"Patients in the ED when the alert fired",ylab:"Minutes to first antibiotic",fits:[{f:v=>m1.b[0]+m1.b[1]*v,lo:8,hi:58}],
    label:`Scatterplot of ${m1.n} sepsis alerts with a straight fitted line: delays are fairly flat at lower census and climb steeply above about 40 patients.`,cap:"Each dot is one sepsis alert. Straight line: the linear model."});
  const sCurve=scatter({x:D.c,y:D.y,xlo:0,xhi:60,ylo:0,yhi,xlab:"Patients in the ED when the alert fired",ylab:"Minutes to first antibiotic",fits:[{f:v=>m2.b[0]+m2.b[1]*v+m2.b[2]*v*v,lo:8,hi:58,color:"var(--amber)"}],
    label:`The same alerts with a curved fit that includes census squared: it follows the flat start and the steep climb.`,cap:"Amber curve: the model with census and census squared."});
  const rcap="Residual plot. Each dot is one sepsis alert: how far the model's prediction missed (up and down) against the prediction itself (left to right).";
  const rp1=residPlot(m1,{cap:rcap,label:`Residual plot for the straight line: residuals are mostly positive at both ends and negative in the middle, a U shape.`});
  const rp2=residPlot(m2,{cap:rcap,label:`Residual plot for the curved model: residuals scatter randomly around zero.`});
  const o1=regTables(m1,{names:["Census"],dv:"Minutes to first antibiotic",tag:"straight line"});
  const o2=regTables(m2,{names:["Census","Census squared"],dv:"Minutes to first antibiotic",tag:"with a squared term",pick:k=>["r2","b1","b2","p1","p2","pf"].includes(k)});
  return {id:"c4",npc:"dana",title:"A line through a curve",
    scene:"Dana has a printout of a scatterplot with a ruler laid across it, as if she drew the line herself.",
    message:`<p>When the ED is packed, sepsis antibiotics come late. I ran a regression on ${m1.n} alerts: the slope is significant, it goes up, done. I want to tell the board that every extra patient adds the same delay.</p>`,
    steps:[
      {id:"c4s1",label:"The residual plot",type:"reply",channel:"chat",narr:"Dana slides the ruler off the printout. \"Jordan told me to check one more plot. I don't know what I'm looking at.\"",
       show:sLine+rp1+o1.co,
       prompt:"Dana wants to know whether the straight line is good enough. Build your reply.",
       hint:["In a good residual plot the dots scatter randomly around the zero line. Look at the left end, the middle and the right end.","The residuals sit above zero at both ends and below it in the middle: a curve the straight line missed. A squared census term lets the model bend."],
       thread:["The slope is significant. Isn't that enough?"],
       slots:[
        {label:"The residuals",options:[{t:"The residuals curve: above zero at both ends, below in the middle, so the line misses the shape,",tag:"correct"},{t:"The residuals are a random cloud around zero, with as many above the line as below, so the line is fine,",tag:"resid_read",fb:"Overall there are as many above as below, but look at the ends of the plot: most residuals there are above zero, and in the middle most are below. That's a pattern, not a random cloud."},{t:"The residuals fan out, so the spread grows with census,",tag:"resid_read",fb:"A fan would widen from one side to the other. This plot bends: up, down, up."}]},
        {label:"So",options:[{t:"so add census squared (a polynomial regression) and check the residuals again.",tag:"correct"},{t:"so drop the busiest days as outliers and refit the straight line without them.",tag:"outlier_delete",fb:"The busiest days are real alerts, and they're where the curve is. Refitting without them hides the problem."}]}],
       okFb:"A significant slope doesn't mean the right shape. The residual plot shows what the line missed."},
      {id:"c4s2",label:"Is the curve real?",type:"point",narr:"Jordan reruns the model with census squared and emails it over. Dana opens it on her phone.",
       show:`<div class="slider"><p><strong>Try it.</strong> Switch between the straight line and the curve, and watch the residuals.</p><div class="seg" role="group" aria-label="Which model"><input type="radio" id="dm-l" name="dmshow" value="l" checked><label for="dm-l">Straight line</label><input type="radio" id="dm-c" name="dmshow" value="c"><label for="dm-c">With census squared</label></div><div id="dmviz" class="pair"></div></div>${o2.ms}${o2.co}`,
       init:()=>{const draw=()=>{const c=document.querySelector('input[name="dmshow"]:checked').value==="c";document.getElementById("dmviz").innerHTML=(c?sCurve+rp2:sLine+rp1);};
         document.querySelectorAll('input[name="dmshow"]').forEach(e=>e.addEventListener("change",draw));draw();},
       prompt:"Dana: \"Show me the one number that says the curve is real, not just a wiggle.\" Click it.",
       hint:["The curve comes from one new term. Find its row in the Coefficients table.","Click the Sig. on the census squared row: it tests whether the bend is more than chance."],
       picks:{p2:{tag:"correct",fb:`${fP(m2.pv[2])} on the census squared row: the bend is statistically significant, so a curve this strong would be very unlikely if the relationship were really a straight line. Delays stay fairly flat, then climb fast once the ED is very full.`},
        r2:{tag:"r2_rises",fb:`R Square did rise, from ${f3(m1.R2)} to ${f3(m2.R2)}, but R Square always rises when you add a term. The test of the new term says whether it's real.`},
        b2:{tag:"output_misread",fb:"That's the size of the bend, in minutes per patient squared. Its Sig. says whether it's real."},
        b1:{tag:"output_misread",fb:"That's the census term, which now only makes sense together with census squared."},p1:{tag:"output_misread",fb:"That's the census term's test. The curve is the squared term."},
        pf:{tag:"output_misread",fb:"That's the whole model's test. Dana asked about the curve itself."}}}],
    outro:g=>g("c4s1")==="correct"
      ?{ok:true,title:"Dana's board slide",text:'<em>Dana puts the ruler in a drawer.</em> "Flat, then a cliff once we pass forty patients. That\'s what my nurses have been saying for a year. Now I can show it."'}
      :{ok:false,title:"Dana's board slide",text:'<em>Dana squints at the residual plot one more time.</em> "Smile shape means a curve. I\'ll look at that plot first from now on."'},
    takeaway:"Always look at the residual plot. A curve in the residuals means a straight line is the wrong shape; a squared term (polynomial regression) can fix it, and its own test says whether the curve is more than chance."};
}

function expertCase(){
  const memo=`<div class="art art-memo"><span class="sr">Printed output: </span><dl class="memo-head"><dt>From</dt><dd>Dr. Ruiz's fellow</dd><dt>Re</dt><dd>Side analysis: body weight and systolic BP, 80 trial patients at enrollment</dd></dl>
   <p>Coefficients: weight (kg): <strong>B = 0.62</strong>, <strong>Beta = .41</strong>, Sig. &lt; .001</p><p>Fellow's note: "Beta = .41, so 41% of blood pressure is explained by weight??"</p></div>`;
  return {id:"e1",npc:"ruiz",title:"The other coefficient",
    scene:"Dr. Ruiz is reading her fellow's printout with the expression of someone grading a test.",
    message:"<p>My fellow ran a regression of blood pressure on weight for a side paper. He understands B. He does not understand Beta, and he has invented a meaning for it. Help me correct him.</p>",
    steps:[
      {id:"e1s1",label:"What Beta means",show:memo,prompt:"What does Beta = .41 mean?",
       hint:"Beta is the slope after both variables are standardized: measured in standard deviations.",
       options:[
        {t:"One standard deviation more weight goes with .41 standard deviation higher BP, on average",tag:"correct",fb:"Right. Standardizing puts both variables on the same scale, which is why Beta is handy for comparing predictors measured in different units."},
        {t:"Each extra kilogram of body weight goes with 0.41 mmHg higher systolic blood pressure, on average",tag:"beta_units",fb:"That would be B, and B is 0.62 mmHg per kg."},
        {t:"Weight explains 41% of the variation in blood pressure among the 80 patients",tag:"r2_misread",fb:"The share explained is R Square, not Beta."}]},
      {id:"e1s2",label:"One predictor",show:memo,prompt:"With only one predictor, the standardized coefficient Beta equals…",
       hint:"Both variables are on a standard scale, and one familiar number already measures a linear relationship on that scale.",
       options:[
        {t:"the correlation r between weight and blood pressure",tag:"correct",fb:"Right. In simple regression, Beta = r, and R Square = r²."},
        {t:"R Square, the share of blood pressure variation explained by weight",tag:"r2_misread",fb:"R Square is r squared: here about .17."},
        {t:"the slope B, in mmHg per kg of weight",tag:"beta_units",fb:"That's B, in the data's own units: 0.62 mmHg per kg."}]}],
    outro:g=>g("e1s1")==="correct"
      ?{ok:true,title:"The fellow, corrected",text:'Dr. Ruiz caps her pen. "Standard deviations, not percent. He\'ll rewrite the paragraph tonight."'}
      :{ok:false,title:"The fellow, corrected",text:'"Beta is in standard deviations. B is in the units. I\'ll have him write it out ten times."'},
    takeaway:"B is the slope in the data's units. Beta is the slope in standard deviations; with one predictor it equals the correlation r."};
}

function sc(d0,d1,r0,r1){return v=>r0+(v-d0)/(d1-d0)*(r1-r0);}
function ticks(lo,hi,k=6){const s0=(hi-lo)/k,m=Math.pow(10,Math.floor(Math.log10(s0)));const st=[1,2,5,10].map(v=>v*m).find(v=>v>=s0);const o=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)o.push(+v.toFixed(6));return o;}
function axis(x,lo,hi,y,x0,x1){return `<line class="v-axis" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/>`+ticks(lo,hi).map(v=>`<line class="v-axis" x1="${x(v)}" x2="${x(v)}" y1="${y}" y2="${y+5}"/><text x="${x(v)}" y="${y+18}" text-anchor="middle">${v}</text>`).join("");}
function mean(a){return a.reduce((s,v)=>s+v,0)/a.length;}
function sdv(a){const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/(a.length-1));}

function portrait(p,size=64){return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="var(--teal-wash)"/><circle cx="32" cy="25" r="11" fill="${p.color}"/><path d="M12 58c3-13 11-19 20-19s17 6 20 19z" fill="${p.color}"/><text x="32" y="29" text-anchor="middle" class="m-init">${p.initials}</text></svg>`;}

/* ---------- WEEKS 1 TO 3: SHARED HELPERS ---------- */
let GEN_OK=0;const GEN_MISS=[];
function SEED(){return (typeof S!=="undefined"&&S&&S.seed!=null)?S.seed:20260901;}
function pctile(sorted,p){const n=sorted.length,pos=p*(n+1);if(pos<=1)return sorted[0];if(pos>=n)return sorted[n-1];const k=Math.floor(pos),f=pos-k;return sorted[k-1]+f*(sorted[k]-sorted[k-1]);}

function pct(x,d){return fx(100*x,d==null?1:d)+"%";}
/* box plot numbers: whiskers end at the most extreme values that are not outliers; outliers are drawn beyond them */
function boxStats(v){const s=[...v].sort((a,b)=>a-b),q1=pctile(s,.25),md=pctile(s,.5),q3=pctile(s,.75),iqr=q3-q1,lo=q1-1.5*iqr,hi=q3+1.5*iqr;

function round1(x){return Math.round(x*10)/10;}

/* histogram. o: {lo,hi,bw,xlab,lines:[{v,lab,cls}],cap,hl:fn(binStart)} */
function histo(v,o){const W=360,H=o.h||196,L=34,Rt=348,base=H-40,nb=Math.round((o.hi-o.lo)/o.bw),cnt=Array(nb).fill(0);
  v.forEach(x=>{let b=Math.floor((x-o.lo)/o.bw);b=Math.max(0,Math.min(nb-1,b));cnt[b]++;});
  const ymax=Math.max(...cnt),yt=ticks(0,ymax,4),ytop=Math.max(ymax,yt[yt.length-1]),X=sc(o.lo,o.hi,L,Rt),Y=sc(0,ytop,base,14);
  let g=yt.map(t=>`<line class="v-grid" x1="${L}" x2="${Rt}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-5}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join("");
  cnt.forEach((c,i)=>{const x0=o.lo+i*o.bw;if(c)g+=`<rect x="${X(x0)+.5}" y="${Y(c)}" width="${Math.max(1,X(x0+o.bw)-X(x0)-1)}" height="${base-Y(c)}" fill="${o.hl&&o.hl(x0)?"var(--amber)":"var(--teal)"}" opacity=".85"/>`;});
  g+=axis(X,o.lo,o.hi,base,L,Rt);
  (o.lines||[]).forEach((l,i)=>{g+=`<line x1="${X(l.v)}" x2="${X(l.v)}" y1="${10+i*16}" y2="${base}" stroke="${l.cls==="v-reflab"?"var(--amber)":l.cls==="v-t1lab"?"var(--bad)":"var(--ink)"}" stroke-width="2.5" ${l.dash?'stroke-dasharray="5 3"':""}/><text x="${X(l.v)+(l.left?-5:5)}" y="${20+i*16}" text-anchor="${l.left?"end":"start"}" class="${l.cls||"v-strong"}">${l.lab}</text>`;});
  g+=`<text x="${(L+Rt)/2}" y="${H-4}" text-anchor="middle">${o.xlab}</text>`;
  const top=cnt.indexOf(ymax);
  return vz(W,H,o.label||`Histogram of ${v.length} values of ${o.xlab}. The tallest bar is ${fx(o.lo+top*o.bw,o.bw<1?1:0)} to ${fx(o.lo+(top+1)*o.bw,o.bw<1?1:0)}.${(o.lines||[]).map(l=>" "+l.lab.replace(/<[^>]+>/g,"")+".").join("")}`,g,o.cap);}

/* horizontal box plots, one per group. Whisker ends are labeled; outliers are circles beyond them. */
function boxPlots(groups,o){const W=360,rowH=o.rowH||64,top=10,H=top+rowH*groups.length+46,L=o.L||70,Rt=346,X=sc(o.lo,o.hi,L,Rt),base=H-38;
  let g=axis(X,o.lo,o.hi,base,L,Rt)+`<text x="${(L+Rt)/2}" y="${H-2}" text-anchor="middle">${o.xlab}</text>`;const say=[];
  if(o.ref!=null)g+=`<line class="v-ref" x1="${X(o.ref)}" x2="${X(o.ref)}" y1="${top}" y2="${base}"/><text x="${X(o.ref)+4}" y="${top+10}" class="v-reflab">${o.refLab||""}</text>`;
  groups.forEach((gr,i)=>{const b=boxStats(gr.v),ym=top+i*rowH+rowH/2,y0=ym-12,y1=ym+12;
    if(gr.name)g+=`<text x="${L-8}" y="${ym+4}" text-anchor="end" class="v-strong">${gr.name}</text>`;
    g+=`<line x1="${X(b.wLo)}" x2="${X(b.q1)}" y1="${ym}" y2="${ym}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(b.q3)}" x2="${X(b.wHi)}" y1="${ym}" y2="${ym}" stroke="var(--ink)" stroke-width="1.5"/>`;
    g+=`<line x1="${X(b.wLo)}" x2="${X(b.wLo)}" y1="${ym-8}" y2="${ym+8}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(b.wHi)}" x2="${X(b.wHi)}" y1="${ym-8}" y2="${ym+8}" stroke="var(--ink)" stroke-width="1.5"/>`;
    g+=`<rect x="${X(b.q1)}" y="${y0}" width="${Math.max(1,X(b.q3)-X(b.q1))}" height="${y1-y0}" fill="var(--teal-wash)" stroke="var(--teal)" stroke-width="2"/><line x1="${X(b.md)}" x2="${X(b.md)}" y1="${y0}" y2="${y1}" stroke="var(--teal)" stroke-width="3"/>`;
    if(o.whiskLab)g+=`<text x="${X(b.wLo)}" y="${ym+24}" text-anchor="middle">${o.fmt?o.fmt(b.wLo):b.wLo}</text><text x="${X(b.wHi)}" y="${ym-15}" text-anchor="middle" class="v-strong">${o.fmt?o.fmt(b.wHi):b.wHi}</text>`;
    b.outs.forEach((x,k)=>{g+=`<circle cx="${X(x)}" cy="${ym+(k%2?6:-6)}" r="4.5" fill="none" stroke="var(--bad)" stroke-width="2"/>`;});

/* vertical bar chart for categories, labeled with counts and percentages */
function barChart(names,counts,o){o=o||{};const W=360,H=o.h||200,L=10,Rt=350,base=H-44,n=names.length,bw=(Rt-L)/n,tot=counts.reduce((a,b)=>a+b,0),mx=Math.max(...counts)*1.18,Y=sc(0,mx,base,10);
  let g=`<line class="v-axis" x1="${L}" x2="${Rt}" y1="${base}" y2="${base}"/>`;
  names.forEach((nm,i)=>{const x=L+i*bw,c=counts[i];g+=`<rect x="${x+bw*.18}" y="${Y(c)}" width="${bw*.64}" height="${base-Y(c)}" rx="2" fill="${o.hi===i?"var(--amber)":"var(--teal)"}" opacity=".88"/>`+
    `<text x="${x+bw/2}" y="${Y(c)-5}" text-anchor="middle" class="v-strong">${o.pctOnly?pct(c/tot,0):c}</text>`+
    nm.split("|").map((t,k)=>`<text x="${x+bw/2}" y="${base+15+k*13}" text-anchor="middle">${t}</text>`).join("");});
  return vz(W,H,`Bar chart of ${o.lab||"counts"}: ${names.map((nm,i)=>nm.replace("|"," ")+" "+counts[i]+" ("+pct(counts[i]/tot,0)+")").join("; ")}.`,g,o.cap);}

/* a normal (or t) curve with an optional shaded area. o: {mu,sd,lo,hi,shade:[a,b],xlab,marks:[{v,lab}],df,cap,label} */

    g+=`<polygon class="v-shade" points="${X(Math.max(o.lo,a))},${base} ${sp.join(" ")} ${X(Math.min(o.hi,b))},${base}"/>`;}
  g+=`<polyline class="v-curve" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  g+=`<line class="v-axis" x1="${L}" x2="${Rt}" y1="${base}" y2="${base}"/>`;
  (o.ticks||[]).forEach(t=>{g+=`<line class="v-axis" x1="${X(t.v)}" x2="${X(t.v)}" y1="${base}" y2="${base+5}"/><text x="${X(t.v)}" y="${base+17}" text-anchor="middle" ${t.strong?'class="v-strong"':""}>${t.lab}</text>`;});
  (o.marks||[]).forEach(m=>{g+=`<line x1="${X(m.v)}" x2="${X(m.v)}" y1="${Y(dens(m.v))-4}" y2="${base}" stroke="var(--amber)" stroke-width="2.5"/><text x="${X(m.v)+(m.left?-5:5)}" y="${Math.max(14,Y(dens(m.v))-8)}" text-anchor="${m.left?"end":"start"}" class="v-reflab">${m.lab}</text>`;});

  return vz(W,H,o.label,g,o.cap);}

/* a grid of people, colored by group: [{n,cls,lab}] */
function people(groups,o){o=o||{};const per=o.per||20,r=6,gap=17,tot=groups.reduce((a,g)=>a+g.n,0),rows=Math.ceil(tot/per),W=per*gap+12,H=rows*gap+12;let k=0,g="";
  groups.forEach(gr=>{for(let i=0;i<gr.n;i++,k++){const x=8+(k%per)*gap+r,y=8+Math.floor(k/per)*gap+r;g+=gr.ring?`<circle cx="${x}" cy="${y}" r="${r-1}" fill="${gr.fill}" stroke="${gr.ring}" stroke-width="2.5"/>`:`<circle cx="${x}" cy="${y}" r="${r}" fill="${gr.fill}"/>`;}});
  return vz(W,H,o.label||groups.map(gr=>gr.n+" "+gr.lab).join(", ")+".",g,o.cap);}

/* SPSS-style crosstab: o.rows, o.cols, o.T, o.stats ("count","row","col","tot"), o.labels, o.pick(i,stat,j)->key */
function crosstab(o){const T=o.T,r=T.map(row=>row.reduce((s,v)=>s+v,0)),c=T[0].map((_,j)=>T.reduce((s,row)=>s+row[j],0)),N=r.reduce((s,v)=>s+v,0);
  const lab=Object.assign({count:"Count",row:`% within ${o.rowVar}`,col:`% within ${o.colVar}`,tot:"% of Total"},o.labels||{});
  const val=(i,s,j)=>{const cnt=i<0?(j<0?N:c[j]):(j<0?r[i]:T[i][j]),rt=i<0?N:r[i],ct=j<0?N:c[j];

  const cell=(i,s,j)=>{const v=val(i,s,j),k=o.pick?o.pick(i,s,j):null;if(!k)return v;
    const rn=i<0?"Total":o.rows[i],cn=j<0?"Total":o.cols[j];
    return `<button class="pick" data-pick="${k}" aria-label="${rn}, ${lab[s].replace(/"/g,"")}, ${o.colVar} ${cn}: ${v}">${v}</button>`;};
  const block=(i,name)=>o.stats.map((s,k)=>`<tr${k===0?' class="grp"':''}>${k===0?`<th scope="rowgroup" rowspan="${o.stats.length}">${name}</th>`:""}<th scope="row" class="stat">${lab[s]}</th>${o.cols.map((_,j)=>`<td>${cell(i,s,j)}</td>`).join("")}<td>${cell(i,s,-1)}</td></tr>`).join("");

/* ---------- the builder, weeks 1 to 3: every row gets a choice from spec.roles; spec.want holds the right ones ---------- */
function analysisName(b,vars,spec){return spec.name||"Your setup";}
function shortName(p){const n=p.name.split(",")[0];return n.startsWith("Dr.")?"Dr. "+n.split(" ").pop():n.split(" ")[0];}
function buildReason(type,want,got,F,nm,v,spec){if(!got)return "still needs a choice.";return (spec&&spec.why&&spec.why[v])||"doesn't fit. Check your notes.";}
function designReason(want,got,tmode,spec){const lab=(spec&&spec.designLab)||"Design question";
  if(got==null)return `<strong>${lab}:</strong> it needs an answer too.`;return `<strong>${lab}:</strong> ${(spec&&spec.designWhy)||"check your notes."}`;}
function evalBuild(spec,b){const roles=b.roles||{};
  for(const v of spec.vars){const got=roles[v[0]]||"",want=spec.want[v[0]]||"";if(got===want)continue;if(!got)return "no_choice";return spec.tagOf?spec.tagOf(v[0],want,got):"build_wrong";}
  if(!spec.noDesign){if(b.repeated===null)return "no_design";if(b.repeated!==spec.repeated)return spec.designTag||"design_wrong";}
  return "correct";}

/* ---------- WEEKS 9 AND 10: REGRESSION HELPERS ---------- */
function matInv(A){const n=A.length,M=A.map((r,i)=>[...r,...A.map((_,j)=>i===j?1:0)]);

    const d=M[c][c];for(let k=0;k<2*n;k++)M[c][k]/=d;
    for(let r=0;r<n;r++)if(r!==c){const f=M[r][c];if(f)for(let k=0;k<2*n;k++)M[r][k]-=f*M[c][k];}}
  return M.map(r=>r.slice(n));}
/* ordinary least squares: y on the columns in X (an intercept is added). Returns everything SPSS prints. */
function ols(y,X){const n=y.length,p=X.length,rows=y.map((_,i)=>[1,...X.map(c=>c[i])]),k=p+1;
  const XtX=Array.from({length:k},(_,a)=>Array.from({length:k},(_,b)=>rows.reduce((s,r)=>s+r[a]*r[b],0)));

  const inv=matInv(XtX),b=inv.map(r=>r.reduce((s,v,j)=>s+v*Xty[j],0));
  const yhat=rows.map(r=>r.reduce((s,v,j)=>s+v*b[j],0)),res=y.map((v,i)=>v-yhat[i]),my=mean(y);
  const SST=y.reduce((s,v)=>s+(v-my)**2,0),SSE=res.reduce((s,v)=>s+v*v,0),SSR=SST-SSE,dfR=p,dfE=n-p-1,MSE=SSE/dfE,MSR=SSR/dfR,F=MSR/MSE;
  const se=b.map((_,j)=>Math.sqrt(MSE*inv[j][j])),t=b.map((v,j)=>v/se[j]),pv=t.map(v=>twoSidedP(v,dfE)),sy=sdv(y);
  const beta=b.map((v,j)=>j?v*sdv(X[j-1])/sy:null),R2=SSR/SST;
  const vif=X.map((c,j)=>{if(p<2)return 1;const o=X.filter((_,q)=>q!==j);const r=olsR2(c,o);return 1/(1-r);});
  const sdh=sdv(yhat),mh=mean(yhat);
  return {n,p,b,se,t,pv,beta,vif,yhat,res,SST,SSE,SSR,dfR,dfE,MSE,MSR,F,pF:fSurv(F,dfR,dfE),R2,R:Math.sqrt(Math.max(0,R2)),adjR2:1-(1-R2)*(n-1)/dfE,
    zres:res.map(v=>v/Math.sqrt(MSE)),zpred:yhat.map(v=>(v-mh)/sdh)};}
function olsR2(y,X){const rows=y.map((_,i)=>[1,...X.map(c=>c[i])]),k=X.length+1;
  const XtX=Array.from({length:k},(_,a)=>Array.from({length:k},(_,b)=>rows.reduce((s,r)=>s+r[a]*r[b],0))),Xty=Array.from({length:k},(_,a)=>rows.reduce((s,r,i)=>s+r[a]*y[i],0));
  const inv=matInv(XtX),b=inv.map(r=>r.reduce((s,v,j)=>s+v*Xty[j],0)),my=mean(y);let sse=0,sst=0;

  }
  if(st.type==="cards"){
    box.querySelector(".opts").outerHTML=`${st.context?`<div class="recap"><p class="recap-h">${st.contextTitle||"The facts on the table"}</p>${String(st.context).replace(/= (&lt;|<)/g,"$1 ")}</div>`:""}${st.claim?`<div class="bubble claim">${st.claim}</div>`:""}<div class="cards" role="group" aria-label="Evidence cards">${st.cards.map((c,k)=>[Math.random(),c,k]).sort((x,y)=>x[0]-y[0]).map(([_,c,k])=>`<button class="ecard" data-k="${k}"><span class="etag">${c.k||"Evidence"}</span>${c.t}</button>`).join("")}</div>`;
    lockAll=()=>box.querySelectorAll(".ecard").forEach(b=>b.setAttribute("aria-disabled","true"));
    box.querySelectorAll(".ecard").forEach(b=>b.onclick=()=>choose(b,st.cards[+b.dataset.k],"You lay your evidence card on the table…"));
  }
  if(st.type==="point"){
    lockAll=()=>box.querySelectorAll("[data-pick]").forEach(b=>b.setAttribute("aria-disabled","true"));
    box.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const it=st.picks[b.dataset.pick];if(it)choose(b,it,`You point it out to ${firstName(who)}…`);});
  }

  if(st.type==="reply"||st.type==="interview"){
    const bub=(you,t)=>`<div class="msg ${you?"you":"them"}"><span class="msg-who">${you?"You":firstName(who)}</span>${t}</div>`;
    box.querySelector(".opts").outerHTML=`<div class="thread ${st.channel||"chat"}">${st.channel==="email"?`<div class="mailhead"><span><strong>From:</strong> ${who.name}</span><span><strong>Subject:</strong> ${st.subject||""}</span></div>`:""}<div class="msgs" id="msgs" aria-live="polite">${(st.thread||[]).map(m=>bub(false,m)).join("")}</div>${st.type==="interview"?`<div class="asks"><span class="slotlab" style="width:100%">Ask ${firstName(who)}:</span>${st.questions.map((q,k)=>`<button class="ask" data-k="${k}">${q.q}</button>`).join("")}</div>`:""}<div id="composeHost"></div></div>`;
    const msgs=document.getElementById("msgs"),addMsg=(you,t)=>msgs.insertAdjacentHTML("beforeend",bub(you,t));
    const doCompose=()=>{
      const host=document.getElementById("composeHost"),sel=st.slots.map(()=>null);
      host.innerHTML=`<div class="compose"><span class="slotlab">Build your ${st.channel==="email"?"email":"reply"} from the pieces</span>${st.slots.map((sl,si)=>`<div class="slotrow" data-row="${si}"><span class="slotlab">${sl.label}<span class="rowstat"></span></span><div class="tiles">${sl.options.map((o,oi)=>[Math.random(),oi]).sort((x,y)=>x[0]-y[0]).map(([_,oi])=>`<button class="tile" aria-pressed="false" data-s="${si}" data-o="${oi}">${sl.options[oi].t}</button>`).join("")}</div></div>`).join("")}<div class="draftmsg" id="draftmsg">…</div><button class="primary" id="sendBtn">${st.channel==="email"?"Send email":"Send"}</button></div>`;
      const txt=()=>sel.map((x,si)=>x===null?"…":st.slots[si].options[x].t).join(" ");
      host.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(done||busy||b.disabled)return;clearRow(b);const si=+b.dataset.s;sel[si]=+b.dataset.o;host.querySelectorAll(`.tile[data-s="${si}"]`).forEach(t=>t.setAttribute("aria-pressed",t===b?"true":"false"));document.getElementById("draftmsg").textContent=txt();});
      document.getElementById("sendBtn").onclick=()=>{
        if(done||busy)return;if(sel.some(x=>x===null)){fb.innerHTML=`<p class="where">Pick a piece from each row first.</p>`;return;}
        addMsg(true,txt());const bad=sel.map((x,si)=>st.slots[si].options[x]).find(o=>o.tag!=="correct"),tag=bad?bad.tag:"correct";
        if(rec.first===null){rec.first=tag;rec.hintBefore=hintUsed;}
        if(!bad){host.querySelectorAll("button").forEach(b=>b.disabled=true);box.querySelectorAll(".ask").forEach(b=>b.disabled=true);if(st.reveal){const vs=document.getElementById("vizSlot");if(vs)vs.innerHTML=unit.viz||"";markScrollers();}okFinish(wrapP(st.okFb));}
        else badFinish(null,`${firstName(who)} is typing…`,gradeRows(host,sel));};
    };
    if(st.type==="reply")doCompose();
    else{let opened=false;box.querySelectorAll(".ask").forEach(b=>b.onclick=()=>{if(done||busy||b.disabled)return;const q=st.questions[+b.dataset.k];b.disabled=true;addMsg(true,q.q);addMsg(false,q.a);if(!q.key)cred(-1);if(q.key&&!opened){opened=true;doCompose();}});}
  }
  if(st.type==="tiles"){
    const sel=st.slots.map(()=>null);
    box.querySelector(".opts").outerHTML=`${st.slots.map((sl,si)=>`<fieldset data-row="${si}"><legend>${sl.label}<span class="rowstat"></span></legend><div class="tiles">${sl.options.map((o,oi)=>[Math.random(),oi]).sort((x,y)=>x[0]-y[0]).map(([_,oi])=>`<button class="tile" aria-pressed="false" data-s="${si}" data-o="${oi}">${sl.options[oi].t}</button>`).join("")}</div></fieldset>`).join("")}<p class="headline" id="hl" aria-live="polite">Pick one tile from each row to build the headline.</p><button class="quiet" id="present">Present the headline</button>`;
    const upd=()=>{document.getElementById("hl").textContent=sel.map((x,si)=>x===null?"…":st.slots[si].options[x].t).join(" ")+(sel.every(x=>x!==null)?".":"");};
    box.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(done||busy||b.disabled)return;clearRow(b);const si=+b.dataset.s;sel[si]=+b.dataset.o;box.querySelectorAll(`.tile[data-s="${si}"]`).forEach(t=>t.setAttribute("aria-pressed",t===b?"true":"false"));upd();});
    document.getElementById("present").onclick=()=>{
      if(done||busy)return;if(sel.some(x=>x===null)){fb.innerHTML=`<p class="where">Pick a tile from each row first.</p>`;return;}
      const bad=sel.map((x,si)=>st.slots[si].options[x]).find(o=>o.tag!=="correct"),tag=bad?bad.tag:"correct";
      if(rec.first===null){rec.first=tag;rec.hintBefore=hintUsed;}
      if(!bad){box.querySelectorAll(".tile,#present").forEach(e=>e.disabled=true);okFinish(wrapP(st.okFb));}
      else badFinish(null,`You present the headline to ${firstName(who)}…`,gradeRows(box,sel));};
  }
}
function showOutro(unit,kind,lvl){
  const g=id=>valueOf(S.results[id]).replace("correct_hint","correct"),oc=unit.outro(g),box=document.getElementById("steps");
  box.innerHTML=`<div class="outro"><div class="status ${oc.ok?"":"mixed"}"><span class="status-icon" aria-hidden="true">${oc.ok?"✓":"↺"}</span><div><p class="status-title">${oc.title}</p><p>${oc.text}</p></div></div>
    <p class="takeaway"><strong>Takeaway:</strong> ${unit.takeaway}</p><div class="actions"><button class="primary" id="cont">${kind==="finale"?"File the report and see my results":"Back to the hallway"}</button></div></div>`;
  const h=box.querySelector(".status-title");box.querySelector(".outro").scrollIntoView({behavior:"smooth",block:"start"});
  document.getElementById("cont").onclick=()=>{if(kind==="finale"){S.finaleDone=true;S.phase="done";applySeason();save();gcount("finished",`Episode ${WEEK.num} finished`);renderSummary();}else unitDone(unit,kind,lvl);};document.getElementById("cont").focus({preventScroll:true});
}
function unitDone(unit,kind,lvl){
  let msg="";
  if(kind==="core"){const idx=+unit.id.slice(1)-1;S.done.push(idx);S.path[idx]=lvl;
    const ids=unit.steps.map(s=>s.id),misses=ids.filter(id=>!S.results[id]||S.results[id].first!=="correct"),hinted=ids.filter(id=>S.results[id]&&S.results[id].hintBefore);
    if(misses.length===0&&hinted.length===0)S.level=1;else if(misses.length>=2)S.level=0;
    if(S.fuDone.length<1)for(const id of misses){const fu=FU_MAP[S.results[id]&&S.results[id].first];if(fu&&!S.fuDone.includes(fu)){S.pendingFU=fu;break;}}
    msg=`Sign-off collected (${S.done.length} of 4).`+(S.done.length===4?" Take the report to Dr. Brooks in the Quality Office.":"");
    if(S.done.length===4&&!S.pendingFU&&WEEK.hidden&&!S.hiddenUnlocked&&CORE.every((c,ci)=>c(coreRng(ci),S.path[ci]).steps.every(st=>S.results[st.id]&&S.results[st.id].first==="correct"))){S.hiddenUnlocked=true;msg+=` ★ Jordan texts: "You didn't need me once this week. Come to Statistics. There's something strange in the data."`;}
  }else if(kind==="hidden"){S.hiddenDone=true;msg="★ Hidden problem solved. Jordan is impressed.";
  }else if(kind==="fu"){S.fuDone.push(unit.id);S.pendingFU=null;msg="Jordan's done with you. Back to the consults.";}
  else{S.expDone.push(unit.id);msg="Nice work on the optional consult.";}
  save();renderMap();if(!S.pendingFU)toast(msg);
}
function finalReport(){
  if(WEEK.finale&&!S.finaleDone){const b=NPCS.find(q=>q.id==="brooks");return startUnit(WEEK.finale(S),"finale",null,b);}
  mapActive=false;const p=NPCS.find(q=>q.id==="brooks");
  app.innerHTML=`<div class="talk-head">${portrait(p)}<div><p class="where">${p.room}</p><h1 tabindex="-1">Filing the quality report</h1><p class="who">${p.name}, ${p.role}</p></div></div>
    <div class="bubble"><p>${WEEK.ending({...SEASON.flags,...WEEK.keyFlags(S).flags})}</p></div>
    <div class="actions"><button class="primary" id="file">File the report and see my results</button><button class="quiet" id="back">Not yet, back to the floor</button></div>`;
  app.querySelector("h1").focus();
  document.getElementById("file").onclick=()=>{S.phase="done";applySeason();save();renderSummary();};
  document.getElementById("back").onclick=()=>renderMap();
}
function buildPayload(){
  const parts=[`Mission ${CONFIG.mission}`,`version ${CONFIG.version}`,`save ${MODE==="season"?"on":"off"}`,`case levels ${[0,1,2,3].map(i=>S.path[i]??"-").join("")}`,`credibility ${S.cred}`,`hints ${S.hints}`,`minutes ${Math.round((Date.now()-S.started)/60000)}`];
  const add=(u,name)=>u.steps.forEach(st=>{const v=valueOf(S.results[st.id]);if(v)parts.push(`${name}, ${st.label}: ${v}`);});
  CORE.forEach((c,i)=>{if(S.done.includes(i)){const u=c(coreRng(i),S.path[i]);add(u,`Case ${i+1} (${u.title})`);}});
  if(WEEK.finale&&S.finaleDone){const u=WEEK.finale(S);add(u,u.title);}
  if(S.hiddenDone&&WEEK.hidden){const u=WEEK.hidden();add(u,"Hidden problem ("+u.title+")");}
  S.fuDone.forEach(id=>{const u=FOLLOWUPS[id]();add(u,u.title);});
  if(S.expDone.length)add(expertCase(),"Optional ("+expertCase().title+")");
  return {results:parts.join(" | ").replace(/α/g,"alpha").replace(/μ/g,"mu")};
}
function renderSummary(){
  mapActive=false;setBar("Results");
  const units=CORE.map((c,i)=>c(coreRng(i),S.path[i]||0)),coreSteps=units.flatMap(u=>u.steps);
  const first=coreSteps.filter(s=>S.results[s.id]&&S.results[s.id].first==="correct").length;
  const status=id=>{const v=valueOf(S.results[id]);return v==="correct"?`<span class="st ok">First try</span>`:v==="correct_hint"?`<span class="st ok">First try, with a hint</span>`:`<span class="st retry">Took another try</span>`;};
  const payload=buildPayload(),configured=!!CONFIG.qualtricsUrl;
  const codeBox=MODE==="season"?`<div class="submit-box" style="margin:1rem 0"><h2>Your career code</h2><p>Your season is saved on this browser. To continue on another device, keep this code somewhere safe:</p><p><code id="ccode" style="font-size:1.15rem">${encodeCareer(SEASON)}</code> <button class="quiet" id="copyc">Copy</button></p></div>`
    :`<div class="submit-box" style="margin:1rem 0"><h2>Played without saving</h2><p>Nothing was saved on this device.</p><p id="ccWrap"><button class="linkish" id="showc">Get a career code anyway</button></p></div>`;
  app.innerHTML=`<p class="where">Report filed</p><h1 tabindex="-1">${title()}</h1>
    <div class="stats"><div class="stat"><b>${first} of ${coreSteps.length}</b><span>right on the first try</span></div><div class="stat"><b>${S.cred}</b><span>reputation</span></div><div class="stat"><b>${S.hints}</b><span>hints</span></div></div>${S.hiddenDone?`<p class="takeaway">★ You solved this week's hidden problem.</p>`:""}
    <div class="submit-box">${configured?`<h2>Submit your results</h2><p>You'll go to a short anonymous survey. Your game results go along automatically, without your name. <strong>Click the arrow at the bottom of the survey to finish.</strong></p><div class="actions"><button class="primary" id="submit">Submit my results</button></div>`:`<h2>Instructor preview</h2><p>No survey connected.</p>`}</div>
    <div class="bubble"><p><strong>Next week:</strong> ${WEEK.teaser}</p></div>${codeBox}<ul class="review">${units.flatMap(u=>u.steps.map(s=>`<li><span>${u.title}: ${s.label}</span>${status(s.id)}</li>`)).join("")}</ul>
    ${(!configured||PREVIEW)?`<h2>What gets sent</h2><p style="font-size:.9rem;overflow-wrap:anywhere">${payload.results}</p>`:""}
    <div class="actions"><button class="linkish" id="restart">Play again from the start</button></div>`;
  window.scrollTo(0,0);app.querySelector("h1").focus({preventScroll:true});
  const cp=document.getElementById("copyc");if(cp)cp.onclick=()=>{const t=document.getElementById("ccode").textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{cp.textContent="Copied";},()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("ccode"));getSelection().removeAllRanges();getSelection().addRange(r);cp.textContent="Selected: press Ctrl+C";});};
  const shc=document.getElementById("showc");if(shc)shc.onclick=()=>{document.getElementById("ccWrap").innerHTML=`<code style="font-size:1.15rem">${encodeCareer(SEASON)}</code><br><span class="where">Enter it at the start of next week's game to keep your story.</span>`;};
  const sb=document.getElementById("submit");if(sb)sb.onclick=()=>{const u=new URL(CONFIG.qualtricsUrl);u.searchParams.set("results",payload.results);location.href=u.toString();};
  document.getElementById("restart").onclick=()=>{if(!confirm("Start over? Your results on this device will be erased."))return;clearSaved();S=null;renderIntro();};
}
renderIntro();
}
</script>

        async src="//gc.zgo.at/count.js"></script>
