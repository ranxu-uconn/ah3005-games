function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,tmp=x+5.5;tmp-=(x+0.5)*Math.log(tmp);let ser=1.000000000190015;for(let j=0;j<6;j++){y+=1;ser+=c[j]/y;}return -tmp+Math.log(2.5066282746310005*ser/x);}
function betacf(a,b,x){const MAXIT=300,EPS=3e-12,FPMIN=1e-300;const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;}return h;}
function betai(a,b,x){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
function tcdf(t,df){const x=df/(df+t*t);const tail=0.5*betai(df/2,0.5,x);return t>=0?1-tail:tail;}
function tinv(p,df){let lo=-80,hi=80;for(let i=0;i<200;i++){const m=(lo+hi)/2;if(tcdf(m,df)<p)lo=m;else hi=m;}return (lo+hi)/2;}
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}

function zinv(p){let lo=-10,hi=10;for(let i=0;i<100;i++){const m=(lo+hi)/2;if(ncdf(m)<p)lo=m;else hi=m;}return (lo+hi)/2;}

function welchDf(s1,n1,s2,n2){const a=s1*s1/n1,b=s2*s2/n2;return (a+b)*(a+b)/(a*a/(n1-1)+b*b/(n2-1));}

  return {u:next,uni:(lo,hi)=>lo+(hi-lo)*next(),int:(lo,hi)=>lo+Math.floor(next()*(hi-lo+1)),

function b32sum(p){let c=0;for(let i=0;i<p.length;i++)c=(c+(i+1)*(B32.indexOf(p[i])+7))%1024;return B32[c>>5]+B32[c&31];}
function encodeCareer(d){
  let v=0n;const put=(val,bits)=>{v=(v<<BigInt(bits))|(BigInt(val)&((1n<<BigInt(bits))-1n));};
  put(1,3);let wm=0;d.weeks.forEach(w=>{if(w>=1&&w<=15)wm|=1<<(w-1);});put(wm,15);

  put(Math.max(0,DANA_N.indexOf(d.danaN)),2);put(Math.max(0,DANA_A.indexOf(d.danaA)),2);
  let p="";for(let i=14;i>=0;i--)p+=B32[Number((v>>BigInt(5*i))&31n)];
  return `RIV-${p.slice(0,5)}-${p.slice(5,10)}-${p.slice(10)}${b32sum(p)}`;
}
function decodeCareer(code){
  const s=String(code||"").trim().toUpperCase().replace(/^RIV/,"").replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");
  if(s.length!==17||[...s].some(ch=>B32.indexOf(ch)<0))return null;
  const p=s.slice(0,15);if(b32sum(p)!==s.slice(15))return null;
  let v=0n;for(const ch of p)v=(v<<5n)|BigInt(B32.indexOf(ch));
  const take=bits=>{const x=Number(v&((1n<<BigInt(bits))-1n));v>>=BigInt(bits);return x;};
  const d=seasonDefault();d.danaA=DANA_A[take(2)]??0.05;d.danaN=DANA_N[take(2)]??100;
  const fm=v&0xFFFFFFFFn;v>>=32n;d.flags={};FLAG_BITS.forEach((f,i)=>{d.flags[f]=Number((fm>>BigInt(i))&1n);});
  [...CAST_IDS].reverse().forEach(k=>{d.trust[k]=take(2)+1;});d.rep=take(7);

function mean(a){return a.reduce((s,v)=>s+v,0)/a.length;}
function sdv(a){const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/(a.length-1));}
function exactSample(R,n,m,s){const x=[];for(let i=0;i<n;i++)x.push(R.normal(0,1));const mu=mean(x),sd=sdv(x);return x.map(v=>m+(v-mu)/sd*s);}
function kpis(c){return `<div class="kpis">${c.map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("")}</div>`;}


/* ---------- ANOVA calculations ---------- */
function oneway(groups){const all=groups.flat(),N=all.length,k=groups.length,g=mean(all);
  const SSB=groups.reduce((s,a)=>s+a.length*(mean(a)-g)**2,0),SSW=groups.reduce((s,a)=>{const m=mean(a);return s+a.reduce((t,v)=>t+(v-m)**2,0);},0);
  const dfB=k-1,dfW=N-k,MSB=SSB/dfB,MSW=SSW/dfW,F=MSB/MSW;return {N,k,SSB,SSW,dfB,dfW,MSB,MSW,F,p:fSurv(F,dfB,dfW)};}
function scheffe(groups,names,a){const out=[];for(let i=0;i<groups.length;i++)for(let j=i+1;j<groups.length;j++){
  const d=mean(groups[i])-mean(groups[j]),Fp=(d*d/(a.MSW*(1/groups[i].length+1/groups[j].length)))/(a.k-1);
  out.push({a:names[i],b:names[j],d,p:fSurv(Fp,a.k-1,a.dfW)});}return out;}
function aovRows(a,label){return [["Between Groups",fx(a.SSB,3),a.dfB,fx(a.MSB,3),fx(a.F,3),fP(a.p)],["Within Groups",fx(a.SSW,3),a.dfW,fx(a.MSW,3),"",""],["Total",fx(a.SSB+a.SSW,3),a.N-1,"","",""]];}

/* ---------- regression / ANCOVA / mixed ANOVA / MANOVA helpers ---------- */
function ssxy(x,y){const mx=mean(x),my=mean(y);let sxx=0,syy=0,sxy=0;
  for(let i=0;i<x.length;i++){sxx+=(x[i]-mx)**2;syy+=(y[i]-my)**2;sxy+=(x[i]-mx)*(y[i]-my);}
  return {sxx,syy,sxy,mx,my,b:sxy/sxx,r:sxy/Math.sqrt(sxx*syy)};}
function ancova(G){ // G = [{name,x,y}]
  const k=G.length,N=G.reduce((s,g)=>s+g.y.length,0);
  const allx=G.flatMap(g=>g.x),ally=G.flatMap(g=>g.y);
  const T=ssxy(allx,ally);
  let Wxx=0,Wyy=0,Wxy=0;G.forEach(g=>{const s=ssxy(g.x,g.y);Wxx+=s.sxx;Wyy+=s.syy;Wxy+=s.sxy;});
  const b=Wxy/Wxx;                                   // pooled within-group slope
  const SSEw=Wyy-Wxy*Wxy/Wxx, dfE=N-k-1;             // error adjusted for covariate
  const SSEt=T.syy-T.sxy*T.sxy/T.sxx;                // error ignoring group
  const SSg=SSEt-SSEw, dfG=k-1;                      // group effect, adjusted
  const SScv=Wxy*Wxy/Wxx, MSE=SSEw/dfE;
  const Fg=(SSg/dfG)/MSE, Fc=SScv/MSE;
  const adj=G.map(g=>mean(g.y)-b*(mean(g.x)-T.mx));
  const raw=G.map(g=>mean(g.y));
  return {k,N,b,SSg,dfG,SScv,SSEw,dfE,MSE,Fg,Fc,pG:fSurv(Fg,dfG,dfE),pC:fSurv(Fc,1,dfE),
          adj,raw,grandX:T.mx,names:G.map(g=>g.name)};}
function slopesTest(G){ // homogeneity of regression slopes: group x covariate interaction
  const k=G.length,N=G.reduce((s,g)=>s+g.y.length,0);
  let Wxx=0,Wyy=0,Wxy=0,SSEsep=0;
  G.forEach(g=>{const s=ssxy(g.x,g.y);Wxx+=s.sxx;Wyy+=s.syy;Wxy+=s.sxy;SSEsep+=s.syy-s.sxy*s.sxy/s.sxx;});
  const SSEcommon=Wyy-Wxy*Wxy/Wxx;
  const SSint=SSEcommon-SSEsep, dfI=k-1, dfE=N-2*k, MSE=SSEsep/dfE;
  const F=(SSint/dfI)/MSE;
  return {SSint,dfI,SSEsep,dfE,MSE,F,p:fSurv(F,dfI,dfE),slopes:G.map(g=>ssxy(g.x,g.y).b)};}
function mixedAnova(rows,t){ // rows = [{g:groupName, y:[t values]}]
  const groups=[...new Set(rows.map(r=>r.g))],k=groups.length;
  const all=rows.flatMap(r=>r.y),N=rows.length,G=mean(all);
  const SStot=all.reduce((s,v)=>s+(v-G)**2,0);
  const subjMean=rows.map(r=>mean(r.y));
  const SSbs=t*subjMean.reduce((s,v)=>s+(v-G)**2,0);
  const gMean=groups.map(gr=>mean(rows.filter(r=>r.g===gr).flatMap(r=>r.y)));
  const gN=groups.map(gr=>rows.filter(r=>r.g===gr).length);
  const SSa=groups.reduce((s,gr,i)=>s+t*gN[i]*(gMean[i]-G)**2,0), dfA=k-1;
  const SSsa=SSbs-SSa, dfSA=N-k;
  const tMean=[];for(let j=0;j<t;j++)tMean.push(mean(rows.map(r=>r.y[j])));
  const SSt=N*tMean.reduce((s,v)=>s+(v-G)**2,0), dfT=t-1;
  let SSat=0;groups.forEach((gr,i)=>{const sub=rows.filter(r=>r.g===gr);
    for(let j=0;j<t;j++){const cell=mean(sub.map(r=>r.y[j]));SSat+=gN[i]*(cell-gMean[i]-tMean[j]+G)**2;}});
  const dfAT=(k-1)*(t-1);
  const SSws=SStot-SSbs, SSts=SSws-SSt-SSat, dfTS=(t-1)*(N-k);
  const MSsa=SSsa/dfSA, MSts=SSts/dfTS;
  const Fa=(SSa/dfA)/MSsa, Ft=(SSt/dfT)/MSts, Fat=(SSat/dfAT)/MSts;
  return {groups,k,t,N,SSa,dfA,Fa,pA:fSurv(Fa,dfA,dfSA),SSsa,dfSA,MSsa,
          SSt,dfT,Ft,pT:fSurv(Ft,dfT,dfTS),SSat,dfAT,Fat,pAT:fSurv(Fat,dfAT,dfTS),SSts,dfTS,MSts,
          cell:groups.map(gr=>{const sub=rows.filter(r=>r.g===gr);const o=[];for(let j=0;j<t;j++)o.push(mean(sub.map(r=>r.y[j])));return o;})};}
function manova2(G){ // one-way MANOVA, two outcomes; exact F via Wilks for p=2
  const k=G.length,N=G.reduce((s,g)=>s+g.a.length,0);
  const A=G.flatMap(g=>g.a),B=G.flatMap(g=>g.b),ma=mean(A),mb=mean(B);
  const sc=(xs,ys,mx,my)=>{let s=0;for(let i=0;i<xs.length;i++)s+=(xs[i]-mx)*(ys[i]-my);return s;};
  const Taa=sc(A,A,ma,ma),Tbb=sc(B,B,mb,mb),Tab=sc(A,B,ma,mb);
  let Waa=0,Wbb=0,Wab=0;
  G.forEach(g=>{const ga=mean(g.a),gb=mean(g.b);Waa+=sc(g.a,g.a,ga,ga);Wbb+=sc(g.b,g.b,gb,gb);Wab+=sc(g.a,g.b,ga,gb);});
  const detW=Waa*Wbb-Wab*Wab, detT=Taa*Tbb-Tab*Tab, L=detW/detT;
  const rt=Math.sqrt(L), df1=2*(k-1), df2=2*(N-k-1);
  const F=((1-rt)/rt)*((N-k-1)/(k-1));
  return {L,F,df1,df2,p:fSurv(F,df1,df2),
          a:oneway(G.map(g=>g.a)),b:oneway(G.map(g=>g.b))};}

function case1(R,level){ // Dr. Wei Zhang, Oncology (guest) - ANCOVA
  const names=["Walking","Yoga","Usual care"],n=level?14:16;
  let G,st,anc;
  for(let k=0;k<400;k++){
    // level 0 (entry): one shared slope, so the ANCOVA is interpretable.
    // level 1 (advanced): the slopes differ, so a single adjusted effect would mislead.
    const slopes=level?[.25,.62,1.02]:[.62,.62,.62];
    const ints=level?[3.0,-5.0,-13.0]:[-12.0,-6.0,1.9];
    const base=level?[47,46,45]:[49,46,43];
    G=names.map((nm,i)=>{const x=exactSample(R,n,base[i]+R.normal(0,.8),8).map(v=>Math.round(v));
      return {name:nm,x:x,y:x.map(v=>Math.round(ints[i]+slopes[i]*v+R.normal(0,5.2)))};});
    st=slopesTest(G);anc=ancova(G);
    const rawSpread=Math.max(...anc.raw)-Math.min(...anc.raw),adjSpread=Math.max(...anc.adj)-Math.min(...anc.adj);
    if(level?(st.p<.02):(st.p>.25&&anc.pG<.001&&anc.adj[0]<anc.adj[1]-2.5&&anc.adj[1]<anc.adj[2]-2.5
        &&adjSpread>rawSpread+2.5&&mean(G[0].x)>mean(G[2].x)+3))break;}
  const slopeTbl=tbl("Tests of Between-Subjects Effects","Homogeneity of regression slopes check. Outcome: fatigue score at 12 weeks",
    ["Source","Sum of Squares","df","Mean Square","F","Sig."],
    [["Program",pk(fx(anc.SSg,2),"prog"),pk(anc.dfG,"dfp"),pk(fx(anc.SSg/anc.dfG,2),"msp"),pk(fx(anc.Fg,3),"fp"),pk(fP(anc.pG),"sigp")],
     ["Baseline fatigue",pk(fx(anc.SScv,2),"cv"),pk(1,"dfc"),pk(fx(anc.SScv,2),"msc"),pk(fx(anc.Fc,3),"fc"),pk(fP(anc.pC),"sigc")],
     ["Program × Baseline fatigue",pk(fx(st.SSint,2),"int"),pk(st.dfI,"dfi"),pk(fx(st.SSint/st.dfI,2),"msi"),pk(fx(st.F,3),"fi"),pk(fP(st.p),"sigi")],
     ["Error",fx(st.SSEsep,2),st.dfE,fx(st.MSE,2),"",""]]);
  const adjTbl=tbl("Estimated Marginal Means",`Fatigue at 12 weeks. Baseline = mean fatigue at enrollment. Adjusted = every program set to a baseline of ${fx(anc.grandX,1)}.`,
    ["Program","Baseline","Unadjusted","Adjusted"],
    names.map((nm,i)=>[nm,fx(mean(G[i].x),1),fx(anc.raw[i],1),fx(anc.adj[i],1)]));
  const best=names[anc.adj.indexOf(Math.min(...anc.adj))];
  const step3=level
    ? {id:"c1s3",label:"Telling Dr. Zhang",type:"reply",channel:"chat",prompt:"Build your reply.",
       hint:"The interaction was significant, so one adjusted effect would hide something important.",
       thread:["So can I report one number for how much each program helps?"],
       slots:[{label:"Your answer",options:[
        {t:"The slopes differ, so a single program effect would be misleading. I'll report how the effect changes with baseline fatigue instead.",tag:"correct"},
        {t:"I'll run the ANCOVA anyway and report one program effect.",tag:"slopes_ignored",fb:`The interaction is significant (${pT(st.p)}). ANCOVA assumes one shared slope, so a single adjusted effect would hide that the programs help different patients differently.`},
        {t:"I'll drop baseline fatigue and compare the raw means.",tag:"no_covariate",fb:"That doesn't fix anything: the programs still work differently depending on where patients started."}]}],
       okFb:"Reporting one number would have buried the most interesting finding in the study."}
    : {id:"c1s3",label:"Reading the adjusted means",type:"reply",channel:"chat",show:adjTbl,
       prompt:"Dr. Zhang wants to know what to tell his patients. Build your reply.",
       hint:`Compare the baseline column with the adjusted column. The adjusted mean is what each program would average if every patient had enrolled at the same fatigue score (${fx(anc.grandX,1)}).`,
       thread:["The programs all started with different patients. So which one should I be referring people to?"],
       slots:[
        {label:"Your answer",options:[

function case2(R,level){ // Dr. Ruiz - the full trial, baseline imbalance, ANCOVA
  const n=level?[38,42]:[40,40],names=["New drug","Placebo"];
  let G,anc,ow;
  for(let k=0;k<600;k++){
    // the PLACEBO arm happens to start lower, which flatters it and hides the drug's effect
    const gap=level?R.uni(5.5,7):R.uni(6,8);
    const base=[152,152-gap];
    G=names.map((nm,i)=>{const x=exactSample(R,n[i],base[i],16).map(v=>Math.round(v));
      const eff=i===0?-9.5:0;
      return {name:nm,x:x,y:x.map(v=>Math.round(38+0.75*v+eff+R.normal(0,10)))};});
    anc=ancova(G);ow=oneway(G.map(g=>g.y));
    const rawDiff=anc.raw[0]-anc.raw[1],adjDiff=anc.adj[0]-anc.adj[1];
    if(ow.p>.12&&anc.pG<.01&&adjDiff<rawDiff-3&&mean(G[1].x)<mean(G[0].x)-2)break;}
  const grp=tbl("Descriptive Statistics","Systolic BP (mmHg)",["Group","N","Baseline mean","Final mean"],
    names.map((nm,i)=>[nm,G[i].y.length,fx(mean(G[i].x),1),fx(anc.raw[i],1)]));
  const anctbl=tbl("Tests of Between-Subjects Effects","Dependent variable: systolic BP at 8 weeks",
    ["Source","Sum of Squares","df","Mean Square","F","Sig."],
    [["Baseline systolic BP",pk(fx(anc.SScv,1),"cv"),pk(1,"dfc"),pk(fx(anc.SScv,1),"msc"),pk(fx(anc.Fc,3),"fc"),pk(fP(anc.pC),"sigc")],
     ["Study arm",pk(fx(anc.SSg,1),"arm"),pk(anc.dfG,"dfa"),pk(fx(anc.SSg/anc.dfG,1),"msa"),pk(fx(anc.Fg,3),"fa"),pk(fP(anc.pG),"siga")],

  return {id:"c2",npc:"ruiz",title:"The full trial reports",

        vars:[["patient_id","Patient ID","ID"],["arm","Study arm (drug or placebo)","categorical",2],["sbp_baseline","Systolic BP at enrollment (mmHg)","numeric"],["sbp_final","Systolic BP at 8 weeks (mmHg)","numeric"],["site","Clinic site (3 sites)","categorical",3]],
        msgs:{no_covariate:"That compares the raw final numbers. The placebo arm started lower by chance, so the comparison is unfair to the drug. Something needs to hold baseline constant.",
              covariate_categorical:"A covariate is numeric. Clinic site is a grouping, which would make this a two-way design and wouldn't fix the baseline imbalance.",
              wrong_covariate:"Clinic site isn't what differs between the arms at the start. Check the baseline means in your notes.",
              extra_factor:"Dr. Ruiz's question is about the study arm. Site isn't part of it."},
        ok:"One factor, one numeric outcome, and baseline as a covariate: ANCOVA."}},
      {id:"c2s2",label:"Seeing what adjustment does",type:"reply",channel:"chat",
       show:`<div class="slider"><p><strong>Try it.</strong> Switch between the raw group averages and the averages adjusted for baseline.</p>
         <div class="seg" role="group" aria-label="Which means to show"><input type="radio" id="ms-raw" name="adjshow" value="raw" checked><label for="ms-raw">Unadjusted means</label><input type="radio" id="ms-adj" name="adjshow" value="adj"><label for="ms-adj">Adjusted for baseline</label></div>
         <div id="mchart" style="margin-top:.5rem"></div>

       init:()=>{const draw=()=>{const v=document.querySelector('input[name="adjshow"]:checked').value;
           document.getElementById("mchart").innerHTML=meansChart(names,anc.raw,anc.adj,v,"Systolic BP at 8 weeks (mmHg)");
           document.getElementById("mdiff").innerHTML=v==="raw"
             ? `Raw difference, drug minus placebo: <strong>${fx(anc.raw[0]-anc.raw[1],1)} mmHg</strong> (one-way ANOVA on the raw numbers: ${pT(ow.p)}).`
             : `Adjusted difference: <strong>${fx(anc.adj[0]-anc.adj[1],1)} mmHg</strong>, once both arms are set to the same starting BP of ${fx(anc.grandX,1)}.`;};
         document.querySelectorAll('input[name="adjshow"]').forEach(e=>e.addEventListener("change",draw));draw();},

        msc:{tag:"output_misread",fb:"A mean square isn't a test result on its own."},

    outro:g=>g("c2s1")==="correct"

function analysisName(b,vars,spec){const f=b.factors,cv=b.covs||[];
  if(!f.length)return cv.length?"No analysis (no factor chosen)":"No analysis (no factor chosen)";
  if(cv.length)return f.length===1?"ANCOVA":"Two-way ANCOVA";
  if(f.length===1){const lv=(vars.find(v=>v[0]===f[0])||[])[3]||3;return b.repeated?"One-way repeated measures ANOVA":lv===2?"Independent-samples t test":"One-way ANOVA";}
  return b.repeated?"Mixed design ANOVA":"Two-way ANOVA";}
function evalBuild(spec,b){
  const type=v=>(spec.vars.find(x=>x[0]===v)||[])[2];
  const cv=b.covs||[];
  if(b.outcomes.length!==1||b.outcomes[0]!==spec.outcome)return "outcome_misread";
  if(spec.mode==="ancova"){
    if(b.factors.some(f=>type(f)==="ID"))return "id_as_factor";
    if(b.factors.some(f=>type(f)==="numeric"))return "numeric_as_factor";
    if(!b.factors.length)return "no_factor";
    if(cv.some(c=>type(c)==="ID"))return "id_as_covariate";
    if(cv.some(c=>type(c)==="categorical"))return "covariate_categorical";
    if(!cv.length)return "no_covariate";
    if(cv.length!==spec.covs.length||!spec.covs.every(c=>cv.includes(c)))return "wrong_covariate";
    if(b.factors.length!==spec.factors.length||!spec.factors.every(f=>b.factors.includes(f)))return "extra_factor";
    return "correct";}
  if(cv.length)return "covariate_categorical";
  if(b.factors.some(f=>type(f)==="ID"))return "id_as_factor";
  if(b.factors.some(f=>type(f)==="numeric"))return "numeric_as_factor";
  if(!b.factors.length)return "no_factor";
  if(b.repeated===null)return "no_design";
  if(b.repeated!==spec.repeated)return spec.repeated?"ignore_dependence":"false_repeated";
  const want=spec.factors,have=b.factors;
  if(have.length<want.length&&have.every(f=>want.includes(f)))return "lose_factor_structure";
  if(have.length!==want.length||!want.every(f=>have.includes(f)))return "extra_factor";
  return "correct";}

function bfs(targets){

  while(q.length){const [x,y]=q.shift();if(targets.some(t=>t[0]===x&&t[1]===y)){const path=[];let k=key(x,y);while(prev[k]){path.unshift(k.split(",").map(Number));k=prev[k];}return path;}
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy,k=key(nx,ny);if(!(k in prev)&&free(nx,ny)){prev[k]=key(x,y);q.push([nx,ny]);}});}

}

  }
  if(st.type==="cards"){
    box.querySelector(".opts").outerHTML=`${st.claim?`<div class="bubble claim">${st.claim}</div>`:""}<div class="cards" role="group" aria-label="Evidence cards">${st.cards.map((c,k)=>`<button class="ecard" data-k="${k}"><span class="etag">${c.k||"Evidence"}</span>${c.t}</button>`).join("")}</div>`;
    lockAll=()=>box.querySelectorAll(".ecard").forEach(b=>b.setAttribute("aria-disabled","true"));
    box.querySelectorAll(".ecard").forEach(b=>b.onclick=()=>choose(b,st.cards[+b.dataset.k],"You lay your evidence card on the table…"));
  }
  if(st.type==="point"){
    lockAll=()=>box.querySelectorAll("[data-pick]").forEach(b=>b.setAttribute("aria-disabled","true"));
    box.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const it=st.picks[b.dataset.pick];if(it)choose(b,it,`You point it out to ${firstName(who)}…`);});
  }

  if(st.type==="reply"||st.type==="interview"){
    const bub=(you,t)=>`<div class="msg ${you?"you":"them"}"><span class="msg-who">${you?"You":firstName(who)}</span>${t}</div>`;
    box.querySelector(".opts").outerHTML=`<div class="thread ${st.channel||"chat"}">${st.channel==="email"?`<div class="mailhead"><span><strong>From:</strong> ${who.name}</span><span><strong>Subject:</strong> ${st.subject||""}</span></div>`:""}<div class="msgs" id="msgs" aria-live="polite">${(st.thread||[]).map(m=>bub(false,m)).join("")}</div>${st.type==="interview"?`<div class="asks"><span class="slotlab" style="width:100%">Ask ${firstName(who)}:</span>${st.questions.map((q,k)=>`<button class="ask" data-k="${k}">${q.q}</button>`).join("")}</div>`:""}<div id="composeHost"></div></div>`;
    const msgs=document.getElementById("msgs"),addMsg=(you,t)=>msgs.insertAdjacentHTML("beforeend",bub(you,t));
    const doCompose=()=>{
      const host=document.getElementById("composeHost"),sel=st.slots.map(()=>null);
      host.innerHTML=`<div class="compose"><span class="slotlab">Build your ${st.channel==="email"?"email":"reply"} from the pieces</span>${st.slots.map((sl,si)=>`<div class="slotrow"><span class="slotlab">${sl.label}</span><div class="tiles">${sl.options.map((o,oi)=>[Math.random(),oi]).sort((x,y)=>x[0]-y[0]).map(([_,oi])=>`<button class="tile" aria-pressed="false" data-s="${si}" data-o="${oi}">${sl.options[oi].t}</button>`).join("")}</div></div>`).join("")}<div class="draftmsg" id="draftmsg">…</div><button class="primary" id="sendBtn">${st.channel==="email"?"Send email":"Send"}</button></div>`;
      const txt=()=>sel.map((x,si)=>x===null?"…":st.slots[si].options[x].t).join(" ");
      host.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(done||busy)return;const si=+b.dataset.s;sel[si]=+b.dataset.o;host.querySelectorAll(`.tile[data-s="${si}"]`).forEach(t=>t.setAttribute("aria-pressed",t===b?"true":"false"));document.getElementById("draftmsg").textContent=txt();});
      document.getElementById("sendBtn").onclick=()=>{
        if(done||busy)return;if(sel.some(x=>x===null)){fb.innerHTML=`<p class="where">Pick a piece from each row first.</p>`;return;}
        addMsg(true,txt());const bad=sel.map((x,si)=>st.slots[si].options[x]).find(o=>o.tag!=="correct"),tag=bad?bad.tag:"correct";
        if(rec.first===null){rec.first=tag;rec.hintBefore=hintUsed;}
        if(!bad){host.querySelectorAll("button").forEach(b=>b.disabled=true);box.querySelectorAll(".ask").forEach(b=>b.disabled=true);if(st.reveal){const vs=document.getElementById("vizSlot");if(vs)vs.innerHTML=unit.viz||"";}okFinish(wrapP(st.okFb));}
        else badFinish(null,`${firstName(who)} is typing…`,bad.fb);};
    };
    if(st.type==="reply")doCompose();
    else{let opened=false;box.querySelectorAll(".ask").forEach(b=>b.onclick=()=>{if(done||busy||b.disabled)return;const q=st.questions[+b.dataset.k];b.disabled=true;addMsg(true,q.q);addMsg(false,q.a);if(!q.key)cred(-1);if(q.key&&!opened){opened=true;doCompose();}});}
  }
  if(st.type==="tiles"){
    const sel=st.slots.map(()=>null);
    box.querySelector(".opts").outerHTML=`${st.slots.map((sl,si)=>`<fieldset><legend>${sl.label}</legend><div class="tiles">${sl.options.map((o,oi)=>[Math.random(),oi]).sort((x,y)=>x[0]-y[0]).map(([_,oi])=>`<button class="tile" aria-pressed="false" data-s="${si}" data-o="${oi}">${sl.options[oi].t}</button>`).join("")}</div></fieldset>`).join("")}<p class="headline" id="hl" aria-live="polite">Pick one tile from each row to build the headline.</p><button class="quiet" id="present">Present the headline</button>`;
    const upd=()=>{document.getElementById("hl").textContent=sel.map((x,si)=>x===null?"…":st.slots[si].options[x].t).join(" ")+(sel.every(x=>x!==null)?".":"");};
    box.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(done||busy)return;const si=+b.dataset.s;sel[si]=+b.dataset.o;box.querySelectorAll(`.tile[data-s="${si}"]`).forEach(t=>t.setAttribute("aria-pressed",t===b?"true":"false"));upd();});
    document.getElementById("present").onclick=()=>{
      if(done||busy)return;if(sel.some(x=>x===null)){fb.innerHTML=`<p class="where">Pick a tile from each row first.</p>`;return;}
      const bad=sel.map((x,si)=>st.slots[si].options[x]).find(o=>o.tag!=="correct"),tag=bad?bad.tag:"correct";
      if(rec.first===null){rec.first=tag;rec.hintBefore=hintUsed;}
      if(!bad){box.querySelectorAll(".tile,#present").forEach(e=>e.disabled=true);okFinish(wrapP(st.okFb));}
      else badFinish(null,`You present the headline to ${firstName(who)}…`,bad.fb);};
  }
}
function showOutro(unit,kind,lvl){
  const g=id=>valueOf(S.results[id]).replace("correct_hint","correct"),oc=unit.outro(g),box=document.getElementById("steps");
  box.innerHTML=`<div class="outro"><div class="status ${oc.ok?"":"mixed"}"><span class="status-icon" aria-hidden="true">${oc.ok?"✓":"↺"}</span><div><p class="status-title">${oc.title}</p><p>${oc.text}</p></div></div>
    <p class="takeaway"><strong>Takeaway:</strong> ${unit.takeaway}</p><div class="actions"><button class="primary" id="cont">${kind==="finale"?"File the report and see my results":"Back to the hallway"}</button></div></div>`;
  const h=box.querySelector(".status-title");box.querySelector(".outro").scrollIntoView({behavior:"smooth",block:"start"});
  document.getElementById("cont").onclick=()=>{if(kind==="finale"){S.finaleDone=true;S.phase="done";applySeason();save();gcount("finished","Episode 6 finished");renderSummary();}else unitDone(unit,kind,lvl);};document.getElementById("cont").focus({preventScroll:true});
}
function unitDone(unit,kind,lvl){
  let msg="";
  if(kind==="core"){const idx=+unit.id.slice(1)-1;S.done.push(idx);S.path[idx]=lvl;
    const ids=unit.steps.map(s=>s.id),misses=ids.filter(id=>!S.results[id]||S.results[id].first!=="correct"),hinted=ids.filter(id=>S.results[id]&&S.results[id].hintBefore);
    if(misses.length===0&&hinted.length===0)S.level=1;else if(misses.length>=2)S.level=0;
    if(S.fuDone.length<1)for(const id of misses){const fu=FU_MAP[S.results[id]&&S.results[id].first];if(fu&&!S.fuDone.includes(fu)){S.pendingFU=fu;break;}}
    msg=`Sign-off collected (${S.done.length} of 4).`+(S.done.length===4?" Take the report to Dr. Brooks in the Quality Office.":"");
    if(S.done.length===4&&!S.pendingFU&&WEEK.hidden&&!S.hiddenUnlocked&&CORE.every((c,ci)=>c(coreRng(ci),S.path[ci]).steps.every(st=>S.results[st.id]&&S.results[st.id].first==="correct"))){S.hiddenUnlocked=true;msg+=` ★ Jordan texts: "You didn't need me once this week. Come to Statistics. There's something strange in the data."`;}
  }else if(kind==="hidden"){S.hiddenDone=true;msg="★ Hidden problem solved. Jordan is impressed.";
  }else if(kind==="fu"){S.fuDone.push(unit.id);S.pendingFU=null;msg="Jordan's done with you. Back to the consults.";}
  else{S.expDone.push(unit.id);msg="Nice work on the optional consult.";}
  save();renderMap();if(!S.pendingFU)toast(msg);
}
function finalReport(){
  if(WEEK.finale&&!S.finaleDone){const b=NPCS.find(q=>q.id==="brooks");return startUnit(WEEK.finale(S),"finale",null,b);}
  mapActive=false;const p=NPCS.find(q=>q.id==="brooks");
  app.innerHTML=`<div class="talk-head">${portrait(p)}<div><p class="where">${p.room}</p><h1 tabindex="-1">Filing the quality report</h1><p class="who">${p.name}, ${p.role}</p></div></div>
    <div class="bubble"><p>${WEEK.ending({...SEASON.flags,...WEEK.keyFlags(S).flags})}</p></div>
    <div class="actions"><button class="primary" id="file">File the report and see my results</button><button class="quiet" id="back">Not yet, back to the floor</button></div>`;
  app.querySelector("h1").focus();
  document.getElementById("file").onclick=()=>{S.phase="done";applySeason();save();renderSummary();};
  document.getElementById("back").onclick=()=>renderMap();
}
function buildPayload(){
  const parts=[`Mission ${CONFIG.mission}`,`version ${CONFIG.version}`,`save ${MODE==="season"?"on":"off"}`,`case levels ${[0,1,2,3].map(i=>S.path[i]??"-").join("")}`,`credibility ${S.cred}`,`hints ${S.hints}`,`minutes ${Math.round((Date.now()-S.started)/60000)}`];
  const add=(u,name)=>u.steps.forEach(st=>{const v=valueOf(S.results[st.id]);if(v)parts.push(`${name}, ${st.label}: ${v}`);});
  CORE.forEach((c,i)=>{if(S.done.includes(i)){const u=c(coreRng(i),S.path[i]);add(u,`Case ${i+1} (${u.title})`);}});
  if(WEEK.finale&&S.finaleDone){const u=WEEK.finale(S);add(u,u.title);}
  if(S.hiddenDone&&WEEK.hidden){const u=WEEK.hidden();add(u,"Hidden problem ("+u.title+")");}
  S.fuDone.forEach(id=>{const u=FOLLOWUPS[id]();add(u,u.title);});
  if(S.expDone.length)add(expertCase(),"Optional (Two outcomes, three programs)");
  return {results:parts.join(" | ").replace(/α/g,"alpha").replace(/μ/g,"mu")};
}
function renderSummary(){
  mapActive=false;setBar("Results");
  const units=CORE.map((c,i)=>c(coreRng(i),S.path[i]||0)),coreSteps=units.flatMap(u=>u.steps);
  const first=coreSteps.filter(s=>S.results[s.id]&&S.results[s.id].first==="correct").length;
  const status=id=>{const v=valueOf(S.results[id]);return v==="correct"?`<span class="st ok">First try</span>`:v==="correct_hint"?`<span class="st ok">First try, with a hint</span>`:`<span class="st retry">Took another try</span>`;};
  const payload=buildPayload(),configured=!!CONFIG.qualtricsUrl;
  const codeBox=MODE==="season"?`<div class="submit-box" style="margin:1rem 0"><h2>Your career code</h2><p>Your season is saved on this browser. To continue on another device, keep this code somewhere safe:</p><p><code id="ccode" style="font-size:1.15rem">${encodeCareer(SEASON)}</code> <button class="quiet" id="copyc">Copy</button></p></div>`
    :`<div class="submit-box" style="margin:1rem 0"><h2>Played without saving</h2><p>Nothing was saved on this device.</p><p id="ccWrap"><button class="linkish" id="showc">Get a career code anyway</button></p></div>`;
  app.innerHTML=`<p class="where">Report filed</p><h1 tabindex="-1">${title()}</h1>
    <div class="stats"><div class="stat"><b>${first} of ${coreSteps.length}</b><span>right on the first try</span></div><div class="stat"><b>${S.cred}</b><span>reputation</span></div><div class="stat"><b>${S.hints}</b><span>hints</span></div></div>${S.hiddenDone?`<p class="takeaway">★ You solved this week's hidden problem.</p>`:""}
    <div class="submit-box">${configured?`<h2>Submit your results</h2><p>You'll go to a short anonymous survey. Your game results go along automatically, without your name. <strong>Click the arrow at the bottom of the survey to finish.</strong></p><div class="actions"><button class="primary" id="submit">Submit my results</button></div>`:`<h2>Instructor preview</h2><p>No survey connected.</p>`}</div>
    <div class="bubble"><p><strong>Next week:</strong> ${WEEK.teaser}</p></div>${codeBox}<ul class="review">${units.flatMap(u=>u.steps.map(s=>`<li><span>${u.title}: ${s.label}</span>${status(s.id)}</li>`)).join("")}</ul>
    ${(!configured||PREVIEW)?`<h2>What gets sent</h2><p style="font-size:.9rem;overflow-wrap:anywhere">${payload.results}</p>`:""}
    <div class="actions"><button class="linkish" id="restart">Play again from the start</button></div>`;
  window.scrollTo(0,0);app.querySelector("h1").focus({preventScroll:true});
  const cp=document.getElementById("copyc");if(cp)cp.onclick=()=>{const t=document.getElementById("ccode").textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{cp.textContent="Copied";},()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("ccode"));getSelection().removeAllRanges();getSelection().addRange(r);cp.textContent="Selected: press Ctrl+C";});};
  const shc=document.getElementById("showc");if(shc)shc.onclick=()=>{document.getElementById("ccWrap").innerHTML=`<code style="font-size:1.15rem">${encodeCareer(SEASON)}</code><br><span class="where">Enter it at the start of next week's game to keep your story.</span>`;};
  const sb=document.getElementById("submit");if(sb)sb.onclick=()=>{const u=new URL(CONFIG.qualtricsUrl);u.searchParams.set("results",payload.results);location.href=u.toString();};
  document.getElementById("restart").onclick=()=>{if(!confirm("Start over? Your results on this device will be erased."))return;clearSaved();S=null;renderIntro();};
}
renderIntro();
}
</script>
