.bubble::before{content:"";position:absolute;top:-9px;left:28px;width:16px;height:16px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.slider{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.6rem .9rem;margin:.5rem 0}
.slider input{width:100%}
.swatches{display:flex;gap:.8rem;margin:.4rem 0 1rem}
.swatches label{display:flex;flex-direction:column;align-items:center;gap:.3rem;cursor:pointer;font-size:.85rem}
.swatch{width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid transparent}
.swatches input{position:absolute;opacity:0}
.swatches input:checked+.swatch{border-color:var(--ink)}
.swatches input:focus-visible+.swatch{outline:3px solid #E0A526}
 .m-clue{fill:#FFFFFF;stroke:#34474F;stroke-width:2}.m-clue-l{stroke:#34474F;stroke-width:2}
.build{width:100%;border-collapse:collapse;margin:.4rem 0 .8rem;font-size:.92rem}
.build th,.build td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);white-space:normal}
.build code{font-weight:700}
.build select{font:inherit;padding:.3rem;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink)}
.typ{font-size:.75rem;font-weight:700;padding:.1rem .4rem;border-radius:4px;background:var(--teal-wash);color:var(--teal-deep);white-space:nowrap}
.notes{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .9rem;margin:0 0 1rem}
.notes summary{font-weight:700;cursor:pointer}
.note{border-top:1px solid var(--line);padding-top:.5rem;margin-top:.5rem}

.hand{font-family:"Patrick Hand","Segoe Print","Bradley Hand",cursive}
.art{position:relative;margin:.9rem 0}
.art p{margin:.3rem 0}
.art svg{display:block;width:100%;height:auto;max-width:34rem;margin:.3rem 0}
/* sticky note: paper stays yellow in dark mode, like a real one */
.art-sticky{background:#FFF1A6;color:#2A2410;max-width:21rem;padding:.9rem .95rem .6rem;transform:rotate(var(--tilt,-1.5deg));box-shadow:0 4px 10px rgba(0,0,0,.2);border-radius:2px}
.art-sticky p{font-size:1.18rem;line-height:1.32}
.art-sticky .sig{text-align:right;font-size:.95rem}
.art-sticky::before{content:"";position:absolute;top:-8px;left:50%;width:64px;height:17px;margin-left:-32px;background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.08);transform:rotate(3deg)}
/* whiteboard */
.art-wb{background:#FDFEFE;color:#1D3F95;border:9px solid #B7BEC5;border-radius:6px;padding:.7rem .95rem;box-shadow:0 3px 8px rgba(0,0,0,.14)}
.art-wb .mk,.art-wb h3{font-family:"Patrick Hand","Marker Felt","Chalkboard SE",cursive}
.art-wb h3{font-size:1.45rem;font-weight:400;margin:0 0 .2rem;color:#1D3F95}
.art-wb .mk{font-size:1.2rem}
.mk-red{color:#B0261E}.mk-green{color:#1B6B39}
/* printed memo or email */
.art-memo{background:#FFFFFF;color:#222;border:1px solid #D5D5D5;box-shadow:3px 4px 0 #E4DFD3;padding:.8rem 1rem;max-width:36rem;overflow:hidden}
.memo-head{display:grid;grid-template-columns:auto 1fr;gap:.05rem .6rem;font-size:.85rem;border-bottom:1px solid #DDD;padding-bottom:.45rem;margin:0 0 .5rem}
.memo-head dt{font-weight:700;color:#555}.memo-head dd{margin:0}
.art-memo.coffee::after{content:"";position:absolute;right:-34px;bottom:-40px;width:92px;height:92px;border-radius:50%;border:7px solid rgba(120,72,30,.16);pointer-events:none}
/* poster or notice pinned to a board */
.art-flyer{background:#FFFDF5;color:#1F2A2E;border:1px solid #E2DCCB;padding:1.05rem 1rem .8rem;box-shadow:0 3px 8px rgba(0,0,0,.13);max-width:32rem}
.art-flyer::before{content:"";position:absolute;top:7px;left:50%;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:#C0392B;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.flyer-title{font-family:var(--serif);font-size:1.3rem;font-weight:700;color:#0C474C;margin:.2rem 0 .1rem}
.flyer-sub{font-size:.85rem;color:#4A5A60;margin:0 0 .4rem}
/* a peek at the data file: a screen, so it follows the theme */
.art-sheet{border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--card);max-width:36rem}
.sheet-bar{display:flex;justify-content:space-between;gap:.4rem;flex-wrap:wrap;background:#1B6B45;color:#FFFFFF;padding:.3rem .6rem;font-size:.82rem;font-family:var(--sans);margin:0}
.sheet-file{font-weight:700}
.art-sheet table{font-family:var(--sans);font-size:.84rem;border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums;margin:0}
.art-sheet table th,.art-sheet table td{border:1px solid var(--line);padding:.22rem .45rem;text-align:left;white-space:nowrap}
@media (max-width:520px){.art-sheet table{font-size:.74rem}.art-sheet table th,.art-sheet table td{padding:.2rem .3rem}.art-sheet .rn{width:1.2rem}}
.art-sheet thead th{background:var(--paper);min-width:0;border-bottom:1px solid var(--line-strong);vertical-align:bottom;white-space:normal}
.art-sheet .rn{background:var(--paper);color:var(--muted);font-weight:400;text-align:center;width:1.8rem}
.art-sheet tr.more td{color:var(--muted);font-style:italic}
.toast .art-sheet table{min-width:100%}
.sheet-key{font-size:.92rem;color:var(--ink);padding:.3rem .6rem;margin:0;border-top:1px solid var(--line)}
.clue-row{display:flex;gap:.35rem;flex-wrap:wrap;margin:.25rem 0 .2rem .6rem}
.dir .clue-btn{width:auto;font-size:.82rem;padding:.25rem .55rem}
.toast table{font-size:.82rem;min-width:0}
.notes td,.toast td,.notes th,.toast th{text-align:left;white-space:normal}.notes figcaption:empty,.toast figcaption:empty{display:none}
.side{display:grid;grid-template-columns:1fr;gap:.2rem}
@media (max-width:620px){.side{grid-template-columns:1fr}}

/* weeks 1-3: SPSS crosstabs and footnotes, the dashboard screen, paired figures, stacked design choices */
.out-foot{font-family:Arial,Helvetica,sans-serif;font-size:.9rem;color:var(--ink);margin:.45rem 0 0;max-width:none}
.xt tbody tr.grp>*{border-top:2px solid var(--line-strong)}
.xt th[scope="rowgroup"]{text-align:left;vertical-align:top}
.xt tbody th.stat{font-weight:400;color:var(--muted);text-align:left;white-space:normal;min-width:5.5rem;max-width:8rem;line-height:1.25}
@media (max-width:520px){.xt th[scope="rowgroup"]{white-space:normal;min-width:3.2rem}}
.xt thead th[scope="colgroup"]{text-align:center;border-bottom:1px solid var(--line)}
.art-dash{background:#17212B;color:#E6EDF3;border-radius:10px;padding:.6rem .7rem .7rem;max-width:36rem;box-shadow:0 3px 8px rgba(0,0,0,.18);font-family:Arial,Helvetica,sans-serif}
.art-dash .dash-bar{font-size:.72rem;letter-spacing:.08em;color:#9FB0BF;margin:0 0 .45rem}
.art-dash .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.5rem}
.art-dash .dash-tile{background:#243240;border-radius:8px;padding:.5rem .6rem;border:2px solid transparent}
.art-dash .dash-tile.warn{border-color:#E8A33D}

function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,tmp=x+5.5;tmp-=(x+0.5)*Math.log(tmp);let ser=1.000000000190015;for(let j=0;j<6;j++){y+=1;ser+=c[j]/y;}return -tmp+Math.log(2.5066282746310005*ser/x);}
function betacf(a,b,x){const MAXIT=300,EPS=3e-12,FPMIN=1e-300;const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;}return h;}
function betai(a,b,x){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
function tcdf(t,df){const x=df/(df+t*t);const tail=0.5*betai(df/2,0.5,x);return t>=0?1-tail:tail;}
function tinv(p,df){let lo=-80,hi=80;for(let i=0;i<200;i++){const m=(lo+hi)/2;if(tcdf(m,df)<p)lo=m;else hi=m;}return (lo+hi)/2;}
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
function ncdf(z){return 0.5*(1+erf(z/Math.SQRT2));}
function zinv(p){let lo=-10,hi=10;for(let i=0;i<100;i++){const m=(lo+hi)/2;if(ncdf(m)<p)lo=m;else hi=m;}return (lo+hi)/2;}

function welchDf(s1,n1,s2,n2){const a=s1*s1/n1,b=s2*s2/n2;return (a+b)*(a+b)/(a*a/(n1-1)+b*b/(n2-1));}

function makeRng(seed){let a=seed>>>0;const next=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

function mensahData_(level){const R=makeRng((SEED()^0xB101^(level?5:0))>>>0);let a1c,edu,age,y,m;GEN_OK=0;
  for(let k=0;k<400;k++){const n=level?R.int(340,380):R.int(280,320);a1c=[];edu=[];age=[];y=[];
    for(let i=0;i<n;i++){const a=round1(Math.max(6.8,Math.min(13.5,R.normal(9.2,1.4)))),e=R.u()<.45?1:0,g=R.int(32,80);
      a1c.push(a);edu.push(e);age.push(g);y.push(R.u()<expit(-0.65-0.55*(a-9.2)+(level?0.45:0.85)*e+0.012*(g-58))?1:0);}
    m=logit(y,[a1c,edu,age]);
    const okA=m.pv[1]<.001&&m.eb[1]>.5&&m.eb[1]<.72,okE=level?(m.eb[2]>1.2&&m.eb[2]<2.2&&m.lo[2]<1&&m.pv[2]>.06):(m.eb[2]>1.7&&m.eb[2]<3.2&&m.lo[2]>1.05),pc=mean(y);
    if(okA&&okE&&pc>.3&&pc<.5&&m.eb[3]>.98&&m.eb[3]<1.05){GEN_OK=1;break;}}if(!GEN_OK)GEN_MISS.push("w11 mensah");
  return {a1c,edu,age,y,m,n:y.length,names:["HbA1c at first visit (%)","Education class (1 = took it)","Age (years)"]};}
function danaData11_(level){const R=makeRng((SEED()^0xB102^(level?7:0))>>>0),N=SEASON.danaN||100,A=SEASON.danaA||.05,big=N>=100;let g,age,amb,y,m,pU,pA;GEN_OK=0;
  for(let k=0;k<600;k++){g=[];age=[];amb=[];y=[];
    for(let i=0;i<2*N;i++){const a=i<N?1:0,ag=Math.round(Math.max(20,Math.min(95,R.normal(62,15)))),b=R.u()<.45?1:0;
      g.push(a);age.push(ag);amb.push(b);y.push(R.u()<expit(-0.05+(level?0.6:0.75)*a-0.08*(ag-62)/10+0.3*b)?1:0);}
    m=logit(y,[g,age,amb]);const yU=y.filter((_,i)=>!g[i]),yA=y.filter((_,i)=>g[i]);pU=Math.round(100*mean(yU));pA=Math.round(100*mean(yA));
    const sigOK=big?m.pv[1]<Math.min(A,level?.05:.02):m.pv[1]>=Math.max(A,.06);
    const qA=mean(yA),qU=mean(yU),crude=(qA/(1-qA))/(qU/(1-qU));
    if(sigOK&&m.eb[1]>1.6&&m.eb[1]<2.9&&Math.abs(m.eb[1]/crude-1)<.08&&pU>=40&&pU<=58&&pA-pU>=12&&pA-pU<=25&&m.eb[1]>1.2*pA/pU){GEN_OK=1;break;}}if(!GEN_OK)GEN_MISS.push("w11 dana");
  const nA=N,nU=N,yA=y.filter((_,i)=>g[i]).reduce((s,v)=>s+v,0),yU=y.filter((_,i)=>!g[i]).reduce((s,v)=>s+v,0);
  return {g,age,amb,y,m,N,A,sig:m.pv[1]<A,pU,pA,rr:pA/pU,T:[[yA,nA-yA],[yU,nU-yU]],names:["New alert (1 = alert)","Age (years)","Arrived by ambulance (1 = yes)"]};}
function rocData11_(level){const R=makeRng((SEED()^0xB103^(level?3:0))>>>0);let y,s,r;GEN_OK=0;
  for(let k=0;k<300;k++){const n=R.int(760,840);y=[];s=[];
    for(let i=0;i<n;i++){const d=R.u()<(level?.06:.08)?1:0;y.push(d);s.push(Math.round(1000*expit(d?R.normal(level?-1.2:-0.9,1.1):R.normal(-2.9,1.1)))/1000);}
    r=roc(y,s);if(r.auc>(level?.76:.83)&&r.auc<(level?.83:.9)){GEN_OK=1;break;}}if(!GEN_OK)GEN_MISS.push("w11 roc");
  return {y,s,r,n:y.length,cases:y.reduce((a,v)=>a+v,0)};}
function marcusData11_(level){const R=makeRng((SEED()^0xB104^(level?9:0))>>>0);let berg,age,y,m,c;GEN_OK=0;
  for(let k=0;k<2000;k++){const n=level?R.int(430,470):R.int(380,420);berg=[];age=[];y=[];
    for(let i=0;i<n;i++){const b=R.int(20,56),a=R.int(60,92);berg.push(b);age.push(a);y.push(R.u()<expit((level?-2.9:-2.85)-(level?0.11:0.1)*(b-42)+0.9*(a-75)/10)?1:0);}
    m=logit(y,[berg,age]);c=classify(y,m.mu,.5);const base=1-mean(y);
    if(c.acc>.84&&c.acc<.9&&c.sens>.05&&c.sens<.33&&base>.83&&base<.89&&c.acc-base>=.01&&c.acc-base<.04&&Math.round(100*c.acc)>Math.round(100*base)&&m.pv[1]<.01){GEN_OK=1;break;}}if(!GEN_OK)GEN_MISS.push("w11 marcus");
  return {berg,age,y,m,c,base:1-mean(y),n:y.length,falls:y.reduce((a,v)=>a+v,0)};}
function gregData11_(level){const R=makeRng((SEED()^0xB105^(level?13:0))>>>0);let x,y,lp,m,top;GEN_OK=0;const W=[30,22,15,10,8,6,4,2.5,1.5,1];
  for(let k=0;k<600;k++){const n=R.int(330,370);x=[];y=[];
    for(let i=0;i<n;i++){let u=R.u()*W.reduce((a,b)=>a+b,0),v=0;while(u>W[v]){u-=W[v];v++;}x.push(v);y.push(R.u()<expit(-3.0+(level?0.75:0.8)*v)?1:0);}
    lp=ols(y,[x]);m=logit(y,[x]);top=Math.max(...x);const p0=lp.b[0],pT=lp.b[0]+lp.b[1]*top;
    if(top>=8&&pT>1.03&&p0<-0.005&&m.pv[1]<.001){GEN_OK=1;break;}}if(!GEN_OK)GEN_MISS.push("w11 greg");
  const pr=v=>lp.b[0]+lp.b[1]*v,obs=v=>{const s=y.filter((_,i)=>x[i]===v);return s.length?mean(s):null;};
  return {x,y,lp,m,top,pr,obs,lo:Math.round(100*pr(0)),hi:Math.round(100*pr(top))};}

      {id:"c2s3",label:"Fewer false alarms",type:"reply",channel:"email",subject:"Re: can we cut the false alarms?",narr:`Dana's phone buzzes: the board chair. "They want fewer false alarms," she says. "The alert gives every patient a risk score, and it fires above a cutoff. Last month: ${RC.n} patients, ${RC.cases} with sepsis."`,
       show:`<div class="slider"><p><strong>Try it.</strong> The alert fires when a patient's risk score is at or above the cutoff. Move the cutoff and watch what it catches and what it costs.</p><label for="ct">Cutoff: <strong id="ctlab"></strong></label><input type="range" id="ct" min="0.02" max="0.6" step="0.01" value="0.10"><div id="ctk"></div><div id="ctviz"></div></div>`,
       init:()=>{const sl=document.getElementById("ct"),draw=()=>{const c=+sl.value,k=classify(RC.y,RC.s,c);document.getElementById("ctlab").textContent=fx(c,2);

           document.getElementById("ctviz").innerHTML=rocPlot(RC.r,{mark:{fpr:1-k.spec,tpr:k.sens},label:`ROC curve of the alert's risk score, AUC ${f3(RC.r.auc)}. At a cutoff of ${fx(c,2)}, sensitivity is ${fx(100*k.sens,0)}% and the false positive rate is ${fx(100*(1-k.spec),0)}%.`,cap:"The ringed point is the current cutoff. Moving the cutoff moves the point along the curve; the curve itself doesn't change."});};

        {label:"The AUC",options:[{t:`and the AUC, ${f3(RC.r.auc)}, belongs to the whole curve: the board must choose which misses it can accept.`,tag:"correct"},{t:"so choose the cutoff with the highest AUC, since a higher AUC means fewer misses and fewer false alarms.",tag:"roc_auc",fb:"Every cutoff has the same AUC: it belongs to the curve, not to a point on it."}]}],
       okFb:"A cutoff trades sensitivity against specificity. The ROC curve shows every possible trade, and the AUC summarizes the whole curve: 0.5 is a coin flip, 1.0 is perfect."}],

function case3(R,level){ // Marcus: an accurate model that catches almost no one (base rate, sensitivity)
  const M=marcusData11(level),c=M.c;
  const ct=classTable(c,{no:"No fall",yes:"Fell",cut:.5,pick:k=>["tn","fp","fn","tp","spec","sens","acc"].includes(k)});
  const base=fx(100*M.base,0),acc=fx(100*c.acc,0),sens=fx(100*c.sens,0);
  return {id:"c3",npc:"marcus",title:`${acc}% accurate`,
    scene:"Marcus has printed his model's accuracy in a very large font and taped it to the parallel bars.",
    message:`<p>I built a model that predicts which patients fall within 90 days of discharge, from their balance score and age. ${M.n} patients. It's ${acc}% accurate! Insurance is going to love this. Can we start using it to decide who gets fall screening?</p>`,
    viz:"",
    steps:[
      {id:"c3s1",label:"The patients who fell",type:"point",narr:"Marcus points at the bottom of the table with pride. \"There. Overall percentage.\"",show:ct,
       prompt:"Before anything else: of the patients who actually fell, what share did Marcus's model catch? Click it.",
       hint:["Find the row for patients who actually fell, and the column that says how many of them the model got right.",`The percentage correct on the "Fell (actually)" row is the sensitivity: ${sens}%.`],
       picks:{sens:{tag:"correct",fb:`${sens}%: of the ${M.falls} patients who fell, the model flagged only ${c.tp}. That's the sensitivity.`},
        acc:{tag:"acc_vs_sens",fb:"That's overall accuracy, and most of it was earned on patients who didn't fall."},
        spec:{tag:"acc_vs_sens",fb:"That's the share of non-fallers the model got right: the specificity."},
        tp:{tag:"count_not_pct",fb:"That's a count: the fallers the model caught. The question asks for a share."},fn:{tag:"count_not_pct",fb:"That's a count: the fallers the model missed."},
        tn:{tag:"count_not_pct",fb:"That's a count of non-fallers predicted correctly."},fp:{tag:"count_not_pct",fb:"That's a count of false alarms."}}},
      {id:"c3s2",label:`About that ${acc}%`,type:"reply",channel:"chat",narr:"Marcus takes the printout off the parallel bars and holds it like a diploma.",
       show:kpis([[acc+"%","overall accuracy"],[base+"%","of patients never fell"],[sens+"%","of fallers caught (sensitivity)"]])+still(ct),
       prompt:"Marcus wants to know if his model is ready. Build your reply.",
       hint:["Compare the accuracy with the share of patients who never fell.",`If the model said "no fall" for everyone, it would be right ${base}% of the time. ${acc}% barely beats that, and it caught only ${sens}% of fallers.`],
       thread:[`${acc}%! That's an A-minus. Ready to roll out?`],
       slots:[
        {label:`The ${acc}%`,options:[{t:`${acc}% sounds strong, but ${base}% never fell, so calling everyone "no fall" would score ${base}%,`,tag:"correct"},{t:`${acc}% means the model caught ${acc}% of the patients who fell and missed only the rest,`,tag:"acc_vs_sens",fb:`That's sensitivity, and it's ${sens}%. Accuracy counts every correct prediction, mostly the many non-fallers.`}]},
        {label:"So",options:[{t:`and it caught only ${sens}% of fallers: judge it by sensitivity, and try a lower cutoff.`,tag:"correct"},{t:"so raise the cutoff from 0.5 to 0.9: it would flag only patients it's sure about and be even more accurate.",tag:"cutoff_dir",fb:"A higher cutoff would call even fewer patients \"will fall\" and catch even fewer fallers."}]}],
       okFb:"When one outcome is common, accuracy can look high while the model misses almost every case. Check the base rate, sensitivity and specificity."}],
    outro:g=>g("c3s2")==="correct"
      ?{ok:true,title:"Marcus's model",text:`<em>Marcus crosses out "${acc}% ACCURATE" and writes "catches ${sens}% of fallers" underneath, smaller.</em> "Less exciting. More honest. I'll lower the cutoff and try again."`}
      :{ok:false,title:"Marcus's model",text:'<em>Marcus takes the sign down and folds it carefully.</em> "Most of my patients never fall. Of course \'nobody falls\' looks accurate."'},
    takeaway:"Accuracy rewards the common outcome. A model can look highly accurate by predicting \"no\" for nearly everyone, so read sensitivity and specificity in the classification table."};
}

function case4(R,level){ // Greg: a straight line through 0s and 1s (linear probability model), then model fit
  const G=gregData11(level),m=G.m;
  const sheet=regT(tbl("Greg's spreadsheet","Linear regression of readmitted (1 = yes, 0 = no) on prior admissions",["Prior admissions in the last year","Patients","Readmitted (actual %)","Greg's predicted chance"],
    [...Array(G.top+1).keys()].map(v=>{const n=G.x.filter(z=>z===v).length,o=G.obs(v);return [v,n,o==null?"–":fx(100*o,0)+"%",(G.pr(v)<0||G.pr(v)>1)?`<strong>${fx(100*G.pr(v),0)}%</strong>`:fx(100*G.pr(v),0)+"%"];})));
  const curve=probPlot(G.x,G.y,{xlo:0,xhi:G.top,ylo:-0.15,yhi:1.15,xlab:"Prior admissions in the last year",ylab:"Chance of readmission",
    fits:[{f:v=>G.pr(v),color:"var(--amber)",dash:true,lab:"straight line",labX:G.top,dy:-8},{f:v=>expit(m.b[0]+m.b[1]*v),color:"var(--teal)",lab:"logistic curve",labX:G.top*0.55,dy:-10}],
    label:`Readmitted (1) or not (0) against prior admissions. The straight line runs from ${G.lo}% to ${G.hi}%, outside 0 to 100%; the logistic S-curve stays inside.`,cap:"Dots are patients (jittered so they don't overlap). The dashed box marks 0% to 100%."});
  const fit=regT(tbl("Model fit","Readmitted within 30 days, binary logistic regression. SPSS prints −2 Log likelihood; AIC = −2 Log likelihood + 2 × the number of parameters, shown here so you don't have to compute it. Smaller AIC means a better balance of fit and simplicity.",["","Intercept only","With prior admissions"],
    [["−2 Log likelihood",pk(fx(m.m2LL0,1),"ll0"),pk(fx(m.m2LL,1),"ll1")],["AIC",pk(fx(m.aic0,1),"aic0"),pk(fx(m.aic,1),"aic1")]]));
  const omni=regT(tbl("Omnibus Tests of Model Coefficients","Does the model with prior admissions fit better than the intercept-only model?",["","Chi-square","df","Sig."],[["Model",pk(fx(m.chi,3),"chi"),1,pk(fP(m.pChi),"op")]]));
  return {id:"c4",npc:"greg",title:"A straight line through yes and no",
    scene:"Greg has a laptop open on a stack of budget binders, and he's looking at it the way you look at a car that's making a new noise.",
    message:`<p>I predicted 30-day readmissions from prior admissions, ${G.x.length} patients. Same regression as my cost model. It works great in the middle. At the edges it says some patients have a ${G.lo}% chance of readmission and others ${G.hi}%. Is that a problem? Be honest. Quickly.</p>`,
    viz:curve,
    steps:[
      {id:"c4s1",label:"Interviewing Greg",type:"interview",reveal:true,show:sheet,prompt:"Ask Greg about his model, then tell him your plan.",
       hint:["Ask Greg what the outcome is and how he got his predictions.","Readmission is yes or no. A straight line through 0s and 1s can predict impossible chances below 0% or above 100%. Binary logistic regression keeps every predicted chance between 0 and 1."],
       thread:["Ask. I've got ten minutes before the next budget meeting."],
       questions:[
        {q:"What exactly is the outcome?",a:"Readmitted within 30 days. One means yes, zero means no. It's in the file as a number, so I treated it as a number.",key:true},
        {q:"How did you get the predictions?",a:"Linear regression, same as my cost model. Draw the best straight line, read off the chance. What could go wrong?",key:true},
        {q:"Who has the most prior admissions?",a:`${G.top}. Mrs. K. She knows the night staff by name.`,key:false},
        {q:"Can the board read odds?",a:"The board can read anything with a dollar sign in front of it.",key:false}],
       slots:[
        {label:"The problem",options:[{t:`Readmission is yes or no, so a line can predict impossible chances, like your ${G.lo}% and ${G.hi}%,`,tag:"correct"},{t:"The line is fine; just round any prediction below 0% up to 0% and anything above 100% down to 100%,",tag:"lpm",fb:"Rounding hides the symptom. A straight line is the wrong shape for a chance."},{t:"Readmission is coded as a number, 0 or 1, so linear regression is the right tool for it,",tag:"lpm",fb:"Coded 0 and 1, it's still yes or no. A straight line through it can leave 0 to 100%."}]},
        {label:"So",options:[{t:"so I'll use binary logistic regression, which keeps predicted chances between 0 and 1.",tag:"correct"},{t:"so I'll use a chi-square test of readmission by prior admissions, which handles yes-or-no outcomes.",tag:"chisq_vs_logit",fb:"Chi-square compares categories. Prior admissions is a number from 0 up; logistic regression handles numerical predictors."}]}],
       okFb:"A yes-or-no outcome needs a model for the chance, bent to stay between 0 and 1: logistic regression. Both lines are shown above."},
      {id:"c4s2",label:"Is it any better?",type:"point",narr:"Greg leans in. \"Fine, the S-curve. But does prior admissions actually help, or did you just draw a prettier line?\"",show:fit+omni,
       prompt:"Click a number that shows adding prior admissions improves the fit by more than chance, even after paying for the extra predictor.",
       hint:["One number in the fit table always drops when you add a predictor. Another charges a price for it, and the omnibus test checks it formally.","Smaller AIC is better, and the omnibus Sig. tests the improvement. Either one answers Greg."],
       picks:{op:{tag:"correct",fb:`The omnibus test: Sig. ${fP(m.pChi)}. Adding prior admissions improves the fit by much more than chance would.`},
        aic1:{tag:"correct",fb:`AIC ${fx(m.aic,1)} with prior admissions against ${fx(m.aic0,1)} without: smaller is better, even after the penalty for the extra predictor.`},
        ll1:{tag:"fit_ll",fb:"−2 Log likelihood always drops when you add a predictor, just as R Square always rises. AIC charges for the extra predictor, and the omnibus test checks the drop."},
        ll0:{tag:"fit_ll",fb:"That's the intercept-only model's −2 Log likelihood. On its own it has no meaning; it only makes sense compared with another model."},
        aic0:{tag:"fit_ll",fb:"That's the intercept-only model's AIC. Compare it with the model's AIC."},
        chi:{tag:"fit_ll",fb:"That's the omnibus chi-square, the drop in −2 Log likelihood. Its Sig. says whether the drop is more than chance."}}}],
    outro:g=>g("c4s1")==="correct"
      ?{ok:true,title:"Greg's new chart",text:`<em>Greg deletes the straight line, then stares at the S-curve for a while.</em> "It bends. Nothing over 100%. The board will like that, even if they don't know why."`}
      :{ok:false,title:"Greg's new chart",text:'<em>Greg writes "0 to 100%" on a sticky note and puts it on his monitor.</em> "Chances can\'t go below zero. I knew that. I just didn\'t know my line didn\'t."'},
    takeaway:"A straight line through 0s and 1s (a linear probability model) can predict chances outside 0 to 100%. Logistic regression bends to stay inside. Compare models with AIC or the omnibus test, not −2 Log likelihood alone."};
}

   <p>Binary logistic regression, also holding age and smoking constant. Reference category: <strong>normal blood pressure</strong>.</p></div>${regT(tbl("Variables in the Equation (blood pressure rows)","Exp(B) is the odds ratio against the reference, normal blood pressure.",["Category","Exp(B)","95% CI lower","95% CI upper"],[["Elevated","1.30","0.80","2.11"],["Stage 1","1.85","1.12","3.05"],["Stage 2","3.10","1.88","5.11"]]))}`;
  return {id:"e1",npc:"ruiz",title:"Against what?",

    steps:[

       hint:"A categorical predictor's odds ratios each compare one category with the reference category.",
       options:[

        {t:"Patients with stage 2 had 3.1 times the odds of a cardiac event of patients with stage 1, holding age and smoking constant",tag:"ref_group",fb:"Each category is compared with the reference, normal blood pressure, not with the category next to it."},
        {t:"Patients with stage 2 had a 3.1% higher chance of a cardiac event, holding age and smoking constant",tag:"or_as_diff",fb:"Exp(B) multiplies the odds. It isn't a percentage-point change in chance."}]},
      {id:"e1s2",label:"Elevated",show:memo,prompt:"Elevated blood pressure: Exp(B) = 1.30, 95% CI 0.80 to 2.11. What can Dr. Ruiz say?",

/* ---------- general helpers (shared by every week) ---------- */
const pk=(v,key)=>`<button class="pick" data-pick="${key}">${v}</button>`;
/* the same output again on a later step, read-only (no clickable cells) */
const still=h=>h.replace(/<button class="pick"[^>]*>([\s\S]*?)<\/button>/g,"$1");
function fSurv(f,d1,d2){return f<=0?1:betai(d2/2,d1/2,d2/(d2+d1*f));}
function vz(w,h,label,inner,cap){return `<figure class="vizfig"><svg class="viz" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${inner}</svg>${cap?`<figcaption class="vizcap">${cap}</figcaption>`:""}</figure>`;}
function sc(d0,d1,r0,r1){return v=>r0+(v-d0)/(d1-d0)*(r1-r0);}
function ticks(lo,hi,k=6){const s0=(hi-lo)/k,m=Math.pow(10,Math.floor(Math.log10(s0)));const st=[1,2,5,10].map(v=>v*m).find(v=>v>=s0);const o=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-9;v+=st)o.push(+v.toFixed(6));return o;}
function axis(x,lo,hi,y,x0,x1){return `<line class="v-axis" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/>`+ticks(lo,hi).map(v=>`<line class="v-axis" x1="${x(v)}" x2="${x(v)}" y1="${y}" y2="${y+5}"/><text x="${x(v)}" y="${y+18}" text-anchor="middle">${v}</text>`).join("");}
function mean(a){return a.reduce((s,v)=>s+v,0)/a.length;}
function sdv(a){const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/(a.length-1));}
function exactSample(R,n,m,s){const x=[];for(let i=0;i<n;i++)x.push(R.normal(0,1));const mu=mean(x),sd=sdv(x);return x.map(v=>m+(v-mu)/sd*s);}
function kpis(c){return `<div class="kpis">${c.map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("")}</div>`;}

function portrait(p,size=64){if(p.video)return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="var(--teal-wash)"/><rect x="9" y="12" width="46" height="31" rx="3" fill="var(--card)" stroke="${p.color}" stroke-width="3"/><circle cx="32" cy="24" r="6.5" fill="${p.color}"/><path d="M21 41c2-7 6-10 11-10s9 3 11 10z" fill="${p.color}"/><rect x="5" y="45" width="54" height="6" rx="2" fill="${p.color}"/></svg>`;return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="var(--teal-wash)"/><circle cx="32" cy="25" r="11" fill="${p.color}"/><path d="M12 58c3-13 11-19 20-19s17 6 20 19z" fill="${p.color}"/><text x="32" y="29" text-anchor="middle" class="m-init">${p.initials}</text></svg>`;}

/* ---------- WEEKS 1 TO 3: SHARED HELPERS ---------- */
let GEN_OK=0;const GEN_MISS=[];
function SEED(){return (typeof S!=="undefined"&&S&&S.seed!=null)?S.seed:20260901;}
function pctile(sorted,p){const n=sorted.length,pos=p*(n+1);if(pos<=1)return sorted[0];if(pos>=n)return sorted[n-1];const k=Math.floor(pos),f=pos-k;return sorted[k-1]+f*(sorted[k]-sorted[k-1]);}
function median(a){return pctile([...a].sort((x,y)=>x-y),.5);}
function pct(x,d){return fx(100*x,d==null?1:d)+"%";}
/* box plot numbers: whiskers end at the most extreme values that are not outliers; outliers are drawn beyond them */
function boxStats(v){const s=[...v].sort((a,b)=>a-b),q1=pctile(s,.25),md=pctile(s,.5),q3=pctile(s,.75),iqr=q3-q1,lo=q1-1.5*iqr,hi=q3+1.5*iqr;
  const inn=s.filter(x=>x>=lo&&x<=hi);return {s,n:s.length,q1,md,q3,iqr,wLo:inn[0],wHi:inn[inn.length-1],outs:s.filter(x=>x<lo||x>hi),min:s[0],max:s[s.length-1]};}
function skewness(v){const m=mean(v),n=v.length,s=sdv(v);return n/((n-1)*(n-2))*v.reduce((a,x)=>a+((x-m)/s)**3,0);}
function round1(x){return Math.round(x*10)/10;}

/* histogram. o: {lo,hi,bw,xlab,lines:[{v,lab,cls}],cap,hl:fn(binStart)} */
function histo(v,o){const W=360,H=o.h||196,L=34,Rt=348,base=H-40,nb=Math.round((o.hi-o.lo)/o.bw),cnt=Array(nb).fill(0);
  v.forEach(x=>{let b=Math.floor((x-o.lo)/o.bw);b=Math.max(0,Math.min(nb-1,b));cnt[b]++;});
  const ymax=Math.max(...cnt),yt=ticks(0,ymax,4),ytop=Math.max(ymax,yt[yt.length-1]),X=sc(o.lo,o.hi,L,Rt),Y=sc(0,ytop,base,14);
  let g=yt.map(t=>`<line class="v-grid" x1="${L}" x2="${Rt}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-5}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join("");
  cnt.forEach((c,i)=>{const x0=o.lo+i*o.bw;if(c)g+=`<rect x="${X(x0)+.5}" y="${Y(c)}" width="${Math.max(1,X(x0+o.bw)-X(x0)-1)}" height="${base-Y(c)}" fill="${o.hl&&o.hl(x0)?"var(--amber)":"var(--teal)"}" opacity=".85"/>`;});
  g+=axis(X,o.lo,o.hi,base,L,Rt);
  (o.lines||[]).forEach((l,i)=>{g+=`<line x1="${X(l.v)}" x2="${X(l.v)}" y1="${10+i*16}" y2="${base}" stroke="${l.cls==="v-reflab"?"var(--amber)":l.cls==="v-t1lab"?"var(--bad)":"var(--ink)"}" stroke-width="2.5" ${l.dash?'stroke-dasharray="5 3"':""}/><text x="${X(l.v)+(l.left?-5:5)}" y="${20+i*16}" text-anchor="${l.left?"end":"start"}" class="${l.cls||"v-strong"}">${l.lab}</text>`;});
  g+=`<text x="${(L+Rt)/2}" y="${H-4}" text-anchor="middle">${o.xlab}</text>`;
  const top=cnt.indexOf(ymax);
  return vz(W,H,o.label||`Histogram of ${v.length} values of ${o.xlab}. The tallest bar is ${fx(o.lo+top*o.bw,o.bw<1?1:0)} to ${fx(o.lo+(top+1)*o.bw,o.bw<1?1:0)}.${(o.lines||[]).map(l=>" "+l.lab.replace(/<[^>]+>/g,"")+".").join("")}`,g,o.cap);}

/* horizontal box plots, one per group. Whisker ends are labeled; outliers are circles beyond them. */
function boxPlots(groups,o){const W=360,rowH=o.rowH||64,top=10,H=top+rowH*groups.length+46,L=o.L||70,Rt=346,X=sc(o.lo,o.hi,L,Rt),base=H-38;
  let g=axis(X,o.lo,o.hi,base,L,Rt)+`<text x="${(L+Rt)/2}" y="${H-2}" text-anchor="middle">${o.xlab}</text>`;const say=[];
  if(o.ref!=null)g+=`<line class="v-ref" x1="${X(o.ref)}" x2="${X(o.ref)}" y1="${top}" y2="${base}"/><text x="${X(o.ref)+4}" y="${top+10}" class="v-reflab">${o.refLab||""}</text>`;
  groups.forEach((gr,i)=>{const b=boxStats(gr.v),ym=top+i*rowH+rowH/2,y0=ym-12,y1=ym+12;
    if(gr.name)g+=`<text x="${L-8}" y="${ym+4}" text-anchor="end" class="v-strong">${gr.name}</text>`;
    g+=`<line x1="${X(b.wLo)}" x2="${X(b.q1)}" y1="${ym}" y2="${ym}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(b.q3)}" x2="${X(b.wHi)}" y1="${ym}" y2="${ym}" stroke="var(--ink)" stroke-width="1.5"/>`;
    g+=`<line x1="${X(b.wLo)}" x2="${X(b.wLo)}" y1="${ym-8}" y2="${ym+8}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(b.wHi)}" x2="${X(b.wHi)}" y1="${ym-8}" y2="${ym+8}" stroke="var(--ink)" stroke-width="1.5"/>`;
    g+=`<rect x="${X(b.q1)}" y="${y0}" width="${Math.max(1,X(b.q3)-X(b.q1))}" height="${y1-y0}" fill="var(--teal-wash)" stroke="var(--teal)" stroke-width="2"/><line x1="${X(b.md)}" x2="${X(b.md)}" y1="${y0}" y2="${y1}" stroke="var(--teal)" stroke-width="3"/>`;
    if(o.whiskLab)g+=`<text x="${X(b.wLo)}" y="${ym+24}" text-anchor="middle">${o.fmt?o.fmt(b.wLo):b.wLo}</text><text x="${X(b.wHi)}" y="${ym-15}" text-anchor="middle" class="v-strong">${o.fmt?o.fmt(b.wHi):b.wHi}</text>`;
    b.outs.forEach((x,k)=>{g+=`<circle cx="${X(x)}" cy="${ym+(k%2?6:-6)}" r="4.5" fill="none" stroke="var(--bad)" stroke-width="2"/>`;});
    const f=o.fmt||(x=>x);say.push(`${gr.name?gr.name+": ":""}median ${f(b.md)}, box from ${f(b.q1)} to ${f(b.q3)}, whiskers end at ${f(b.wLo)} and ${f(b.wHi)}${b.outs.length?`, ${b.outs.length} outlier${b.outs.length>1?"s":""} beyond the whiskers (${b.outs.map(f).join(", ")})`:", no outliers"}`);});
  return vz(W,H,`Box plot of ${o.xlab}. ${say.join(". ")}.`,g,o.cap===undefined?"Box: the middle half of the values (Q1 to Q3), with the median inside. Whiskers: the lines on each side. Circles: outliers, outside the whiskers.":o.cap);}

/* vertical bar chart for categories, labeled with counts and percentages */
function barChart(names,counts,o){o=o||{};const W=360,H=o.h||200,L=10,Rt=350,base=H-44,n=names.length,bw=(Rt-L)/n,tot=counts.reduce((a,b)=>a+b,0),mx=Math.max(...counts)*1.18,Y=sc(0,mx,base,10);
  let g=`<line class="v-axis" x1="${L}" x2="${Rt}" y1="${base}" y2="${base}"/>`;
  names.forEach((nm,i)=>{const x=L+i*bw,c=counts[i];g+=`<rect x="${x+bw*.18}" y="${Y(c)}" width="${bw*.64}" height="${base-Y(c)}" rx="2" fill="${o.hi===i?"var(--amber)":"var(--teal)"}" opacity=".88"/>`+
    `<text x="${x+bw/2}" y="${Y(c)-5}" text-anchor="middle" class="v-strong">${o.pctOnly?pct(c/tot,0):c}</text>`+
    nm.split("|").map((t,k)=>`<text x="${x+bw/2}" y="${base+15+k*13}" text-anchor="middle">${t}</text>`).join("");});
  return vz(W,H,`Bar chart of ${o.lab||"counts"}: ${names.map((nm,i)=>nm.replace("|"," ")+" "+counts[i]+" ("+pct(counts[i]/tot,0)+")").join("; ")}.`,g,o.cap);}

/* a normal (or t) curve with an optional shaded area. o: {mu,sd,lo,hi,shade:[a,b],xlab,marks:[{v,lab}],df,cap,label} */
function curve(o){const W=360,H=o.h||176,L=14,Rt=346,base=H-40,X=sc(o.lo,o.hi,L,Rt),dens=x=>{const z=(x-o.mu)/o.sd;return Math.exp(-z*z/2);},Y=sc(0,1.08,base,8);
  const pts=[];for(let k=0;k<=160;k++){const x=o.lo+(o.hi-o.lo)*k/160;pts.push([X(x),Y(dens(x))]);}
  let g="";
  if(o.shade){const [a,b]=o.shade,sp=[];for(let k=0;k<=120;k++){const x=Math.max(o.lo,a)+(Math.min(o.hi,b)-Math.max(o.lo,a))*k/120;sp.push(`${X(x)},${Y(dens(x))}`);}
    g+=`<polygon class="v-shade" points="${X(Math.max(o.lo,a))},${base} ${sp.join(" ")} ${X(Math.min(o.hi,b))},${base}"/>`;}
  g+=`<polyline class="v-curve" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  g+=`<line class="v-axis" x1="${L}" x2="${Rt}" y1="${base}" y2="${base}"/>`;
  (o.ticks||[]).forEach(t=>{g+=`<line class="v-axis" x1="${X(t.v)}" x2="${X(t.v)}" y1="${base}" y2="${base+5}"/><text x="${X(t.v)}" y="${base+17}" text-anchor="middle" ${t.strong?'class="v-strong"':""}>${t.lab}</text>`;});
  (o.marks||[]).forEach(m=>{g+=`<line x1="${X(m.v)}" x2="${X(m.v)}" y1="${Y(dens(m.v))-4}" y2="${base}" stroke="var(--amber)" stroke-width="2.5"/><text x="${X(m.v)+(m.left?-5:5)}" y="${Math.max(14,Y(dens(m.v))-8)}" text-anchor="${m.left?"end":"start"}" class="v-reflab">${m.lab}</text>`;});
  g+=`<text x="${(L+Rt)/2}" y="${H-4}" text-anchor="middle">${o.xlab}</text>`;
  return vz(W,H,o.label,g,o.cap);}

/* a grid of people, colored by group: [{n,cls,lab}] */
function people(groups,o){o=o||{};const per=o.per||20,r=6,gap=17,tot=groups.reduce((a,g)=>a+g.n,0),rows=Math.ceil(tot/per),W=per*gap+12,H=rows*gap+12;let k=0,g="";
  groups.forEach(gr=>{for(let i=0;i<gr.n;i++,k++){const x=8+(k%per)*gap+r,y=8+Math.floor(k/per)*gap+r;g+=gr.ring?`<circle cx="${x}" cy="${y}" r="${r-1}" fill="${gr.fill}" stroke="${gr.ring}" stroke-width="2.5"/>`:`<circle cx="${x}" cy="${y}" r="${r}" fill="${gr.fill}"/>`;}});
  return vz(W,H,o.label||groups.map(gr=>gr.n+" "+gr.lab).join(", ")+".",g,o.cap);}

/* SPSS-style crosstab: o.rows, o.cols, o.T, o.stats ("count","row","col","tot"), o.labels, o.pick(i,stat,j)->key */
function crosstab(o){const T=o.T,r=T.map(row=>row.reduce((s,v)=>s+v,0)),c=T[0].map((_,j)=>T.reduce((s,row)=>s+row[j],0)),N=r.reduce((s,v)=>s+v,0);
  const lab=Object.assign({count:"Count",row:`% within ${o.rowVar}`,col:`% within ${o.colVar}`,tot:"% of Total"},o.labels||{});
  const val=(i,s,j)=>{const cnt=i<0?(j<0?N:c[j]):(j<0?r[i]:T[i][j]),rt=i<0?N:r[i],ct=j<0?N:c[j];
    return s==="count"?String(cnt):s==="row"?pct(cnt/rt):s==="col"?pct(cnt/ct):pct(cnt/N);};
  const cell=(i,s,j)=>{const v=val(i,s,j),k=o.pick?o.pick(i,s,j):null;if(!k)return v;
    const rn=i<0?"Total":o.rows[i],cn=j<0?"Total":o.cols[j];
    return `<button class="pick" data-pick="${k}" aria-label="${rn}, ${lab[s].replace(/"/g,"")}, ${o.colVar} ${cn}: ${v}">${v}</button>`;};
  const block=(i,name)=>o.stats.map((s,k)=>`<tr${k===0?' class="grp"':''}>${k===0?`<th scope="rowgroup" rowspan="${o.stats.length}">${name}</th>`:""}<th scope="row" class="stat">${lab[s]}</th>${o.cols.map((_,j)=>`<td>${cell(i,s,j)}</td>`).join("")}<td>${cell(i,s,-1)}</td></tr>`).join("");
  return `<figure class="output"><figcaption>${o.title}${o.note?`<span class="out-note">${o.note}</span>`:""}</figcaption><div class="scroll"><table class="xt"><thead><tr><th scope="col" rowspan="2">${o.rowVar}</th><th scope="col" rowspan="2"><span class="sr">Statistic</span></th><th scope="colgroup" colspan="${o.cols.length}">${o.colVar}</th><th scope="col" rowspan="2">Total</th></tr><tr>${o.cols.map(cn=>`<th scope="col">${cn}</th>`).join("")}</tr></thead><tbody>${o.rows.map((nm,i)=>block(i,nm)).join("")}${block(-1,"Total")}</tbody></table></div></figure>`;}

/* a dark "screen" showing dashboard tiles: [[title,value,sub,warn]] */
function dash(tiles,cap){return `<div class="art art-dash"><span class="sr">Dashboard screen: </span><p class="dash-bar">RIVERBEND ED &middot; LIVE DASHBOARD${cap?` &middot; ${cap}`:""}</p><div class="dash-grid">${tiles.map(t=>`<div class="dash-tile${t[3]?" warn":""}"><span class="dash-t">${t[0]}</span><b>${t[1]}</b>${t[2]?`<span class="dash-s">${t[2]}</span>`:""}</div>`).join("")}</div></div>`;}

function kmFit(t,e){const idx=t.map((_,i)=>i).sort((a,b)=>t[a]-t[b]||e[b]-e[a]);let atRisk=t.length,s=1;const steps=[{t:0,s:1}],cens=[];

function applySeason(){

  k.trust.forEach(id=>{SEASON.trust[id]=Math.min(3,(SEASON.trust[id]||1)+1);});

function npcStatus(p){
  if(p.kind==="core")return S.done.includes(p.idx)?"done":"need";
  if(p.kind==="stats")return S.pendingFU||(S.hiddenUnlocked&&!S.hiddenDone)?"need":"wait";
  if(p.kind==="expert")return S.expDone.length?"done":"need";
  if(p.kind==="cameo")return "wait";
  return S.done.length===4?"need":"wait";
}
function statusText(p){const s=npcStatus(p);if(p.kind==="stats")return S.pendingFU?"Wants to see you":(S.hiddenUnlocked&&!S.hiddenDone?"★ Hidden problem":"Available");if(p.kind==="admin")return s==="need"?"Ready for your report":"Needs 4 sign-offs";if(p.kind==="expert")return s==="done"?"Helped":"Optional";if(p.kind==="cameo")return "No consult this week";return s==="done"?"Signed off":"Needs help";}

function mapSvg(){

  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(GRID[y][x]==="#")s+=`<rect x="${x*TS}" y="${y*TS}" width="${TS}" height="${TS}" class="m-wall"/>`;
  ROOMS.forEach(r=>{const top=r.y0===0;s+=`<text class="m-label" x="${(r.x0+1)*TS+8}" y="${top?(r.y0+1)*TS+22:(r.y0+1)*TS+22}">${r.name}</text>`;

    s+=`<g><rect class="m-clue" x="${cx-11}" y="${cy-14}" width="22" height="28" rx="3"/><line class="m-clue-l" x1="${cx-6}" x2="${cx+6}" y1="${cy-5}" y2="${cy-5}"/><line class="m-clue-l" x1="${cx-6}" x2="${cx+6}" y1="${cy+1}" y2="${cy+1}"/><line class="m-clue-l" x1="${cx-6}" x2="${cx+3}" y1="${cy+7}" y2="${cy+7}"/>`+(read?"":`<g transform="translate(${cx+12},${cy-16})"><circle r="8" class="mk-need"/><text class="mk-t" y="5" text-anchor="middle" style="font-size:12px">?</text></g>`)+`</g>`;});
  NPCS.forEach(p=>{const cx=p.x*TS+TS/2,cy=p.y*TS+TS/2,st=npcStatus(p);
    s+=`<g class="npc" data-id="${p.id}">${p.video?`<rect x="${cx-18}" y="${cy-15}" width="36" height="24" rx="3" fill="${p.color}" stroke="#fff" stroke-width="2"/><rect x="${cx-22}" y="${cy+9}" width="44" height="6" rx="2" fill="${p.color}" stroke="#fff" stroke-width="1.5"/>`:`<circle cx="${cx}" cy="${cy}" r="16" fill="${p.color}" stroke="#fff" stroke-width="2"/>`}<text class="m-init" x="${cx}" y="${cy+(p.video?1:4)}" text-anchor="middle">${p.initials}</text><text class="m-name" x="${cx}" y="${cy+32}" text-anchor="middle">${p.mapName||p.name.split(",")[0]}</text>`;
    if(st!=="wait")s+=`<g transform="translate(${cx+14},${cy-22})"><circle r="10" class="${st==="need"?"mk-need":"mk-done"}"/><text class="mk-t" y="5" text-anchor="middle">${st==="need"?"!":"✓"}</text></g>`;
    s+=`</g>`;});
  s+=`<g id="player" style="transition:transform .11s linear" transform="translate(${S.pos[0]*TS+TS/2},${S.pos[1]*TS+TS/2})"><circle r="16" fill="${S.avatar}" stroke="#fff" stroke-width="3"/><text class="m-init" y="4" text-anchor="middle">You</text></g>`;

function dirHtml(){return `<h2>People and places</h2><ul>${NPCS.map(p=>{const st=npcStatus(p);const cl=p.kind==="core"?`<div class="clue-row">${roomClues(p.idx).map(c=>`<button class="clue-btn" data-clue="${c.id}">${S.clues.includes(c.id)?"✓":"?"} ${c.name}</button>`).join("")}</div>`:"";return `<li><button data-go="${p.id}"><span>${p.name.split(",")[0]}${p.video?" (on video)":""}, ${p.room}</span><span class="tag ${st}">${statusText(p)}</span></button>${cl}</li>`;}).join("")}</ul>`;}

function inspect(c){

  const room=NPCS.find(p=>p.idx===c.idx).room,isNew=!S.clues.includes(c.id);if(isNew)S.clues.push(c.id);
  toast(`<p class="fb-head">${c.name}, ${room}</p>${c.html(S.lock[c.idx])}<p class="where">${isNew?"Added to your notes.":"Already in your notes."}</p>`);

function free(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS&&GRID[y][x]==="."&&!NPCS.some(p=>p.x===x&&p.y===y)&&!CLUES.some(c=>c.x===x&&c.y===y);}
function step(dx,dy){
  if(!mapActive)return;walking=null;const nx=S.pos[0]+dx,ny=S.pos[1]+dy;const npc=NPCS.find(p=>p.x===nx&&p.y===ny);
  if(npc)return interact(npc);const cl=CLUES.find(c=>c.x===nx&&c.y===ny);if(cl)return inspect(cl);if(free(nx,ny)){S.pos=[nx,ny];movePlayer();}
}
function bfs(targets){
  const key=(x,y)=>x+","+y,prev={},q=[S.pos];prev[key(...S.pos)]=null;
  while(q.length){const [x,y]=q.shift();if(targets.some(t=>t[0]===x&&t[1]===y)){const path=[];let k=key(x,y);while(prev[k]){path.unshift(k.split(",").map(Number));k=prev[k];}return path;}
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy,k=key(nx,ny);if(!(k in prev)&&free(nx,ny)){prev[k]=key(x,y);q.push([nx,ny]);}});}
  return null;
}
function walkTo(tx,ty,npc){
  const targets=npc?[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[npc.x+dx,npc.y+dy]).filter(t=>free(t[0],t[1])):[[tx,ty]];
  const path=bfs(targets);if(!path)return;const token={};walking=token;const act=o=>o.html?inspect(o):interact(o);
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tick=()=>{if(walking!==token||!mapActive)return;if(!path.length){walking=null;if(npc)act(npc);return;}S.pos=path.shift();movePlayer();setTimeout(tick,reduce?15:95);};tick();
}
function goTo(npc){walkTo(null,null,npc);}
document.addEventListener("keydown",ev=>{
  if(!mapActive||ev.target.closest("button,input,textarea,select,a"))return;
  const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]}[ev.key];
  if(!d)return;ev.preventDefault();const now=Date.now();if(now-lastStep<85)return;lastStep=now;step(...d);
});

function interact(p){
  const first=p.name.split(" ")[0]==="Dr."?p.name.split(",")[0]:p.name.split(" ")[0];
  if(p.kind==="cameo")return toast(`<strong>${first}:</strong> "${(WEEK.cameo[p.id]||(()=>"Busy week. Come find me later."))(SEASON)}"`);
  if(p.kind==="stats"){if(!S.pendingFU&&S.hiddenUnlocked&&!S.hiddenDone&&WEEK.hidden)return startUnit(WEEK.hidden(),"hidden",null,p);if(S.pendingFU)return startUnit(FOLLOWUPS[S.pendingFU](),"fu",null,p);return toast(`<strong>Jordan:</strong> "Nothing for now. If you get stuck in a consult, call me for a hint."`);}
  if(p.kind==="admin"){if(S.done.length<4)return toast(`<strong>Dr. Brooks:</strong> "I need all four sign-offs for the report. You have ${S.done.length} of 4."`);return finalReport();}
  if(S.pendingFU)return toast(`<strong>${first}:</strong> "Jordan from Statistics was looking for you. Go see them first."`);
  if(p.kind==="expert"){if(S.expDone.length)return toast(`<strong>${first}:</strong> "${WEEK.expertThanks}"`);return startUnit(expertCase(),"expert",null,p);}
  if(S.done.includes(p.idx))return toast(`<strong>${first}:</strong> "Thanks again! You already have my sign-off."`);
  const missing=roomClues(p.idx).filter(c=>!S.clues.includes(c.id));
  if(missing.length)return toast(`<strong>${first}:</strong> "Hi! Before we sit down, take a look at the ${missing.map(c=>c.name.toLowerCase()).join(" and the ")} first."`);
  const lvl=S.lock[p.idx]??S.level;startUnit(CORE[p.idx](coreRng(p.idx),lvl),"core",lvl,p);
}

function showStep(unit,i,kind,lvl){

    ${st.type==="build"?`<table class="build"><thead><tr><th scope="col">${st.spec.varHead||"Variable"}</th><th scope="col">${st.spec.typeHead||"Type"}</th><th scope="col">${st.spec.roleHead||"Role"}</th></tr></thead><tbody>${st.spec.vars.map((v,k)=>`<tr data-brow="${v[0]}"><th scope="row"><label for="role-${v[0]}"><code>${v[0]}</code><span class="rowstat"></span><span class="where">${v[1]}</span></label></th><td><span class="typ">${v[2]}</span></td><td><select id="role-${v[0]}" data-var="${v[0]}" aria-label="${st.spec.roleHead||"Role"} for ${v[0]}">${st.spec.roles?st.spec.roles.map(([rv,rl])=>`<option value="${rv}">${rl}</option>`).join(""):`<option value="">Not used</option><option value="outcome">Outcome</option><option value="factor">Factor</option>${st.spec.mode==="ancova"?'<option value="covariate">Covariate</option>':""}`}</select></td></tr>`).join("")}</tbody></table>
    ${st.spec.mode==="ancova"||st.spec.noDesign?"":`<fieldset id="designQ"><legend>${st.spec.designQ||"Was anyone measured more than once (in more than one group)?"}<span class="rowstat"></span></legend><div class="radios${st.spec.designQ?" stack":""}"><label><input type="radio" name="rep" value="yes"> ${st.spec.designYes||"Yes"}</label><label><input type="radio" name="rep" value="no"> ${st.spec.designNo||"No"}</label></div></fieldset>`}
    <button class="quiet" id="runB">${st.spec.run||"Run analysis"}</button>`:""}
    <div class="opts" role="group" aria-label="Your reply">${(st.options||[]).map((o,k)=>[Math.random(),o,k]).sort((x,y)=>x[0]-y[0]).map(([_,o,k])=>`<button class="opt" data-k="${k}"><span class="opt-mark" aria-hidden="true"></span><span class="opt-text">${o.t}</span><span class="sr st-sr"></span></button>`).join("")}</div>

  if(st.init)st.init();
  markScrollers();
  const pr=box.querySelector(".prompt");if(i>0){pr.scrollIntoView({behavior:"smooth",block:"start"});pr.focus({preventScroll:true});}
  const fb=document.getElementById("fb");
  /* hints can be one line or [where to look, the key idea]; the second only if asked again */

    const ht=document.getElementById("hintText");
    ht.insertAdjacentHTML("beforeend",`${hintN?"":`<p class="fb-head">Jordan, on the phone</p>`}<p>${hints[hintN]}</p>`);hintN++;

  if(st.type==="build"){let busyB=false;
    /* mark every row right or wrong, lock the right ones, and give a reason for each wrong one */

    const gradeBuild=tag=>{const tmode=st.spec.mode==="t",F=tmode?"grouping variable":"factor",nm=shortName(unitNpc(unit)),bad=[];let okN=0,n=0;
      box.querySelectorAll("tr[data-brow]").forEach(tr=>{const v=tr.dataset.brow,sl=tr.querySelector("select"),got=sl.value,want=bWant(v),type=(st.spec.vars.find(x=>x[0]===v)||[])[2],stat=tr.querySelector(".rowstat");n++;
        if(got===want){okN++;tr.classList.add("row-ok");tr.classList.remove("row-bad");stat.textContent=" ✓ Right";sl.disabled=true;}
        else{tr.classList.add("row-bad");stat.textContent=" ✗ Look again";bad.push(`<code>${v}</code> ${buildReason(type,want,got,F,nm,v,st.spec)}`);}});
      const dq=box.querySelector("#designQ");
      if(dq){n++;const r=box.querySelector('input[name="rep"]:checked'),got=r?r.value:null,want=tmode?st.spec.compare:(st.spec.repeated?"yes":"no"),stat=dq.querySelector(".rowstat");
        if(got===want){okN++;dq.classList.add("row-ok");dq.classList.remove("row-bad");stat.textContent=" ✓ Right";dq.querySelectorAll("input").forEach(x=>x.disabled=true);}
        else{dq.classList.add("row-bad");stat.textContent=" ✗ Look again";bad.push(designReason(want,got,tmode,st.spec));}}
      const extra=st.spec.msgs&&st.spec.msgs[tag]&&st.spec.msgs[tag].includes("<figure")?st.spec.msgs[tag]:"";
      return `<p><strong>${okN} of ${n} choices fit.</strong> ${okN?"The ones marked ✓ are locked in. ":""}Change the ones marked ✗.</p>`+bad.map(x=>`<p>${x}</p>`).join("")+extra;};
    const unflag=el=>{const row=el.closest("tr[data-brow],#designQ");if(row&&row.classList.contains("row-bad")){row.classList.remove("row-bad");row.querySelector(".rowstat").textContent="";}};
    box.querySelectorAll("tr[data-brow] select,#designQ input").forEach(el=>el.addEventListener("change",()=>unflag(el)));
    document.getElementById("runB").onclick=()=>{
      if(done||busyB)return;const sel=[...box.querySelectorAll("select[data-var]")],r=box.querySelector('input[name="rep"]:checked');
      const anc=st.spec.mode==="ancova";
      const b={outcomes:sel.filter(x=>x.value==="outcome").map(x=>x.dataset.var),factors:sel.filter(x=>x.value==="factor").map(x=>x.dataset.var),
               covs:sel.filter(x=>x.value==="covariate").map(x=>x.dataset.var),roles:Object.fromEntries(sel.map(x=>[x.dataset.var,x.value])),repeated:anc?false:(r?r.value==="yes":null)};
      const tag=evalBuild(st.spec,b),name=analysisName(b,st.spec.vars,st.spec);
      if(rec.first===null){rec.first=tag;rec.hintBefore=hintUsed;}
      if(tag==="correct"){done=true;if(wrongs===0)cred(hintUsed?5:10);
        reactOk(fb,unitNpc(unit),`<p><strong>${st.spec.okHead||`Analysis runs: ${name}.`}</strong> ${st.spec.ok} The results are shown above.</p>`);document.getElementById("vizSlot").innerHTML=unit.viz||"";markScrollers();
        box.querySelectorAll("select,input,#runB").forEach(e=>e.disabled=true);const hb=document.getElementById("hintBtn");if(hb)hb.remove();
        document.getElementById("next").innerHTML=`<button class="primary" id="nextBtn">Next</button>`;document.getElementById("nextBtn").onclick=()=>showStep(unit,i+1,kind,lvl);
      }else{if(busyB)return;wrongs++;busyB=true;const m=(st.spec.msgs&&st.spec.msgs[tag])||BUILD_MSG[tag],notReady=tag==="no_design"||tag==="no_choice"||tag==="outcome_misread"&&!b.outcomes.length;
        document.getElementById("runB").disabled=true;
        playWrong(fb,unitNpc(unit),notReady?"Checking your setup…":(st.spec.runText||`Running ${name}…`),gradeBuild(tag),()=>cred(-4),()=>{busyB=false;document.getElementById("runB").disabled=false;});}
    };
  }
  let busy=false;const who=unitNpc(unit);
  box.querySelectorAll(".opt").forEach(btn=>{btn.onclick=()=>{
    if(done||busy||btn.getAttribute("aria-disabled")==="true")return;const o=st.options[+btn.dataset.k];
    if(rec.first===null){rec.first=o.tag;rec.hintBefore=hintUsed;}
    const inner=o.fb.trim().startsWith("<")?o.fb:`<p>${o.fb}</p>`;
    if(o.tag==="correct"){done=true;btn.classList.add("right");btn.querySelector(".st-sr").textContent=" (correct)";
      box.querySelectorAll(".opt").forEach(b=>{b.setAttribute("aria-disabled","true");b.classList.add("locked");b.classList.remove("chosen");});
      if(wrongs===0)cred(hintUsed?5:10);reactOk(fb,who,inner);
      const hb=document.getElementById("hintBtn");if(hb)hb.remove();
      document.getElementById("next").innerHTML=`<button class="primary" id="nextBtn">${i===n-1?"Wrap up":"Next"}</button>`;
      document.getElementById("nextBtn").onclick=()=>showStep(unit,i+1,kind,lvl);
    }else{wrongs++;busy=true;btn.classList.add("chosen");
      playWrong(fb,who,`You give ${firstName(who)} your answer…`,inner,
        ()=>{btn.classList.remove("chosen");btn.classList.add("wrong");btn.setAttribute("aria-disabled","true");btn.querySelector(".st-sr").textContent=" (not correct)";cred(-4);},
        ()=>{busy=false;});}
  };});

  const mark=(el,cls)=>{el.classList.remove("chosen");el.classList.add(cls);};
  const wrapP=t=>t.trim().startsWith("<")?t:`<p>${t}</p>`;
  const okFinish=body=>{done=true;if(wrongs===0)cred(hintUsed?5:10);reactOk(fb,who,body);const hb=document.getElementById("hintBtn");if(hb)hb.remove();
    document.getElementById("next").innerHTML=`<button class="primary" id="nextBtn">${i===n-1?"Wrap up":"Next"}</button>`;document.getElementById("nextBtn").onclick=()=>showStep(unit,i+1,kind,lvl);};
  const badFinish=(el,action,body)=>{wrongs++;busy=true;if(el)el.classList.add("chosen");
    playWrong(fb,who,action,wrapP(body),()=>{cred(-4);if(el){mark(el,"wrong");el.setAttribute("aria-disabled","true");}},()=>{busy=false;});};
  /* Grade a multi-part answer row by row: lock and collapse the rows that are right,
     flag the ones that aren't, and explain every flagged row, not just the first. */
  const gradeRows=(root,sel)=>{const wrong=[];
    st.slots.forEach((sl,si)=>{const o=sl.options[sel[si]],row=root.querySelector(`[data-row="${si}"]`),stat=row&&row.querySelector(".rowstat");
      if(!row)return;
      if(o.tag==="correct"){row.classList.add("row-ok");row.classList.remove("row-bad");if(stat)stat.textContent=" \u2713 Right";
        row.querySelectorAll(".tile").forEach(t=>{t.disabled=true;if(t.getAttribute("aria-pressed")!=="true")t.hidden=true;});}
      else{row.classList.add("row-bad");if(stat)stat.textContent=" \u2717 Look again";
        wrong.push({label:sl.label,fb:String(o.fb||"That piece doesn't fit what the data show.").replace(/<\/?p>/g,"")});}});
    const n=st.slots.length,k=n-wrong.length;
    const lead=n>1?`<p><strong>${k} of ${n} pieces fit.</strong> ${k?"The rows marked \u2713 are locked in. ":""}Change the row${wrong.length>1?"s":""} marked \u2717.</p>`:"";
    return lead+wrong.map(w=>`<p>${n>1?`<strong>${w.label}:</strong> `:""}${w.fb}</p>`).join("");};
  const clearRow=b=>{const row=b.closest("[data-row]");if(row&&row.classList.contains("row-bad")){row.classList.remove("row-bad");const st2=row.querySelector(".rowstat");if(st2)st2.textContent="";}};
  let lockAll=()=>{};
  const choose=(el,item,action)=>{if(done||busy||el.getAttribute("aria-disabled")==="true")return;if(rec.first===null){rec.first=item.tag;rec.hintBefore=hintUsed;}
    if(item.tag==="correct"){mark(el,"right");lockAll();okFinish(wrapP(item.fb));}else badFinish(el,action,item.fb);};
  if(st.type==="spot"){
    box.querySelector(".opts").outerHTML=`<div class="draft"><p class="draft-title">${st.draftTitle}</p><p>${st.draft.map((d,k)=>`<button class="sent" data-k="${k}">${d.t}</button>`).join(" ")}</p></div>`;
    lockAll=()=>box.querySelectorAll(".sent").forEach(b=>b.setAttribute("aria-disabled","true"));
    box.querySelectorAll(".sent").forEach(b=>b.onclick=()=>choose(b,st.draft[+b.dataset.k],`You flag that sentence for ${firstName(who)}…`));
  }
  if(st.type==="cards"){
    box.querySelector(".opts").outerHTML=`${st.context?`<div class="recap"><p class="recap-h">${st.contextTitle||"The facts on the table"}</p>${String(st.context).replace(/= (&lt;|<)/g,"$1 ")}</div>`:""}${st.claim?`<div class="bubble claim">${st.claim}</div>`:""}<div class="cards" role="group" aria-label="Evidence cards">${st.cards.map((c,k)=>[Math.random(),c,k]).sort((x,y)=>x[0]-y[0]).map(([_,c,k])=>`<button class="ecard" data-k="${k}"><span class="etag">${c.k||"Evidence"}</span>${c.t}</button>`).join("")}</div>`;
    lockAll=()=>box.querySelectorAll(".ecard").forEach(b=>b.setAttribute("aria-disabled","true"));
    box.querySelectorAll(".ecard").forEach(b=>b.onclick=()=>choose(b,st.cards[+b.dataset.k],"You lay your evidence card on the table…"));
  }
  if(st.type==="point"){
    lockAll=()=>box.querySelectorAll("[data-pick]").forEach(b=>b.setAttribute("aria-disabled","true"));
    box.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const it=st.picks[b.dataset.pick];if(it)choose(b,it,`You point it out to ${firstName(who)}…`);});
  }

  if(st.type==="reply"||st.type==="interview"){
    const bub=(you,t)=>`<div class="msg ${you?"you":"them"}"><span class="msg-who">${you?"You":firstName(who)}</span>${t}</div>`;
    box.querySelector(".opts").outerHTML=`<div class="thread ${st.channel||"chat"}">${st.channel==="email"?`<div class="mailhead"><span><strong>From:</strong> ${who.name}</span><span><strong>Subject:</strong> ${st.subject||""}</span></div>`:""}<div class="msgs" id="msgs" aria-live="polite">${(st.thread||[]).map(m=>bub(false,m)).join("")}</div>${st.type==="interview"?`<div class="asks"><span class="slotlab" style="width:100%">Ask ${firstName(who)}:</span>${st.questions.map((q,k)=>`<button class="ask" data-k="${k}">${q.q}</button>`).join("")}</div>`:""}<div id="composeHost"></div></div>`;
    const msgs=document.getElementById("msgs"),addMsg=(you,t)=>msgs.insertAdjacentHTML("beforeend",bub(you,t));
    const doCompose=()=>{
      const host=document.getElementById("composeHost"),sel=st.slots.map(()=>null);
      host.innerHTML=`<div class="compose"><span class="slotlab">Build your ${st.channel==="email"?"email":"reply"} from the pieces</span>${st.slots.map((sl,si)=>`<div class="slotrow" data-row="${si}"><span class="slotlab">${sl.label}<span class="rowstat"></span></span><div class="tiles">${sl.options.map((o,oi)=>[Math.random(),oi]).sort((x,y)=>x[0]-y[0]).map(([_,oi])=>`<button class="tile" aria-pressed="false" data-s="${si}" data-o="${oi}">${sl.options[oi].t}</button>`).join("")}</div></div>`).join("")}<div class="draftmsg" id="draftmsg">…</div><button class="primary" id="sendBtn">${st.channel==="email"?"Send email":"Send"}</button></div>`;
      const txt=()=>sel.map((x,si)=>x===null?"…":st.slots[si].options[x].t).join(" ");
      host.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(done||busy||b.disabled)return;clearRow(b);const si=+b.dataset.s;sel[si]=+b.dataset.o;host.querySelectorAll(`.tile[data-s="${si}"]`).forEach(t=>t.setAttribute("aria-pressed",t===b?"true":"false"));document.getElementById("draftmsg").textContent=txt();});
      document.getElementById("sendBtn").onclick=()=>{
        if(done||busy)return;if(sel.some(x=>x===null)){fb.innerHTML=`<p class="where">Pick a piece from each row first.</p>`;return;}
        addMsg(true,txt());const bad=sel.map((x,si)=>st.slots[si].options[x]).find(o=>o.tag!=="correct"),tag=bad?bad.tag:"correct";
        if(rec.first===null){rec.first=tag;rec.hintBefore=hintUsed;}
        if(!bad){host.querySelectorAll("button").forEach(b=>b.disabled=true);box.querySelectorAll(".ask").forEach(b=>b.disabled=true);if(st.reveal){const vs=document.getElementById("vizSlot");if(vs)vs.innerHTML=unit.viz||"";markScrollers();}okFinish(wrapP(st.okFb));}
        else badFinish(null,`${firstName(who)} is typing…`,gradeRows(host,sel));};
    };
    if(st.type==="reply")doCompose();
    else{let opened=false;box.querySelectorAll(".ask").forEach(b=>b.onclick=()=>{if(done||busy||b.disabled)return;const q=st.questions[+b.dataset.k];b.disabled=true;addMsg(true,q.q);addMsg(false,q.a);if(!q.key)cred(-1);if(q.key&&!opened){opened=true;doCompose();}});}
  }
  if(st.type==="tiles"){
    const sel=st.slots.map(()=>null);
    box.querySelector(".opts").outerHTML=`${st.slots.map((sl,si)=>`<fieldset data-row="${si}"><legend>${sl.label}<span class="rowstat"></span></legend><div class="tiles">${sl.options.map((o,oi)=>[Math.random(),oi]).sort((x,y)=>x[0]-y[0]).map(([_,oi])=>`<button class="tile" aria-pressed="false" data-s="${si}" data-o="${oi}">${sl.options[oi].t}</button>`).join("")}</div></fieldset>`).join("")}<p class="headline" id="hl" aria-live="polite">Pick one tile from each row to build the headline.</p><button class="quiet" id="present">Present the headline</button>`;
    const upd=()=>{document.getElementById("hl").textContent=sel.map((x,si)=>x===null?"…":st.slots[si].options[x].t).join(" ")+(sel.every(x=>x!==null)?".":"");};
    box.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(done||busy||b.disabled)return;clearRow(b);const si=+b.dataset.s;sel[si]=+b.dataset.o;box.querySelectorAll(`.tile[data-s="${si}"]`).forEach(t=>t.setAttribute("aria-pressed",t===b?"true":"false"));upd();});
    document.getElementById("present").onclick=()=>{
      if(done||busy)return;if(sel.some(x=>x===null)){fb.innerHTML=`<p class="where">Pick a tile from each row first.</p>`;return;}
      const bad=sel.map((x,si)=>st.slots[si].options[x]).find(o=>o.tag!=="correct"),tag=bad?bad.tag:"correct";
      if(rec.first===null){rec.first=tag;rec.hintBefore=hintUsed;}
      if(!bad){box.querySelectorAll(".tile,#present").forEach(e=>e.disabled=true);okFinish(wrapP(st.okFb));}
      else badFinish(null,`You present the headline to ${firstName(who)}…`,gradeRows(box,sel));};
  }
}
function showOutro(unit,kind,lvl){
  const g=id=>valueOf(S.results[id]).replace("correct_hint","correct"),oc=unit.outro(g),box=document.getElementById("steps");
  box.innerHTML=`<div class="outro"><div class="status ${oc.ok?"":"mixed"}"><span class="status-icon" aria-hidden="true">${oc.ok?"✓":"↺"}</span><div><p class="status-title">${oc.title}</p><p>${oc.text}</p></div></div>
    <p class="takeaway"><strong>Takeaway:</strong> ${unit.takeaway}</p><div class="actions"><button class="primary" id="cont">${kind==="finale"?"File the report and see my results":"Back to the hallway"}</button></div></div>`;
  const h=box.querySelector(".status-title");box.querySelector(".outro").scrollIntoView({behavior:"smooth",block:"start"});
  document.getElementById("cont").onclick=()=>{if(kind==="finale"){S.finaleDone=true;if(WEEK.epilogue){save();finalReport();return;}S.phase="done";applySeason();save();gcount("finished",`Episode ${WEEK.num} finished`);renderSummary();}else unitDone(unit,kind,lvl);};document.getElementById("cont").focus({preventScroll:true});
}
function unitDone(unit,kind,lvl){
  let msg="";
  if(kind==="core"){const idx=+unit.id.slice(1)-1;S.done.push(idx);S.path[idx]=lvl;
    const ids=unit.steps.map(s=>s.id),misses=ids.filter(id=>!S.results[id]||S.results[id].first!=="correct"),hinted=ids.filter(id=>S.results[id]&&S.results[id].hintBefore);
    if(misses.length===0&&hinted.length===0)S.level=1;else if(misses.length>=2)S.level=0;
    if(S.fuDone.length<1)for(const id of misses){const fu=FU_MAP[S.results[id]&&S.results[id].first];if(fu&&!S.fuDone.includes(fu)){S.pendingFU=fu;break;}}
    msg=`Sign-off collected (${S.done.length} of 4).`+(S.done.length===4?" Take the report to Dr. Brooks in the Quality Office.":"");
    if(S.done.length===4&&!S.pendingFU&&WEEK.hidden&&!S.hiddenUnlocked&&CORE.every((c,ci)=>c(coreRng(ci),S.path[ci]).steps.every(st=>S.results[st.id]&&S.results[st.id].first==="correct"))){S.hiddenUnlocked=true;msg+=` ★ Jordan texts: "You didn't need me once this week. Come to Statistics. There's something strange in the data."`;}
  }else if(kind==="hidden"){S.hiddenDone=true;msg="★ Hidden problem solved. Jordan is impressed.";
  }else if(kind==="fu"){S.fuDone.push(unit.id);S.pendingFU=null;msg="Jordan's done with you. Back to the consults.";}
  else{S.expDone.push(unit.id);msg="Nice work on the optional consult.";}
  save();renderMap();if(!S.pendingFU)toast(msg);
}
function finalReport(){
  if(WEEK.finale&&!S.finaleDone){const b=NPCS.find(q=>q.id==="brooks");return startUnit(WEEK.finale(S),"finale",null,b);}
  mapActive=false;const p=NPCS.find(q=>q.id==="brooks");
  app.innerHTML=WEEK.epilogue?WEEK.epilogue(S):`<div class="talk-head">${portrait(p)}<div><p class="where">${p.room}</p><h1 tabindex="-1">Filing the quality report</h1><p class="who">${p.name}, ${p.role}</p></div></div>
    <div class="bubble"><p>${WEEK.ending({...SEASON.flags,...WEEK.keyFlags(S).flags})}</p></div>
    <div class="actions"><button class="primary" id="file">File the report and see my results</button><button class="quiet" id="back">Not yet, back to the floor</button></div>`;
  app.querySelector("h1").focus();
  document.getElementById("file").onclick=()=>{S.phase="done";applySeason();save();if(WEEK.epilogue)gcount("finished",`Episode ${WEEK.num} finished`);renderSummary();};
  document.getElementById("back").onclick=()=>renderMap();
}
function buildPayload(){
  const parts=[`Mission ${CONFIG.mission}`,`version ${CONFIG.version}`,`save ${MODE==="season"?"on":"off"}`,`case levels ${[0,1,2,3].map(i=>S.path[i]??"-").join("")}`,`credibility ${S.cred}`,`hints ${S.hints}`,`minutes ${Math.round((Date.now()-S.started)/60000)}`];
  const add=(u,name)=>u.steps.forEach(st=>{const v=valueOf(S.results[st.id]);if(v)parts.push(`${name}, ${st.label}: ${v}`);});
  CORE.forEach((c,i)=>{if(S.done.includes(i)){const u=c(coreRng(i),S.path[i]);add(u,`Case ${i+1} (${u.title})`);}});
  if(WEEK.finale&&S.finaleDone){const u=WEEK.finale(S);add(u,u.title);}
  if(S.hiddenDone&&WEEK.hidden){const u=WEEK.hidden();add(u,"Hidden problem ("+u.title+")");}
  S.fuDone.forEach(id=>{const u=FOLLOWUPS[id]();add(u,u.title);});
  if(S.expDone.length)add(expertCase(),"Optional ("+expertCase().title+")");
  return {results:parts.join(" | ").replace(/α/g,"alpha").replace(/μ/g,"mu")};
}
function renderSummary(){
  mapActive=false;setBar("Results");
  const units=CORE.map((c,i)=>c(coreRng(i),S.path[i]||0)),coreSteps=units.flatMap(u=>u.steps);
  const first=coreSteps.filter(s=>S.results[s.id]&&S.results[s.id].first==="correct").length;
  const status=id=>{const v=valueOf(S.results[id]);return v==="correct"?`<span class="st ok">First try</span>`:v==="correct_hint"?`<span class="st ok">First try, with a hint</span>`:`<span class="st retry">Took another try</span>`;};
  const payload=buildPayload(),configured=!!CONFIG.qualtricsUrl;
  const codeBox=MODE==="season"?`<div class="submit-box" style="margin:1rem 0"><h2>Your career code</h2><p>${WEEK.codeNote||"Your season is saved on this browser. To continue on another device, keep this code somewhere safe:"}</p><p><code id="ccode" style="font-size:1.15rem">${encodeCareer(SEASON)}</code> <button class="quiet" id="copyc">Copy</button></p></div>`
    :`<div class="submit-box" style="margin:1rem 0"><h2>Played without saving</h2><p>Nothing was saved on this device.</p><p id="ccWrap"><button class="linkish" id="showc">Get a career code anyway</button></p></div>`;
  app.innerHTML=`<p class="where">Report filed</p><h1 tabindex="-1">${title()}</h1>
    <div class="stats"><div class="stat"><b>${first} of ${coreSteps.length}</b><span>right on the first try</span></div><div class="stat"><b>${S.cred}</b><span>reputation</span></div><div class="stat"><b>${S.hints}</b><span>hints</span></div></div>${S.hiddenDone?`<p class="takeaway">★ You solved this week's hidden problem.</p>`:""}
    <div class="submit-box">${configured?`<h2>Submit your results</h2><p>You'll go to a short anonymous survey. Your game results go along automatically, without your name. <strong>Click the arrow at the bottom of the survey to finish.</strong></p><div class="actions"><button class="primary" id="submit">Submit my results</button></div>`:`<h2>Instructor preview</h2><p>No survey connected.</p>`}</div>
    <div class="bubble"><p><strong>${WEEK.teaserLabel||"Next week:"}</strong> ${WEEK.teaser}</p></div>${codeBox}<ul class="review">${units.flatMap(u=>u.steps.map(s=>`<li><span>${u.title}: ${s.label}</span>${status(s.id)}</li>`)).join("")}</ul>
    ${(!configured||PREVIEW)?`<h2>What gets sent</h2><p style="font-size:.9rem;overflow-wrap:anywhere">${payload.results}</p>`:""}
    <div class="actions"><button class="linkish" id="restart">Play again from the start</button></div>`;
  window.scrollTo(0,0);app.querySelector("h1").focus({preventScroll:true});
  const cp=document.getElementById("copyc");if(cp)cp.onclick=()=>{const t=document.getElementById("ccode").textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{cp.textContent="Copied";},()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("ccode"));getSelection().removeAllRanges();getSelection().addRange(r);cp.textContent="Selected: press Ctrl+C";});};
  const shc=document.getElementById("showc");if(shc)shc.onclick=()=>{document.getElementById("ccWrap").innerHTML=`<code style="font-size:1.15rem">${encodeCareer(SEASON)}</code><br><span class="where">Enter it at the start of next week's game to keep your story.</span>`;};
  const sb=document.getElementById("submit");if(sb)sb.onclick=()=>{const u=new URL(CONFIG.qualtricsUrl);u.searchParams.set("results",payload.results);location.href=u.toString();};
  document.getElementById("restart").onclick=()=>{if(!confirm("Start over? Your results on this device will be erased."))return;clearSaved();S=null;renderIntro();};
}
renderIntro();
}
